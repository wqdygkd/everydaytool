  };

  const sourceStats = (s) => {
    const rows = LIB.collections.filter((c) => c.sourceId === s.id);
    return {
      count: rows.length,
      items: rows.reduce((n, c) => n + itemTotal(c), 0),
      size: rows.reduce((n, c) => n + parseFloat(c.size || "0"), 0).toFixed(1)
    };
  };

  const sourcesViewHTML = () => {
    const total = totalSize();
    return `<div class="view-head">
      <div>
        <h1>来源</h1>
        <p>扫描以来源为单位。文件移动或删除后，重新扫描即可更新；edt 不会自动删除索引，也不会碰原文件。</p>
      </div>
      <div class="view-head-actions">
        <a class="btn secondary" href="#import">${icon("folderPlus", 14)}添加来源</a>
      </div>
    </div>
    <div class="summary-line">
      <span><b>${LIB.sources.length}</b> 个来源</span>
      <span><b>${LIB.collections.length}</b> 个合集</span>
      <span><b>${totalItems().toLocaleString("en-US")}</b> 个条目</span>
      <span><b>${total} GB</b> 已索引</span>
    </div>
    <div class="source-list">
      ${LIB.sources.map((s) => {
        const st = sourceStats(s);
        return `<div class="source-row">
          <div class="source-main">
            <b>${esc(s.label)} ${s.status === "changed" ? `<span class="tag warn">有变更</span>` : ""}</b>
            <span class="source-path">${esc(s.path)}</span>
          </div>
          <span class="source-cell">${st.count} 个合集</span>
          <span class="source-cell">${st.items.toLocaleString("en-US")} 项</span>
          <span class="source-cell">${st.size} GB</span>
          <div class="source-actions">
            <span class="source-status ${s.status === "changed" ? "changed" : ""}"><i></i>${s.status === "changed" ? "待重扫" : "已索引"}</span>
            <button class="btn ghost" data-action="rescan-source" data-id="${s.id}">${icon("refresh", 13)}扫描</button>
            <button class="icon-btn sm" data-action="remove-source" data-id="${s.id}" aria-label="移除来源 ${esc(s.label)}">${icon("more", 14)}</button>
          </div>
        </div>`;
      }).join("")}
    </div>
    <div class="scan-log-block">
      <h3>最近扫描</h3>
      <div class="scan-log">
        ${LIB.scans.map((s) => `<div class="scan-log-row">${icon(s.tone === "warn" ? "warning" : "check", 12)}<span>${esc(s.when)}</span><span>${esc(s.source)}</span><span>${esc(s.result)}</span></div>`).join("")}
      </div>
    </div>`;
  };

  const inboxViewHTML = () => {
    const rows = LIB.collections.filter(hasNeeds);
    return `<div class="view-head">
      <div>
        <h1>待整理</h1>
        <p>已导入但缺少艺人、标签或封面的合集。补全后更容易被搜到；原文件夹不会被修改。</p>
      </div>
      <div class="view-head-actions">
        <a class="btn secondary" href="#import">${icon("folderPlus", 14)}继续导入</a>
      </div>
    </div>
    <div class="summary-line">
      <span><b>${rows.length}</b> 个合等待完善</span>
      <span>缺少艺人 <b>${rows.filter((c) => c.needs.includes("artist")).length}</b></span>
      <span>缺少标签 <b>${rows.filter((c) => c.needs.includes("tags")).length}</b></span>
      <span>缺少封面 <b>${rows.filter((c) => c.needs.includes("cover")).length}</b></span>
    </div>
    ${rows.length ? `<div class="notice">${icon("info", 14)}<span>给合集补上艺人与标签后，它会出现在资料库的筛选结果里。封面可以稍后再挑，不影响浏览。</span></div>` : ""}
    ${rows.length ? `<div class="card-grid">
      ${rows.map(cardHTML).join("")}
      <a class="add-tile" href="#import">${icon("folderPlus", 24)}<b>导入更多</b><small>只读取，不改动原文件</small></a>
    </div>` : `<div class="empty">
      <span class="empty-icon">${icon("check", 20)}</span>
      <h3>全部整理完毕</h3>
      <p>所有合集都有艺人和标签了。下一次导入的新内容会出现在这里。</p>
      <a class="btn secondary" href="#library">回到资料库</a>
    </div>`}`;
  };

  /* ─────────────────────────────────────────────────────────────
     Main render
  ───────────────────────────────────────────────────────────── */
  const viewHTML = () => {
    if (state.path === "detail" || state.path === "edit") {
      const c = byId(state.id);
      return c ? detailViewHTML(c) : "";
    }
    if (state.path === "tags") return tagsViewHTML();
    if (state.path === "artists") return artistsViewHTML();
    if (state.path === "series") return seriesViewHTML();
    if (state.path === "sources") return sourcesViewHTML();
    if (state.path === "inbox") return inboxViewHTML();
    return libraryViewHTML();
  };

  const renderView = (opts = {}) => {
    const pane = $("#pane");
    if (!pane) return;
    const wasTop = pane.scrollTop < 4;
    const previousScroll = pane.scrollTop;
    pane.innerHTML = viewHTML();
    if (opts.preserveScroll) {
      pane.scrollTop = previousScroll;
    } else if (state.path === "library" || state.path === "inbox" || state.path === "import") {
      if (wasTop) pane.scrollTop = 0;
    } else {
      pane.scrollTop = 0;
    }
  };

  const renderResults = () => {
    const results = $("#results");
    if (!results) return;
    results.innerHTML = resultsHTML();
    const count = $("#result-count");
    if (count) count.textContent = `${filteredCollections().length} 个合集`;
    const chips = $("#library-toolbar .filter-chips");
    if (chips) {
      const fresh = document.createElement("div");
      fresh.innerHTML = filterChipsHTML();
      chips.replaceWith(fresh.firstElementChild);
    }
    updateToolbarState();
  };

  const updateToolbarState = () => {
    $$("#library-toolbar .seg-btn").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.type === state.type);
    });
    $$("#library-toolbar .menu > summary").forEach((summary, index) => {
      if (index === 0) {
        summary.innerHTML = state.tag
          ? `<span class="active-dot"></span>标签 · ${esc(state.tag)}${icon("chevronDown", 11)}`
          : `标签${icon("chevronDown", 11)}`;
      }
      if (index === 1) {
        summary.innerHTML = state.artist
          ? `<span class="active-dot"></span>艺人 · ${esc(state.artist === "__none" ? "未指定" : state.artist)}${icon("chevronDown", 11)}`
          : `艺人${icon("chevronDown", 11)}`;
      }
      if (index === 2) {
        const label = state.sort === "title" ? "名称" : state.sort === "items" ? "条目" : state.sort === "size" ? "大小" : "最近添加";
        summary.innerHTML = `${icon("sliders", 12)}${label}${icon("chevronDown", 11)}`;
      }
    });
    $$("#library-toolbar .view-toggle button").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.value === state.view);
    });
  };

  const renderAll = () => {
    const win = $("#window");
    const stage = $("#stage");
    if (win) win.dataset.theme = state.night ? "night" : "light";
    if (stage) stage.classList.toggle("night", state.night);
    const nightBtn = $("#night-toggle");
    if (nightBtn) nightBtn.setAttribute("aria-pressed", state.night ? "true" : "false");
    renderChrome();
    renderSpine();
    renderView();
    renderOverlay();
    updatePreviewBar();
  };

  const updatePreviewBar = () => {
    const active = activeSpine();
    $$("#preview-bar [data-pb]").forEach((a) => {
      a.classList.toggle("active", a.dataset.pb === active);
    });
  };

  /* ─────────────────────────────────────────────────────────────
     Overlays: import, edit drawer, lightbox, confirm
  ───────────────────────────────────────────────────────────── */
  const hasOverlay = () => Boolean(state.seriesPicker || state.confirm || state.photo !== null || state.path === "edit" || state.path === "import");

  const renderOverlay = () => {
    const root = $("#overlay-root");
    if (!root) return;
    root.innerHTML = "";
    const topbar = $(".topbar");
    const body = $(".app-body");
    const inert = hasOverlay();
    if (topbar) topbar.inert = inert;
    if (body) body.inert = inert;

    if (state.seriesPicker) {
      root.innerHTML = seriesPickerHTML();
      return;
    }
    if (state.confirm) {
      root.innerHTML = confirmHTML();
      return;
    }
    if (state.photo !== null) {
      root.innerHTML = lightboxHTML();
      return;
    }
    if (state.path === "edit") {
      root.innerHTML = editDrawerHTML();
      return;
    }
    if (state.path === "import") {
      root.innerHTML = importHTML();
      return;
    }
  };

  /* Import */
  const importHTML = () => {
    const stage = state.importStage;
    const isScan = stage === "scanning";
    const isConfirm = stage === "confirm";
    const isResult = stage === "result";
    const title = isResult ? "扫描完成" : isConfirm ? "确认合集" : isScan ? "正在扫描" : "导入文件夹";
    const sub = isResult
      ? "原文件夹未做任何修改。新合集已经写入资料库。"
      : isConfirm
        ? "勾选文件夹作为卡片；父卡片内可排除子目录。确认前不会写入元信息。"
      : isScan
        ? "正在读取文件名、尺寸与时长；不会移动或重命名文件。"
        : "选择一个文件夹。第一次导入会自动扫描，之后可随时重新扫描。";
    return `<div class="overlay">
      <div class="dialog ${isConfirm ? "import-dialog-wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="import-title" data-stop>
        <div class="dialog-head">
          <div><h2 id="import-title">${title}</h2><p>${sub}</p></div>
          <button class="icon-btn" data-action="close-import" aria-label="关闭导入">${icon("close", 16)}</button>
        </div>
        <div class="dialog-body ${isConfirm ? "is-import-confirm" : ""}">${isResult ? importResultHTML() : isConfirm ? importConfirmHTML() : isScan ? importScanHTML() : importSetupHTML()}</div>
        <div class="dialog-foot">${importFootHTML(isResult, isScan, isConfirm)}</div>
      </div>
    </div>`;
  };

  const importSetupHTML = () => `<button type="button" class="dropzone" id="dropzone" data-action="select-folder">
      <span class="dz-icon">${icon("folderPlus", 19)}</span>
      <b>把文件夹拖到这里，或选择一个文件夹</b>
      <small>只读取文件名、尺寸与时长；不移动、不改名、不写入原目录</small>
    </button>
    ${state.importPath ? `<div class="path-row">${icon("folder", 14)}<code>${esc(state.importPath)}</code><button class="btn ghost" style="height:26px;padding:0 7px;font-size:10px" data-action="pick-folder">更改</button></div>` : ""}
    <div class="form-section">
      <h3>合集归属</h3>
      <div class="recognition-note">
        <span class="note-icon">${icon("layers", 15)}</span>
        <div><b>扫描后逐层确认</b><small>在目录树中勾选任意层级文件夹作为一张卡片；卡片内可排除不需要的子目录。确认前不写元信息。</small></div>
      </div>
    </div>
    <div class="form-section">
      <h3>媒体类型</h3>
      <div class="form-grid">
        <div>
          <label class="check-row"><input type="checkbox" ${state.importVideos ? "checked" : ""} data-import="videos" /> 包含视频</label>
          <div class="ext-chips"><span>mp4</span><span>mkv</span><span>mov</span><span>webm</span></div>
        </div>
        <div>
          <label class="check-row"><input type="checkbox" ${state.importImages ? "checked" : ""} data-import="images" /> 包含图片</label>
          <div class="ext-chips"><span>jpg</span><span>png</span><span>webp</span><span>gif</span><span>avif</span></div>
        </div>
      </div>
    </div>
    <div class="form-section">
      <h3>扫描选项</h3>
      <div class="form-grid">
        <label class="check-row"><input type="checkbox" ${state.importRecursive ? "checked" : ""} data-import="recursive" /> 读取子文件夹</label>
        <label class="check-row"><input type="checkbox" ${state.importHidden ? "checked" : ""} data-import="hidden" /> 包含隐藏文件</label>
      </div>
    </div>`;

  const importScanHTML = () => `<div class="scan-stage">
    <div class="scan-top"><span id="scan-phase">枚举文件</span><b id="scan-pct">0%</b></div>
    <div class="scan-progress"><i id="scan-fill" style="width:0%"></i></div>
    <div class="scan-file" id="scan-file">正在读取文件夹…</div>
    <div class="scan-log-list">
      <div class="scan-log-step active" data-step="0"><i class="step-dot"></i><span>枚举文件</span><small id="log-count">0 个</small></div>
      <div class="scan-log-step" data-step="1"><i class="step-dot"></i><span>读取目录树</span><small>0 个</small></div>
      <div class="scan-log-step" data-step="2"><i class="step-dot"></i><span>读取媒体信息</span><small>等待中</small></div>
      <div class="scan-log-step" data-step="3"><i class="step-dot"></i><span>提取预览</span><small>等待中</small></div>
      <div class="scan-log-step" data-step="4"><i class="step-dot"></i><span>生成候选分组</span><small>等待中</small></div>
    </div>
  </div>`;

  const importTreeRows = () => {
    const rows = [];
    const visit = (node) => {
      const selected = state.importSelected.has(node.id);
      const selectedAncestor = selectedImportAncestor(node);
      const excluded = state.importExcluded.has(node.id);
      const excludedByAncestor = Boolean(excludedImportAncestor(node));
      const selectedDescendants = selectedImportDescendantCount(node);
      const collapsed = state.importCollapsed.has(node.id);
      const hasChildren = node.children.length > 0;
      const stats = (selected || selectedAncestor) && !excluded && !excludedByAncestor
        ? includedImportStats(node)
        : rawImportStats(node);
      const canExclude = Boolean(selectedAncestor) && !excludedByAncestor;

      let check;
      if (selected) {
        check = `<button class="tree-check is-on" data-action="toggle-import-card" data-id="${node.id}" aria-pressed="true" aria-label="取消 ${esc(node.name)} 卡片">${icon("check", 10)}</button>`;
      } else if (selectedAncestor) {
        check = `<span class="tree-check is-inherited" aria-hidden="true">${icon("check", 10)}</span>`;
      } else if (selectedDescendants) {
        check = `<button class="tree-check is-partial" data-action="toggle-import-card" data-id="${node.id}" aria-pressed="false" aria-label="将 ${esc(node.name)} 合并为一张卡片，包含其下 ${selectedDescendants} 张卡片" title="合并为一张卡片">${icon("minus", 10)}</button>`;
      } else {
        check = `<button class="tree-check" data-action="toggle-import-card" data-id="${node.id}" aria-pressed="false" aria-label="将 ${esc(node.name)} 设为一张卡片"></button>`;
      }

      let stateBadge = "";
      if (selected) stateBadge = `<span class="tree-state card">卡片</span>`;
      else if (excluded) stateBadge = `<span class="tree-state excluded">已排除</span>`;
      else if (excludedByAncestor) stateBadge = `<span class="tree-state excluded">随父排除</span>`;
      else if (selectedDescendants) stateBadge = `<span class="tree-state">含 ${selectedDescendants} 张</span>`;
      else if (selectedAncestor) stateBadge = `<span class="tree-state">归入 ${esc(selectedAncestor.name)}</span>`;

      const action = canExclude
        ? `<button class="tree-exclude ${excluded ? "is-excluded" : ""}" data-action="toggle-import-exclude" data-id="${node.id}">${excluded ? "恢复" : "排除"}</button>`
        : `<span></span>`;

      const caret = hasChildren
        ? `<button class="tree-caret" data-action="toggle-import-tree" data-id="${node.id}" aria-expanded="${!collapsed}" aria-label="${collapsed ? "展开" : "收起"} ${esc(node.name)}">${icon(collapsed ? "chevronRight" : "chevronDown", 12)}</button>`
        : `<span class="tree-caret is-empty"></span>`;
      const rowClasses = [
        "tree-row",
        selected ? "is-card" : "",
        selectedAncestor && !excluded ? "is-inherited" : "",
        excluded || excludedByAncestor ? "is-excluded" : ""
      ].filter(Boolean).join(" ");

      rows.push(`<div class="${rowClasses}" style="--tree-indent:${6 + node.depth * 16}px">
        ${caret}
        ${check}
        <span class="tree-folder">${icon(node.depth === 0 ? "layers" : "folder", 14)}</span>
        <span class="tree-name"><b>${esc(node.name)}</b><small>${esc(formatImportCounts(stats))}</small></span>
        ${stateBadge || "<span></span>"}
        ${action}
      </div>`);

      if (!collapsed) node.children.forEach(visit);
    };
    visit(IMPORT_TREE);
    return rows.join("");
  };

  const importSummaryHTML = () => {
    const cards = selectedImportRoots();
    const coverage = importCoverage();
    const hasExcluded = coverage.excluded.videos || coverage.excluded.images || coverage.excluded.other;
    const hasUnassigned = coverage.unassigned.videos || coverage.unassigned.images;
    return `<div class="summary-head">
      <h3>将生成 ${cards.length} 张卡片</h3>
      <p>每个勾选文件夹一张；子目录递归归入父卡片，同一文件不会进入两张卡片。</p>
    </div>
    <div class="summary-metrics">
      <span><b>${cards.length}</b> 张卡片</span>
      <span><b>${coverage.included.videos}</b> 视频</span>
      <span><b>${coverage.included.images}</b> 图片</span>
      <span><b>${formatImportSize(coverage.included.size)}</b></span>
    </div>
    ${cards.length ? `<div class="summary-list">
      ${cards.map((node, index) => {
        const stats = includedImportStats(node);
        return `<div class="summary-card-row">
          <span class="summary-index">${pad(index + 1)}</span>
          <div><b>${esc(node.name)}</b><small>${esc(formatImportCounts(stats))} · ${esc(formatImportSize(stats.size))}</small></div>
          <button class="icon-btn sm" data-action="toggle-import-card" data-id="${node.id}" aria-label="移除卡片 ${esc(node.name)}">${icon("close", 12)}</button>
        </div>`;
      }).join("")}
    </div>` : `<div class="summary-empty">尚未选择卡片。勾选左侧任意文件夹，或使用“合并为一张”。</div>`}
    ${hasExcluded ? `<div class="summary-note is-warn">${icon("minus", 12)}<span>已排除 ${state.importExcluded.size} 个文件夹（${esc(formatImportCounts(coverage.excluded))}），不计入卡片。</span></div>` : ""}

  const startImportScan = () => {
    if (!state.importPath) return;

    state.importing = true;
    renderOverlay();
    let progress = 0;
    const phases = [
      { at: 0, name: "枚举文件", file: "正在读取文件夹…", log: "枚举文件" },
      { at: 18, name: "读取目录树", file: "正在展开目录层级…", log: "读取目录树" },
      { at: 42, name: "读取媒体信息", file: "读取时长、尺寸与文件大小…", log: "读取媒体信息" },
      { at: 68, name: "提取预览", file: "生成缩略图与首帧…", log: "提取预览" },
      { at: 88, name: "生成候选分组", file: "准备文件夹确认页…", log: "生成候选分组" }
    ];
    let phaseIndex = 0;
    clearInterval(scanTimer);
    scanTimer = setInterval(() => {
      progress = Math.min(100, progress + 2.2 + Math.random() * 2.4);
      const phase = phases.filter((p) => progress >= p.at).pop() || phases[0];
      const node = (sel) => $(sel);
      const fill = node("#scan-fill");
      const pct = node("#scan-pct");
      const phaseEl = node("#scan-phase");
      const fileEl = node("#scan-file");
      if (fill) fill.style.width = progress.toFixed(1) + "%";
      if (pct) pct.textContent = Math.round(progress) + "%";
      if (phaseEl) phaseEl.textContent = phase.name;
      if (fileEl) fileEl.textContent = phase.file;
      $$(".scan-log-step").forEach((row, i) => {
        row.classList.toggle("done", i < phases.findIndex((p) => p.name === phase.name));
        row.classList.toggle("active", i === phases.findIndex((p) => p.name === phase.name));
        const small = $("small", row);
        if (small) {
          if (i === 0) small.textContent = Math.min(1288, Math.round(progress * 13)) + " 个";
          else if (i === 1) small.textContent = progress > 18 ? `${importFolderCount()} 个文件夹` : "等待中";
          else if (i === 2) small.textContent = progress > 42 ? "1,288 个" : "等待中";
          else if (i === 3) small.textContent = progress > 68 ? "24 / 24" : "等待中";
          else if (i === 4) small.textContent = progress > 88 ? `${state.importSelected.size} 张卡片` : "等待中";
        }
      });
      if (progress >= 100) {
        clearInterval(scanTimer);
        scanTimer = null;
        setTimeout(() => {
          if (state.importing) {
            state.importing = false;
            state.importStage = "confirm";
            renderOverlay();
          }
        }, 420);
      }
    }, 110);
  };

    if (state.importSelected.has(id)) {
      state.importSelected.delete(id);
      clearImportExclusionsWithin(node);
      return;
    }
    if (selectedImportAncestor(node)) return;
    if (importHasSelectedDescendant(node)) {
      const mergeDescendants = (current) => {
        if (current !== node) state.importSelected.delete(current.id);
        current.children.forEach(mergeDescendants);
      };
      mergeDescendants(node);
      state.importSelected.add(id);
      return;
    }
    state.importSelected.add(id);
  };

  const toggleImportExclude = (id) => {
    const node = importNode(id);
    if (!node || !selectedImportAncestor(node) || excludedImportAncestor(node)) return;
    const restore = state.importExcluded.has(id);
    node.children.forEach(clearImportExclusionsWithin);
    if (restore) state.importExcluded.delete(id);
    else state.importExcluded.add(id);
  };

    renderOverlay();

  /* Confirm */
  const confirmHTML = () => {
    const c = state.confirm;
    if (!c) return "";
    return `<div class="overlay" data-action="confirm-backdrop">
      <div class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" data-stop>
        <h2 id="confirm-title">${esc(c.title)}</h2>

  /* ─────────────────────────────────────────────────────────────
     Actions

  const toast = (message, tone = "success") => {

    if (!root) return;
    const el = document.createElement("div");
    el.className = `toast ${tone}`;
    el.innerHTML = `${icon(tone === "warn" ? "warning" : tone === "info" ? "info" : "check", 15)}<span>${esc(message)}</span>`;
    root.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 3400);

  const stopPlayer = () => {

  const currentEpisode = () => {
    const c = byId(state.id);

  };

  const togglePlay = () => {
    const ep = currentEpisode();
    const player = $("#player");

    if (state.playing) {
      stopPlayer();
      player.classList.remove("is-playing");
      $$('[data-action="toggle-play"]', player).forEach((b) => {
        b.innerHTML = icon(b.classList.contains("player-big") ? "play" : "play", b.classList.contains("player-big") ? 24 : 15);
      });
      const big = $(".player-big", player);
      if (big) big.setAttribute("aria-label", "播放");
      return;
    }
    state.playing = true;
    player.classList.add("is-playing");
    const big = $(".player-big", player);
    if (big) { big.innerHTML = icon("pause", 24); big.setAttribute("aria-label", "暂停"); }
    const barBtn = $(".player-controls [data-action=\"toggle-play\"]", player);
    if (barBtn) barBtn.innerHTML = icon("pause", 15);
    if (!state.playerT || state.playerT >= ep.dur) state.playerT = 0;
    playerTimer = setInterval(() => {
      state.playerT += 1;
      if (state.playerT >= ep.dur) {
        stopPlayer();
        player.classList.remove("is-playing");
        if (big) big.innerHTML = icon("play", 24);
        return;
      }
      updatePlayerDom(ep);
    }, 1000);
    updatePlayerDom(ep);
  };

  const updatePlayerDom = (ep) => {
    const time = $("#player-time");

    if (fill) fill.style.width = `${Math.min(100, (state.playerT / ep.dur) * 100)}%`;

    const rect = scrub.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));

  const runRescan = (scope = "all", sourceId = null, collectionId = null) => {

      const changedSource = LIB.sources.find((s) => s.status === "changed");

        if (s) { s.status = "ok"; s.lastScan = "刚刚"; }
        LIB.scans.unshift({ when: "刚刚", source: s?.label || "来源", result: "快速扫描 · 已更新 2 个合集", tone: "ok" });

        if (c) c.lastScan = "刚刚";
        toast("合集扫描完成 · 未发现新增文件");
      } else {
        LIB.sources.forEach((s) => { s.status = "ok"; s.lastScan = "刚刚"; });
        LIB.collections.forEach((c) => { c.lastScan = "刚刚"; });
        LIB.scans.unshift({ when: "刚刚", source: "全部来源", result: changedSource ? "完整扫描 · 2 个合集有变更" : "完整扫描 · 无变更", tone: "ok" });
        toast(changedSource ? "扫描完成 · 已更新 2 个合集" : "扫描完成 · 未发现变更");
      }
      renderChrome();
      renderSpine();
      renderView();
    };
    setTimeout(finish, 1700);
  };

  const setType = (type) => {
    state.type = type;
    syncLibraryHash();
    renderResults();
  };

  const filterByTag = (tag) => {
    state.tag = tag || null;
    if (state.path !== "library") {
      go("#library" + (tag ? `?tag=${encodeURIComponent(tag)}` : ""));
    } else {
      syncLibraryHash();
      renderResults();
    }
  };

  const filterByArtist = (artist) => {
    state.artist = artist || null;
    if (state.path !== "library") {
      const params = new URLSearchParams();
      if (artist) params.set("artist", artist);
      go("#library" + (params.toString() ? "?" + params.toString() : ""));
    } else {
      syncLibraryHash();
      renderResults();
    }
  };

  const clearFilters = () => {
    state.q = "";
    state.type = "all";
    state.tag = null;
    state.artist = null;
    syncLibraryHash();
    if (state.path !== "library") go("#library");
    else {
      renderView();
      $("#lib-search")?.focus();
    }
  };

  const parseAliasList = (value) => String(value || "")
    .split(/[,，、;；\n]/)
    .map((item) => item.trim())
    .filter(Boolean);

  const saveArtist = () => {
    const profile = artistById(state.id);
    if (!profile || profile.id === "__none") return;
    const name = $("#artist-name-input")?.value.trim() || "";
    const nameField = $("#artist-name-input")?.closest(".field");
    if (!name) {
      nameField?.classList.add("invalid");
      $("#artist-name-input")?.focus();
      return;
    }
    nameField?.classList.remove("invalid");
    const nameKey = artistNameKey(name);
    const aliases = parseAliasList($("#artist-aliases-input")?.value).filter((a) => artistNameKey(a) !== nameKey);
    const bio = $("#artist-bio-input")?.value.trim() || "";
    const mergeNames = new Set([profile.name, ...profile.aliases, ...aliases, name].map(artistNameKey));
    const merged = [];
    let foundMerge = true;
    while (foundMerge) {
      foundMerge = false;
      LIB.artistProfiles.forEach((p) => {
        if (p.id === profile.id || merged.some((m) => m.id === p.id)) return;
        if (![p.name, ...p.aliases].some((a) => mergeNames.has(artistNameKey(a)))) return;
        merged.push(p);
        mergeNames.add(artistNameKey(p.name));
        p.aliases.forEach((a) => mergeNames.add(artistNameKey(a)));
        foundMerge = true;
      });
    }
    LIB.collections.forEach((c) => {
      const next = [...new Map(c.artists.map((a) => [artistNameKey(a), mergeNames.has(artistNameKey(a)) ? name : a])).values()];
      c.artists = next;
      c.artist = next[0] || "";
    });
    profile.name = name;
    profile.aliases = [...new Map([
      ...aliases,
      ...merged.flatMap((p) => [p.name, ...p.aliases])
    ].map((a) => [artistNameKey(a), a])).values()].filter((a) => artistNameKey(a) !== nameKey);
    profile.bio = bio;
    LIB.artistProfiles = LIB.artistProfiles.filter((p) => p.id === profile.id || !merged.some((m) => m.id === p.id));
    state.artistEditing = false;
    renderAll();
    toast(merged.length ? `艺人资料已更新，并合并 ${merged.length} 位同名艺人` : "艺人资料已更新");
  };

  const refreshArtistView = () => renderView({ preserveScroll: true });

  const clearArtistFilters = () => {
    state.artistQuery = "";
    state.artistType = "all";
    state.artistTag = null;
    state.artistSort = "added";
    refreshArtistView();
  };

  const createSeries = () => {
    const name = $("#new-series-name")?.value.trim() || "";
    const field = $("#new-series-name")?.closest(".field");
    if (!name) {
      field?.classList.add("invalid");
      $("#new-series-name")?.focus();
      return;
    }
    field?.classList.remove("invalid");
    const description = $("#new-series-desc")?.value.trim() || "";
    let id = `series-${hash(name).toString(36)}`;
    while (seriesById(id)) id += "-x";
    const stamp = new Date().toISOString();
    LIB.series.unshift({
      id,
      name,
      description,
      collectionIds: [],
      createdAt: stamp,
      updatedAt: stamp
    });
    state.seriesCreating = false;
    go(`#series/${id}`);
    toast(`系列「${name}」已创建`);
  };

  const saveSeriesEdit = () => {
    const series = seriesById(state.id);
    if (!series) return;
    const name = $("#series-name-input")?.value.trim() || "";
    const field = $("#series-name-input")?.closest(".field");
    if (!name) {
      field?.classList.add("invalid");
      $("#series-name-input")?.focus();
      return;
    }
    series.name = name;
    series.description = $("#series-desc-input")?.value.trim() || "";
    series.updatedAt = new Date().toISOString();
    state.seriesEditing = false;
    renderAll();
    toast("系列资料已更新");
  };

  const deleteSeries = () => {
    const series = seriesById(state.id);
    if (!series) return;
    askConfirm({
      title: `删除系列「${series.name}」？`,
      body: "只会删除系列分组与顺序。系列内的合集、索引、缩略图和原文件都会保留。",
      ok: "删除系列",
      danger: true,
      onConfirm: () => {
        LIB.series = LIB.series.filter((s) => s.id !== series.id);
        state.confirm = null;
        go("#series", true);
        toast("系列已删除，合集与原文件保留");
      }
    });
  };

  const openSeriesPicker = () => {
    const series = seriesById(state.id);
    if (!series) return;
    state.seriesPicker = { seriesId: series.id, q: "", selected: new Set() };
    renderOverlay();
    setTimeout(() => $("#series-picker-q")?.focus(), 20);
  };

  const closeSeriesPicker = () => {
    state.seriesPicker = null;
    renderOverlay();
  };

  const toggleSeriesPick = (id) => {
    const picker = state.seriesPicker;
    const series = picker && seriesById(picker.seriesId);
    if (!picker || !series || series.collectionIds.includes(id)) return;
    if (picker.selected.has(id)) picker.selected.delete(id);
    else picker.selected.add(id);
    refreshSeriesPicker(id);
  };

  const saveSeriesPicker = () => {
    const picker = state.seriesPicker;
    const series = picker && seriesById(picker.seriesId);
    if (!picker || !series || !picker.selected.size) return;
    const additions = LIB.collections.filter((c) => picker.selected.has(c.id)).map((c) => c.id);
    series.collectionIds = [...new Set([...series.collectionIds, ...additions])];
    series.updatedAt = new Date().toISOString();
    const count = additions.length;
    state.seriesPicker = null;
    renderAll();
    toast(`${count} 个合集已加入「${series.name}」`);
  };

  const removeFromSeries = (seriesId, collectionId) => {
    const series = seriesById(seriesId);
    if (!series) return;
    series.collectionIds = series.collectionIds.filter((id) => id !== collectionId);
    series.updatedAt = new Date().toISOString();
    renderChrome();
    renderView({ preserveScroll: true });
    toast(`已从「${series.name}」移出，合集本身保留`);
  };

  const openCollection = (c) => {
    if (!c) return;
    const tab = c._lastTab || (c.videos ? "video" : "images");
    go(detailHash(c, tab));
  };

  const openEdit = (id) => {
    const c = byId(id);
    if (!c) return;
    state.editDraft = makeDraft(c);
    go(`#edit/${c.id}`);
  };

  const closeEdit = () => {
    const c = byId(state.id);
    state.editDraft = null;
    go(c ? `#detail/${c.id}` : "#library");
  };

  const closeImport = () => {
    stopImportScan();
    state.importStage = "setup";
    state.importPath = "";
    resetImportSelection();
    go("#library");
  };

  const selectFolder = () => {
    state.importPath = "D:\\Incoming\\2025-11-14";
    resetImportSelection();
    renderOverlay();
  };

  const removeSource = (id) => {
    const s = LIB.sources.find((x) => x.id === id);
    if (!s) return;
    const count = LIB.collections.filter((c) => c.sourceId === id).length;
    askConfirm({
      title: `移除“${s.label}”？`,
      body: `只会从媒体库移除这个来源与 ${count} 个合集的索引，不会删除任何原文件。重新导入该文件夹可恢复。`,
      ok: "移除索引",
      danger: true,
      onConfirm: () => {
        LIB.collections = LIB.collections.filter((c) => c.sourceId !== id);
        LIB.sources = LIB.sources.filter((x) => x.id !== id);
        state.confirm = null;
        renderAll();
        toast(`已移除来源与 ${count} 个合集索引`, "warn");
      }
    });
  };

  const addTag = () => {
    const input = $("#new-tag-input");
    const name = input ? input.value.trim() : "";
    if (!name) return;
    if (allTags().some((t) => t.name === name)) {
      toast("这个标签已经存在", "warn");
      return;
    }
    LIB.extraTags.push(name);
    state.newTagOpen = false;
    renderSpine();
    renderView();
    toast(`已创建标签“${name}”`);
  };

  const addDraftChip = (kind, value) => {
    const d = state.editDraft;
    if (!d) return;
    const clean = value.trim();
    if (!clean) return;
    const list = kind === "tag" ? d.tags : d.artists;
    if (list.includes(clean)) return;
    list.push(clean);
    if (kind === "tag") {
      if (!LIB.extraTags.includes(clean)) LIB.extraTags.push(clean);
      const box = $("#draft-tags");
      const input = box?.querySelector("input");
      if (input) input.value = "";
      const chip = document.createElement("span");
      chip.className = "edit-chip";
      chip.innerHTML = `${esc(clean)}<button data-action="draft-del-tag" data-value="${esc(clean)}" aria-label="移除 ${esc(clean)}">${icon("close", 10)}</button>`;
      box?.insertBefore(chip, input);
    } else {
      if (!LIB.extraArtists.includes(clean)) LIB.extraArtists.push(clean);
      const box = $("#draft-artists");
      const input = box?.querySelector("input");
      if (input) input.value = "";
      const chip = document.createElement("span");
      chip.className = "edit-chip";
      chip.innerHTML = `${esc(clean)}<button data-action="draft-del-artist" data-value="${esc(clean)}" aria-label="移除 ${esc(clean)}">${icon("close", 10)}</button>`;
      box?.insertBefore(chip, input);
    }
  };

  const removeDraftChip = (kind, value) => {
    const d = state.editDraft;
    if (!d) return;
    if (kind === "tag") d.tags = d.tags.filter((t) => t !== value);
    else d.artists = d.artists.filter((a) => a !== value);
    renderOverlay();
    setTimeout(() => { $("#draft-title")?.focus(); }, 0);
  };

  const copyPath = async (path) => {
    try {
      await navigator.clipboard.writeText(path);
      toast("路径已复制", "info");
    } catch {
      toast("预览无法访问剪贴板；桌面端会调用 clipboard", "info");
    }
  };

  /* ─────────────────────────────────────────────────────────────
     Events
  ───────────────────────────────────────────────────────────── */
  document.addEventListener("click", (event) => {
    const actionEl = event.target.closest("[data-action]");
    if (!actionEl) {
      $$("details.menu[open]").forEach((d) => d.removeAttribute("open"));
      return;
    }
    const action = actionEl.dataset.action;
    const stop = () => event.stopPropagation();

    switch (action) {
      case "open-collection": {
        const c = byId(actionEl.dataset.id);
        openCollection(c);
        break;
      }
      case "quick-play": {
        stop();
        const c = byId(actionEl.dataset.id);
        if (c) go(detailHash(c, c.videos ? "video" : "images"));
        break;
      }
      case "edit":
        stop();
        openEdit(actionEl.dataset.id);
        break;
      case "filter-type":
        setType(actionEl.dataset.type);
        break;
      case "filter-tag":
        filterByTag(actionEl.dataset.value);
        break;
      case "filter-artist":
        filterByArtist(actionEl.dataset.value);
        break;
      case "toggle-artist-edit":
        state.artistEditing = !state.artistEditing;
        renderView();
        if (state.artistEditing) setTimeout(() => $("#artist-name-input")?.focus(), 20);
        break;
      case "cancel-artist-edit":
        state.artistEditing = false;
        renderView();
        break;
      case "save-artist":
        saveArtist();
        break;
      case "filter-artist-type":
        state.artistType = actionEl.dataset.value || "all";
        refreshArtistView();
        break;
      case "filter-artist-tag":
        state.artistTag = actionEl.dataset.value || null;
        refreshArtistView();
        break;
      case "sort-artist":
        state.artistSort = actionEl.dataset.value || "added";
        refreshArtistView();
        break;
      case "clear-artist-filters":
        clearArtistFilters();
        break;
      case "toggle-series-create":
        state.seriesCreating = !state.seriesCreating;
        renderView();
        if (state.seriesCreating) setTimeout(() => $("#new-series-name")?.focus(), 20);
        break;
      case "create-series":
        createSeries();
        break;
      case "edit-series":
        state.seriesEditing = true;
        renderView();
        setTimeout(() => $("#series-name-input")?.focus(), 20);
        break;
      case "cancel-series-edit":
        state.seriesEditing = false;
        renderView();
        break;
      case "save-series":
        saveSeriesEdit();
        break;
      case "delete-series":
        deleteSeries();
        break;
      case "open-series-picker":
        openSeriesPicker();
        break;
      case "close-series-picker":
        closeSeriesPicker();
        break;
      case "toggle-series-pick":
        stop();
        toggleSeriesPick(actionEl.dataset.id);
        break;
      case "save-series-picker":
        saveSeriesPicker();
        break;
      case "picker-backdrop":
        if (event.target === actionEl) closeSeriesPicker();
        break;
      case "remove-from-series":
        stop();
        removeFromSeries(actionEl.dataset.id, actionEl.dataset.collectionId);
        break;
      case "sort":
        state.sort = actionEl.dataset.value;
        syncLibraryHash();
        renderResults();
        break;
      case "view":
        state.view = actionEl.dataset.value;
        syncLibraryHash();
        renderResults();
        break;
      case "clear-type":
        setType("all");
        break;
      case "clear-tag":
        filterByTag("");
        break;
      case "clear-artist":
        filterByArtist("");
        break;
      case "clear-query":
        state.q = "";
        syncLibraryHash();
        renderResults();
        break;
      case "clear-filters":
        clearFilters();
        break;
      case "back-library":
        go(buildLibraryHash());
        break;
      case "rescan":
        runRescan("all");
        break;
      case "rescan-source":
        stop();
        runRescan("source", actionEl.dataset.id);
        break;
      case "rescan-one":
        runRescan("one", null, actionEl.dataset.id);
        break;
      case "remove-source":
        stop();
        removeSource(actionEl.dataset.id);
        break;
      case "toggle-play":
        stop();
        togglePlay();
        break;
      case "seek":
        seekFromEvent(event);
        break;
      case "open-photo": {
        const c = byId(actionEl.dataset.id);
        const index = Number(actionEl.dataset.index);
        if (c) {
          state.photo = index;
          history.replaceState(null, "", `#detail/${c.id}?tab=images&photo=${index}`);
          renderOverlay();
        }
        break;
      }
      case "close-photo":
        closePhoto();
        break;
      case "lb-prev":
        gotoPhoto((state.photo || 0) - 1);
        break;
      case "lb-next":
        gotoPhoto((state.photo || 0) + 1);
        break;
      case "lb-goto":
        gotoPhoto(Number(actionEl.dataset.index));
        break;
      case "lb-backdrop":
        if (event.target === actionEl) closePhoto();
        break;
      case "close-edit":
        closeEdit();
        break;
      case "save-edit":
        saveEdit();
        break;
      case "draft-del-tag":
        stop();
        removeDraftChip("tag", actionEl.dataset.value);
        break;
      case "draft-del-artist":
        stop();
        removeDraftChip("artist", actionEl.dataset.value);
        break;
      case "change-cover":
        toast("桌面端会从合集内选择封面；预览使用占位海报", "info");
        break;
      case "reveal":
        stop();
        toast("桌面端将调用 shell.showItemInFolder 定位原文件", "info");
        break;
      case "copy-path":
        stop();
        copyPath(actionEl.dataset.path || "");
        break;
      case "external-play":
        stop();
        toast("桌面端将用系统播放器打开当前视频", "info");
        break;
      case "close-import":
        closeImport();
        break;
      case "pick-folder":
        selectFolder();
        break;
      case "select-folder":
        selectFolder();
        break;
      case "start-scan":
        startImportScan();
        break;
      case "cancel-scan":
        stopImportScan();
        state.importStage = "setup";
        renderOverlay();
        break;
      case "toggle-import-card":
        stop();
        toggleImportCard(actionEl.dataset.id);
        refreshImportConfirm("toggle-import-card", actionEl.dataset.id);
        break;
      case "toggle-import-exclude":
        stop();
        toggleImportExclude(actionEl.dataset.id);
        refreshImportConfirm("toggle-import-exclude", actionEl.dataset.id);
        break;
      case "toggle-import-tree":
        stop();
        toggleImportTreeState(actionEl.dataset.id);
        refreshImportConfirm("toggle-import-tree", actionEl.dataset.id);
        break;
      case "select-import-top":
        selectImportTopLevels();
        refreshImportConfirm("select-import-top");
        break;
      case "merge-import-all":
        mergeImportAll();
        refreshImportConfirm("merge-import-all");
        break;
      case "clear-import-cards":
        clearImportCards();
        refreshImportConfirm("clear-import-cards");
        break;
      case "confirm-import":
        if (!state.importSelected.size) break;
        state.importStage = "result";
        renderOverlay();
        break;
      case "back-to-scan":
        startImportScan();
        break;
      case "finish-import":
        finishImport();
        break;
      case "toggle-new-tag":
        state.newTagOpen = !state.newTagOpen;
        renderView();
        if (state.newTagOpen) setTimeout(() => $("#new-tag-input")?.focus(), 0);
        break;
      case "add-tag":
        addTag();
        break;
      case "confirm-cancel":
        state.confirm = null;
        renderOverlay();
        break;
      case "confirm-ok": {
        const cb = state.confirm?.onConfirm;
        if (cb) cb();
        else { state.confirm = null; renderOverlay(); }
        break;
      }
      case "confirm-backdrop":
        if (event.target === actionEl) { state.confirm = null; renderOverlay(); }
        break;
      case "toggle-night": {
        state.night = !state.night;
        localStorage.setItem("edt-media-preview-night", state.night ? "1" : "0");
        const win = $("#window");
        const stage = $("#stage");
        if (win) win.dataset.theme = state.night ? "night" : "light";
        if (stage) stage.classList.toggle("night", state.night);
        const btn = $("#night-toggle");
        if (btn) btn.setAttribute("aria-pressed", state.night ? "true" : "false");
        break;
      }
      case "reset-preview":
        localStorage.removeItem("edt-media-preview-night");
        location.hash = "#library";
        location.reload();
        break;
      case "more":
        toast("更多操作：扫描全部来源、清理缩略图缓存、导出元信息", "info");
        break;
      default:
        break;
    }
  });

  document.addEventListener("input", (event) => {
    const el = event.target;
    if (el.id === "lib-search") {
      state.q = el.value;
      syncLibraryHash();
      renderResults();
      return;
    }
    if (el.id === "artist-q") {
      state.artistQuery = el.value;
      const results = $("#artist-results");
      if (results) {
        const profile = artistById(state.id);
        if (profile) {
          results.innerHTML = artistResultsHTML(profile);
          const count = $("#artist-toolbar .result-count");
          if (count) count.textContent = `${artistWorks(profile).length} 个合集`;
        }
      }
      return;
    }
    if (el.id === "series-picker-q") {
      if (state.seriesPicker) {
        state.seriesPicker.q = el.value;
        refreshSeriesPicker();
      }
      return;
    }
    if (el.id === "new-tag-input") return;
    const field = el.dataset.draft;
    if (field && state.editDraft) {
      state.editDraft[field] = el.value;
      if (field === "title") $("#title-field")?.classList.remove("invalid");
    }
  });

  document.addEventListener("change", (event) => {
    const el = event.target;
    if (el.dataset.import === "videos") state.importVideos = el.checked;
    if (el.dataset.import === "images") state.importImages = el.checked;
    if (el.dataset.import === "recursive") state.importRecursive = el.checked;
    if (el.dataset.import === "hidden") state.importHidden = el.checked;
  });

  document.addEventListener("keydown", (event) => {
    const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName);
    const openMenu = $("details.menu[open]");

    if (event.key === "Escape") {
      if (state.seriesPicker) { state.seriesPicker = null; renderOverlay(); return; }
      if (state.confirm) { state.confirm = null; renderOverlay(); return; }
      if (state.photo !== null) { closePhoto(); return; }
      if (state.path === "edit") { closeEdit(); return; }
      if (state.path === "import") { closeImport(); return; }
      if (state.artistEditing) { state.artistEditing = false; renderView(); return; }
      if (state.seriesEditing) { state.seriesEditing = false; renderView(); return; }
      if (openMenu) { openMenu.removeAttribute("open"); return; }
      return;
    }

    if (state.photo !== null) {
      if (event.key === "ArrowLeft") { event.preventDefault(); gotoPhoto((state.photo || 0) - 1); }
      if (event.key === "ArrowRight") { event.preventDefault(); gotoPhoto((state.photo || 0) + 1); }
      return;
    }

    if (event.key === "/" && !inField && (state.path === "library" || state.path === "import" || state.path === "artists")) {
      event.preventDefault();
      if (state.path === "artists" && state.id) $("#artist-q")?.focus();
      else $("#lib-search")?.focus();
      return;
    }

    if ((event.key === "Enter" || event.key === " ") && !inField) {
      const card = event.target.closest(".media-card, .list-row, .tag-index-row");
      if (card) {
        event.preventDefault();
        card.click();
      }
    }

    if (event.key === "Enter" && event.target.matches("[data-draft-add]")) {
      event.preventDefault();
      addDraftChip(event.target.dataset.draftAdd, event.target.value);
    }

    if (event.key === "Enter" && event.target.id === "new-tag-input") {
      event.preventDefault();
      addTag();
    }
  });

  document.addEventListener("dragover", (event) => {
    if (event.target.closest("#dropzone")) {
      event.preventDefault();
      $("#dropzone")?.classList.add("drag");
    }
  });

  document.addEventListener("dragleave", (event) => {
    if (event.target.closest("#dropzone")) $("#dropzone")?.classList.remove("drag");
  });

  document.addEventListener("drop", (event) => {
    if (event.target.closest("#dropzone")) {
      event.preventDefault();
      $("#dropzone")?.classList.remove("drag");
      selectFolder();
    }
  });

  window.addEventListener("hashchange", applyRoute);
