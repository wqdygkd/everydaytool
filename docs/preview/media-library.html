  /* ─────────────────────────────────────────────────────────────
     10 · Overlays
  ───────────────────────────────────────────────────────────── */
  #overlay-root {
    position: absolute;
    inset: 0;
    z-index: 80;
    pointer-events: none;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    background: rgba(7, 14, 22, 0.34);
    backdrop-filter: blur(6px);
    pointer-events: auto;
    animation: fadeIn 160ms var(--ease-out);
  }

  .dialog {
    width: min(760px, 100%);
    max-height: min(760px, calc(100% - 8px));
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: var(--radius-xl);
    background: var(--color-raised);
    box-shadow:
      inset 0 1px 0 color-mix(in srgb, #ffffff 55%, transparent),
      var(--shadow-lg);
    animation: dialogIn 190ms var(--ease-out);
  }

  .window[data-theme="night"] .dialog {
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.05),
      0 28px 80px rgba(0, 0, 0, 0.48);
  }

  .dialog-head {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 18px 12px 22px;
  }

  .dialog-head h2 {
    font-size: var(--fs-title);
    font-weight: 500;
    letter-spacing: -0.02em;
  }

  .dialog-head p {
    margin-top: 3px;
    font-size: 11px;
    color: var(--color-text-secondary);
  }

  .dialog-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 22px 20px;
  }

  .dialog-foot {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 18px 14px 22px;
    border-top: 1px solid var(--color-border-light);
  }

  .dialog-foot .foot-note {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--color-text-tertiary);
  }

  .dialog-foot .foot-note .ic { color: var(--color-success); }

  .dialog-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  .dropzone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 112px;
    padding: 18px;
    border: 1px dashed var(--color-border);
    border-radius: var(--radius-md);
    background: var(--color-fill);
    text-align: center;
    transition: border-color var(--duration-fast), background var(--duration-fast);
  }

  .dropzone:hover,
  .dropzone.drag {
    border-color: color-mix(in srgb, var(--color-primary) 52%, var(--color-border));
    background: color-mix(in srgb, var(--color-primary) 5%, var(--color-fill));
  }

  .dropzone .dz-icon {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: var(--color-primary-soft);
    color: var(--color-primary-strong);
  }

  .dropzone b { font-size: var(--fs-sm); font-weight: 500; }
  .dropzone small { font-size: 10px; line-height: 1.5; color: var(--color-text-tertiary); }

  .path-row {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 10px;
    padding: 8px 10px;
    border: 1px solid var(--color-border-light);
    border-radius: 9px;
    background: var(--color-field);
  }

  .path-row .ic { color: var(--color-text-tertiary); }

  .path-row code {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--color-text-secondary);
  }

  .form-section { margin-top: 18px; }

  .form-section > h3 {
    margin-bottom: 8px;
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-secondary);
  }

  .recognition-note {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 10px 11px;
    border: 1px solid var(--color-border-light);
    border-radius: 9px;
    background: var(--color-field);
  }

  .recognition-note .note-icon {
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    display: grid;
    place-items: center;
    border-radius: 7px;
    background: var(--color-primary-soft);
    color: var(--color-primary-strong);
  }

  .recognition-note b {
    display: block;
    font-size: 11px;
    font-weight: 500;
  }

  .recognition-note small {
    display: block;
    margin-top: 2px;
    font-size: 10px;
    line-height: 1.5;
    color: var(--color-text-tertiary);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .choice {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 10px;
    border: 1px solid var(--color-border-light);
    border-radius: 9px;
    background: var(--color-field);
    cursor: pointer;
  }

  .choice + .choice { margin-top: 6px; }

  .choice input {
    margin: 2px 0 0;
    accent-color: var(--color-primary-strong);
    flex: 0 0 auto;
  }

  .choice b { display: block; font-size: 11px; font-weight: 500; }
  .choice small { display: block; margin-top: 1px; font-size: 10px; line-height: 1.45; color: var(--color-text-tertiary); }

  .check-row {
    display: flex;
    align-items: center;
    gap: 7px;
    min-height: 28px;
    font-size: 11px;
    color: var(--color-text-secondary);
  }

  .check-row input { accent-color: var(--color-primary-strong); }

  .ext-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }

  .ext-chips span {
    height: 18px;
    display: inline-flex;
    align-items: center;
    padding: 0 5px;
    border: 1px solid var(--color-border-light);
    border-radius: 4px;
    background: var(--color-fill);
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--color-text-tertiary);
  }

  .scan-stage { padding: 6px 0 2px; }

  .scan-progress {
    height: 6px;
    border-radius: 3px;
    background: var(--color-fill);
    overflow: hidden;
  }

  .scan-progress i {
    display: block;
    height: 100%;
    border-radius: 3px;
    background: var(--color-primary);
    transition: width 220ms linear;
  }

  .scan-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 11px;
    color: var(--color-text-secondary);
  }

  .scan-top b { font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }

  .scan-file {
    margin-top: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--color-text-tertiary);
  }

  .scan-log-list { margin-top: 18px; border-top: 1px solid var(--color-border-light); }

  .scan-log-step {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 34px;
    border-bottom: 1px solid var(--color-border-light);
    font-size: 11px;
    color: var(--color-text-tertiary);
  }

  .scan-log-step.done { color: var(--color-text-secondary); }
  .scan-log-step.done .step-dot { background: var(--color-success); border-color: var(--color-success); }
  .scan-log-step.active { color: var(--color-text-primary); }
  .scan-log-step.active .step-dot { border-color: var(--color-primary); animation: pulse 1s infinite; }

  .step-dot {
    width: 8px;
    height: 8px;
    flex: 0 0 8px;
    border: 1px solid var(--color-border);
    border-radius: 50%;
  }

  .scan-log-step small { margin-left: auto; font-size: 10px; color: var(--color-text-tertiary); font-variant-numeric: tabular-nums; }

  .result-hero {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 0 14px;
  }

  .result-check {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: color-mix(in srgb, var(--color-success) 10%, transparent);
    color: var(--color-success);
  }

  .result-hero h3 { font-size: var(--fs-base); font-weight: 500; }
  .result-hero p { margin-top: 2px; font-size: 11px; color: var(--color-text-secondary); }

  .result-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    padding: 10px 0 16px;
    border-top: 1px solid var(--color-border-light);
    border-bottom: 1px solid var(--color-border-light);
    font-size: 10px;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  .result-stats b { font-weight: 500; color: var(--color-text-secondary); }

  .result-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-top: 14px;
  }

  .result-card {
    min-width: 0;
    padding: 7px;
    border: 1px solid var(--color-border-light);
    border-radius: 10px;
    background: var(--color-well);
  }

  .result-thumb {
    position: relative;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    border-radius: 6px;
  }

  .result-thumb .poster,
  .result-thumb .cover-art { position: absolute; inset: 0; }

  .result-card b {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .result-card small {
    display: block;
    margin-top: 1px;
    font-size: 9px;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  /* Import confirmation */
  .dialog.import-dialog-wide {
    width: min(1040px, 100%);
    height: min(760px, calc(100% - 8px));
    max-height: none;
  }

  .dialog-body.is-import-confirm {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    padding-bottom: 14px;
  }

  .import-confirm {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(292px, 0.8fr);
    gap: 16px;
  }

  .import-confirm-main {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .tree-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 1px 9px;
  }

  .tree-toolbar-label {
    min-width: 0;
    font-size: 11px;
    color: var(--color-text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tree-toolbar-label b { font-weight: 500; color: var(--color-text-primary); }
  .tree-toolbar-label small { margin-left: 6px; font-size: 10px; color: var(--color-text-tertiary); }

  .tree-actions {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .tree-action {
    height: 24px;
    display: inline-flex;
    align-items: center;
    padding: 0 7px;
    border-radius: 6px;
    border: 1px solid transparent;
    font-size: 10px;
    color: var(--color-text-secondary);
    white-space: nowrap;
  }

  .tree-action:hover {
    background: color-mix(in srgb, var(--color-primary) 7%, transparent);
    color: var(--color-text-primary);
  }

  .tree-shell {
    flex: 1;
    min-height: 0;
    overflow: auto;
    border: 1px solid var(--color-border-light);
    border-radius: 12px;
    background: var(--color-field);
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--color-text-tertiary) 34%, transparent) transparent;
  }

  .tree-row {
    display: grid;
    grid-template-columns: 16px 16px 18px minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 6px;
    min-height: 36px;
    padding: 4px 8px 4px calc(var(--tree-indent, 8px) + 2px);
    border-bottom: 1px solid var(--color-border-light);
    transition: background var(--duration-fast), opacity var(--duration-fast);
  }

  .tree-row:last-child { border-bottom: 0; }

  .tree-row:hover { background: color-mix(in srgb, var(--color-primary) 5%, transparent); }

  .tree-row.is-card {
    background: color-mix(in srgb, var(--color-primary) 6%, transparent);
  }

  .tree-row.is-card:hover {
    background: color-mix(in srgb, var(--color-primary) 9%, transparent);
  }

  .tree-row.is-inherited {
    background: color-mix(in srgb, var(--color-primary) 3%, transparent);
  }

  .tree-row.is-excluded,
  .tree-row.is-excluded:hover {
    background: color-mix(in srgb, var(--color-warning) 4%, transparent);
    opacity: 0.58;
  }

  .tree-row.is-muted { opacity: 0.44; }

  .tree-caret {
    width: 16px;
    height: 20px;
    display: grid;
    place-items: center;
    border-radius: 4px;
    color: var(--color-text-tertiary);
  }

  .tree-caret:hover {
    background: color-mix(in srgb, var(--color-primary) 8%, transparent);
    color: var(--color-text-primary);
  }

  .tree-caret.is-empty { visibility: hidden; }

  .tree-check {
    width: 16px;
    height: 16px;
    display: grid;
    place-items: center;
    border: 1px solid var(--color-border);
    border-radius: 4px;
    background: var(--color-input);
    color: transparent;
  }

  button.tree-check:hover {
    border-color: var(--color-primary-strong);
  }

  .tree-check.is-on {
    border-color: var(--color-primary-strong);
    background: var(--color-primary-strong);
    color: var(--color-on-primary);
  }

  .tree-check.is-inherited {
    border-color: color-mix(in srgb, var(--color-primary-strong) 46%, var(--color-border));
    background: var(--color-primary-soft);
    color: var(--color-primary-strong);
  }

  .tree-check.is-partial {
    border-color: var(--color-primary-strong);
    color: var(--color-primary-strong);
    background: transparent;
  }

  .tree-check.is-off {
    border-color: var(--color-warning);
    background: color-mix(in srgb, var(--color-warning) 8%, transparent);
    color: var(--color-warning);
  }

  .tree-folder { color: var(--color-text-tertiary); }
  .tree-row.is-card .tree-folder,
  .tree-row.is-inherited .tree-folder { color: var(--color-primary-strong); }

  .tree-name {
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 6px;
    overflow: hidden;
  }

  .tree-name b {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    font-weight: 500;
  }

  .tree-name small {
    flex: 0 0 auto;
    font-size: 9px;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .tree-state {
    height: 18px;
    display: inline-flex;
    align-items: center;
    max-width: 104px;
    padding: 0 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    border-radius: 4px;
    font-size: 9px;
    white-space: nowrap;
    color: var(--color-text-tertiary);
    background: var(--color-fill);
  }

  .tree-state.card {
    color: var(--color-primary-strong);
    background: var(--color-primary-soft);
  }

  .tree-state.excluded {
    color: var(--color-warning);
    background: color-mix(in srgb, var(--color-warning) 8%, transparent);
  }

  .tree-exclude {
    height: 22px;
    display: inline-flex;
    align-items: center;
    padding: 0 5px;
    border-radius: 5px;
    font-size: 9px;
    color: var(--color-text-tertiary);
    white-space: nowrap;
  }

  .tree-exclude:hover {
    background: color-mix(in srgb, var(--color-warning) 7%, transparent);
    color: var(--color-warning);
  }

  .tree-exclude.is-excluded {
    color: var(--color-warning);
    background: color-mix(in srgb, var(--color-warning) 8%, transparent);
  }

  .import-summary {
    min-width: 0;
    min-height: 0;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 1px 1px 2px;
  }

  .summary-head h3 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .summary-head p {
    margin-top: 3px;
    font-size: 10px;
    line-height: 1.5;
    color: var(--color-text-tertiary);
  }

  .summary-metrics {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .summary-metrics span {
    min-height: 24px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0 6px;
    border-radius: 6px;
    background: var(--color-fill);
    font-size: 9px;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  .summary-metrics b {
    font-size: 10px;
    font-weight: 500;
    color: var(--color-text-secondary);
  }

  .summary-list {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--color-border-light);
    border-bottom: 1px solid var(--color-border-light);
  }

  .summary-card-row {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr) 28px;
    align-items: center;
    gap: 7px;
    min-height: 42px;
    padding: 5px 0;
    border-bottom: 1px solid var(--color-border-light);
  }

  .summary-card-row:last-child { border-bottom: 0; }

  .summary-index {
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border-radius: 6px;
    background: var(--color-primary-soft);
    color: var(--color-primary-strong);
    font-size: 9px;
    font-variant-numeric: tabular-nums;
  }

  .summary-card-row div { min-width: 0; }

  .summary-card-row b {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    font-weight: 500;
  }

  .summary-card-row small {
    display: block;
    margin-top: 1px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 9px;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  .summary-empty {
    padding: 14px 0;
    border-top: 1px solid var(--color-border-light);
    border-bottom: 1px solid var(--color-border-light);
    font-size: 10px;
    line-height: 1.5;
    color: var(--color-text-tertiary);
  }

  .summary-note {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-size: 9px;
    line-height: 1.5;
    color: var(--color-text-tertiary);
  }

  .summary-note .ic { flex: 0 0 auto; margin-top: 1px; }
  .summary-note > span { min-width: 0; overflow-wrap: anywhere; }
  .summary-note.is-warn { color: color-mix(in srgb, var(--color-warning) 78%, var(--color-text-secondary)); }
  .summary-note.is-warn .ic { color: var(--color-warning); }

  /* Drawer */
  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(7, 14, 22, 0.22);
    pointer-events: auto;
    animation: fadeIn 160ms var(--ease-out);
  }

  .drawer {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(420px, calc(100% - 80px));
    display: flex;
    flex-direction: column;
    background: var(--color-raised);
    border-radius: var(--radius-lg) 0 0 var(--radius-lg);
    box-shadow:
      inset 1px 0 0 var(--color-border-light),
      -18px 0 60px rgba(8, 20, 34, 0.18);
    pointer-events: auto;
    animation: drawerIn 220ms var(--ease-out);
  }

  .drawer-head {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 16px 12px 20px;
  }

  .drawer-head h2 { font-size: var(--fs-title); font-weight: 500; letter-spacing: -0.02em; }
  .drawer-head p { margin-top: 3px; font-size: 10px; color: var(--color-text-tertiary); }

  .drawer-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 2px 20px 20px;
  }

  .drawer-foot {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding: 12px 16px 14px;
    border-top: 1px solid var(--color-border-light);
  }

  .field { margin-top: 14px; }

  .field > label,
  .field-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 5px;
    font-size: 10px;
    font-weight: 500;
    color: var(--color-text-secondary);
  }

  .field > label small,
  .field-label small { font-weight: 400; color: var(--color-text-tertiary); }

  .input,
  .textarea {
    width: 100%;
    padding: 0 9px;
    border: 1px solid var(--color-border);
    border-radius: 9px;
    background: var(--color-field);
    outline: none;
    font-size: var(--fs-sm);
    color: var(--color-text-primary);
    transition: border-color var(--duration-fast), box-shadow var(--duration-fast);
  }

  .input { height: 32px; }

  .textarea {
    min-height: 92px;
    padding: 8px 9px;
    resize: vertical;
    line-height: 1.55;
  }

  .input:focus,
  .textarea:focus {
    border-color: var(--color-primary-strong);
    box-shadow: 0 0 0 3px var(--color-primary-soft);
  }

  .field-error {
    display: none;
    margin-top: 4px;
    font-size: 10px;
    color: var(--color-error);
  }

  .field.invalid .input { border-color: var(--color-error); }
  .field.invalid .field-error { display: block; }

  .chip-field {
    min-height: 32px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    padding: 4px 6px;
    border: 1px solid var(--color-border);
    border-radius: 9px;
    background: var(--color-field);
  }

  .chip-field:focus-within {
    border-color: var(--color-primary-strong);
    box-shadow: 0 0 0 3px var(--color-primary-soft);
  }

  .chip-field input {
    flex: 1;
    min-width: 90px;
    height: 22px;
    border: 0;
    background: transparent;
    outline: none;
    font-size: 11px;
    color: var(--color-text-primary);
  }

  .chip-field input::placeholder { color: var(--color-text-tertiary); }

  .edit-chip {
    height: 21px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 0 3px 0 7px;

      .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, "zh"));
  };

  const artistNameKey = (value) => String(value || "").trim().toLocaleLowerCase();

  const ensureArtistProfile = (name) => {
    const key = artistNameKey(name);
    const found = LIB.artistProfiles.find((p) => artistNameKey(p.name) === key || p.aliases.some((a) => artistNameKey(a) === key));
    if (found) return found;
    const profile = {
      id: `artist-${hash(name).toString(36)}`,
      name,
      aliases: [],
      bio: "",
      p: hash(name) % PALETTES.length
    };
    LIB.artistProfiles.push(profile);
    return profile;
  };

  const artistById = (id) => id === "__none"
    ? { id: "__none", name: "未指定艺人", aliases: [], bio: "这些合集还没有署名。补上艺人后会自动归入对应艺人页。", p: 0 }
    : LIB.artistProfiles.find((p) => p.id === id) || null;

  const artistHasCollection = (profile, c) => profile.id === "__none"
    ? !c.artists.length
    : c.artists.some((name) => {
      const key = artistNameKey(name);
      return key === artistNameKey(profile.name) || profile.aliases.some((a) => artistNameKey(a) === key);
    });

  const allArtists = () => {
    const map = new Map();
    LIB.collections.forEach((c) => {
      const seen = new Set();
      c.artists.forEach((name) => {
        const profile = ensureArtistProfile(name);
        if (seen.has(profile.id)) return;
        seen.add(profile.id);
        const record = map.get(profile.id) || { ...profile, count: 0 };
        record.count += 1;
        map.set(profile.id, record);
      });
    });
    LIB.extraArtists.forEach((name) => {
      const profile = ensureArtistProfile(name);
      if (!map.has(profile.id)) map.set(profile.id, { ...profile, count: 0 });
    });
    return Array.from(map.values())
      .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, "zh"));
  };

  const seriesById = (id) => LIB.series.find((s) => s.id === id) || null;

  const seriesCollections = (series) => (series?.collectionIds || [])
    .map((id) => byId(id))
    .filter(Boolean);

  const seriesStats = (series) => {
    const rows = seriesCollections(series);
    return {
      rows,
      collections: rows.length,
      videos: rows.reduce((n, c) => n + c.videos, 0),
      images: rows.reduce((n, c) => n + c.images, 0),
      size: rows.reduce((n, c) => n + parseFloat(c.size || "0"), 0).toFixed(1)
    };
  };

  const episodesFor = (c) => {
    const count = Math.max(1, c.videos);
    return Array.from({ length: count }, (_, i) => {
      const n = i + 1;
      let title;
      if (count === 1) title = c.episodeTitle || c.title;
      else if (c.id === "midnight-radio") title = `第 ${n} 期 · ${EPISODE_TITLES[(n + 7) % EPISODE_TITLES.length]}`;
      else if (c.id === "night-tram") title = `第 ${n} 集 · ${EPISODE_TITLES[(n - 1) % EPISODE_TITLES.length]}`;
      else title = `第 ${n} 段 · ${EPISODE_TITLES[(n + 2) % EPISODE_TITLES.length]}`;
      const dur = 1380 + ((hash(c.id + n) % 900));
      return {
        n, title, dur,
        file: `${c.id.toUpperCase().replace(/-/g, "_")}_${pad(n)}.mp4`,
        watched: n <= (c.episodeNo || 1)
      };
    });
  };

  const photoItem = (c, index) => {
    const h = hash(c.id + ":" + index);
    const dims = [
      [4032, 3024, "4 / 3"], [3024, 4032, "3 / 4"], [4000, 3000, "4 / 3"],
      [3000, 4000, "3 / 4"], [4800, 3200, "3 / 2"], [3600, 3600, "1 / 1"],
      [6000, 4000, "3 / 2"], [3200, 4800, "2 / 3"]
    ];
    const d = dims[h % dims.length];
    const motifs = ["horizon", "wave", "arc", "bands", "grid", "aperture", "bloom"];
    const motif = motifs[(h + index) % motifs.length];
    const prefix = c.kind === "image" ? "IMG" : "FRM";
    return {
      index,
      name: `${prefix}_${String(index + 1).padStart(4, "0")}.jpg`,
      w: d[0], h: d[1], ar: d[2], motif,
      size: (2.1 + (h % 58) / 10).toFixed(1) + " MB",
      p: (c.p + (h % 3)) % PALETTES.length
    };
  };

  /* ─────────────────────────────────────────────────────────────
     Generated poster / still art
     These are deliberate placeholder posters, not fake photography.
     Real thumbnails replace them after import.
  ───────────────────────────────────────────────────────────── */
  const paletteVars = (p) => `--c1:${p.c1};--c2:${p.c2};--c3:${p.c3};--fg:${p.fg}`;

  const posterHTML = (c, opts = {}) => {
    const withTitle = opts.title !== false;
    const withFoot = opts.foot !== false;
    const p = PALETTES[c.p % PALETTES.length];
    return `<div class="poster" data-m="${esc(c.m)}" style="${paletteVars(p)}" aria-hidden="true">
      <span class="f1"></span><span class="f2"></span><span class="f3"></span>
      ${withFoot ? `<span class="poster-foot">${esc(c.year)} · ${esc(displayArtist(c))}</span>` : ""}
      ${withTitle ? `<span class="poster-title">${esc(c.title)}</span>` : ""}
    </div>`;
  };

  const stillHTML = (c, seed = 0, motifOverride) => {
    const p = PALETTES[((c.p || 0) + (seed % 3)) % PALETTES.length];
    const motifs = ["horizon", "wave", "arc", "bands", "grid", "aperture", "bloom"];
    const motif = motifOverride || motifs[seed % motifs.length];
    const x = 18 + (hash(c.id + seed) % 38);
    const y = 12 + (hash(c.id + seed + "y") % 30);
    return `<div class="still" data-m="${motif}" data-v="${seed % 3}" style="${paletteVars(p)};--x:${x}%;--y:${y}%" aria-hidden="true"><i></i><b></b></div>`;
  };

  const coverHTML = (c, opts = {}) => {
    const small = opts.small === true;
    if (c.kind === "video") {
      return `<div class="cover-art">${posterHTML(c, small ? { title: false, foot: false } : {})}</div>`;
    }
    if (c.kind === "image") {
      return `<div class="cover-art">
        <div class="mosaic m4">${stillHTML(c, 0)}${stillHTML(c, 1)}${stillHTML(c, 2)}${stillHTML(c, 3)}</div>
        ${small ? "" : `<div class="cover-caption-strip"><span>${esc(c.title)}</span><small>${c.images} 张</small></div>`}
      </div>`;
    }
    return `<div class="cover-art">
      <div class="split">
        <div class="split-main">${posterHTML(c, small ? { title: false, foot: false } : {})}</div>
        <div class="split-quad">${stillHTML(c, 0)}${stillHTML(c, 1)}${stillHTML(c, 2)}${stillHTML(c, 3)}</div>
      </div>
    </div>`;
  };

  const heroCoverHTML = (c) => `<div class="cover-art">${posterHTML(c, { title: false, foot: false })}</div>`;

  /* ─────────────────────────────────────────────────────────────
     State & routing
  ───────────────────────────────────────────────────────────── */
  const state = {
    path: "library",
    id: null,
    tab: null,
    photo: null,
    ep: null,
    q: "",
    type: "all",
    tag: null,
    artist: null,
    sort: "added",
    view: "grid",
    night: false,
    scanning: false,
    importStage: "setup",
    importPath: "",
    importSelected: new Set(DEFAULT_IMPORT_SELECTED),
    importExcluded: new Set(DEFAULT_IMPORT_EXCLUDED),
    importCollapsed: new Set(),
    importVideos: true,
    importImages: true,
    importRecursive: true,
    importHidden: false,
    importing: false,
    editDraft: null,
    confirm: null,
    newTagOpen: false,
    artistEditing: false,
    artistQuery: "",
    artistType: "all",
    artistTag: null,
    artistSort: "added",
    seriesCreating: false,
    seriesEditing: false,
    seriesPicker: null,
    playing: false,
    playerT: 0
  };

  let scanTimer = null;
  let playerTimer = null;
  let toastTimer = null;
  let lastFocus = null;

  const parseRoute = () => {
    const raw = (location.hash || "#library").slice(1);
    const [pathPart, query = ""] = raw.split("?");
    const params = new URLSearchParams(query);
    const seg = pathPart.split("/").filter(Boolean);
    const path = seg[0] || "library";
    return { path, id: seg[1] || null, params };
  };

  const buildLibraryHash = (params = new URLSearchParams()) => {
    if (state.q) params.set("q", state.q);
    if (state.type !== "all") params.set("type", state.type);
    if (state.tag) params.set("tag", state.tag);
    if (state.artist) params.set("artist", state.artist);
    if (state.sort !== "added") params.set("sort", state.sort);
    if (state.view !== "grid") params.set("view", state.view);
    const qs = params.toString();
    return "#library" + (qs ? "?" + qs : "");
  };

  const syncLibraryHash = () => {
    const hashValue = buildLibraryHash();
    if (location.hash !== hashValue) history.replaceState(null, "", hashValue);
  };

  const go = (hashValue, replace = false) => {
    if (replace) {
      history.replaceState(null, "", hashValue);
      applyRoute();
      return;
    }
    if (location.hash === hashValue) applyRoute();
    else location.hash = hashValue;
  };

  const detailHash = (c, tab, extra = {}) => {
    const params = new URLSearchParams();
    if (tab) params.set("tab", tab);
    Object.entries(extra).forEach(([k, v]) => { if (v !== null && v !== undefined) params.set(k, v); });
    const qs = params.toString();
    return `#detail/${c.id}` + (qs ? "?" + qs : "");
  };

  const applyRoute = () => {
    stopPlayer();
    const r = parseRoute();
    const previousPath = state.path;
    const previousId = state.id;
    state.path = r.path;
    state.id = r.id;

    state.q = r.params.get("q") || "";
    state.type = r.params.get("type") || "all";
    state.tag = r.params.get("tag") || null;
    state.artist = r.params.get("artist") || null;
    state.sort = r.params.get("sort") || "added";
    state.view = r.params.get("view") === "list" ? "list" : "grid";
    state.tab = r.params.get("tab") || null;
    state.photo = r.params.has("photo") ? Number(r.params.get("photo")) : null;
    state.ep = r.params.has("ep") ? Number(r.params.get("ep")) : null;
    state.confirm = null;
    state.seriesPicker = null;
    state.seriesEditing = false;
    state.seriesCreating = false;
    state.artistEditing = false;

    if (r.path === "artists" && (previousPath !== "artists" || previousId !== r.id)) {
      state.artistQuery = "";
      state.artistType = "all";
      state.artistTag = null;
      state.artistSort = "added";
    }

    state.night = localStorage.getItem("edt-media-preview-night") === "1" || r.params.get("theme") === "night";

    if (r.path === "import") {
      const requestedStage = r.params.get("stage") || "setup";
      state.importStage = ["setup", "scanning", "confirm", "result"].includes(requestedStage)
        ? requestedStage
        : "setup";
      if (state.importStage === "confirm" || state.importStage === "result") {
        if (!state.importPath) state.importPath = IMPORT_TREE.path;
      }
      if (state.importStage !== "scanning") stopImportScan();
    } else {
      stopImportScan();
    }

    if (r.path === "edit") {
      const c = byId(r.id);
      if (!c) { go("#library", true); return; }
      if (!state.editDraft || state.editDraft.id !== c.id) state.editDraft = makeDraft(c);
    } else {
      state.editDraft = null;
    }

    if (r.path === "detail" && !byId(r.id)) {
      go("#library", true);
      return;
    }
    if (r.path === "series" && r.id && !seriesById(r.id)) {
      go("#series", true);
      return;
    }
    if (r.path === "artists" && r.id && !artistById(r.id)) {
      go("#artists", true);
      return;
    }

    renderAll();

    if (r.path === "edit") {
      setTimeout(() => { $("#draft-title")?.focus(); }, 30);
    }
  };

  /* ─────────────────────────────────────────────────────────────
     Filtering & sorting
  ───────────────────────────────────────────────────────────── */
  const hasFilters = () => Boolean(state.q || state.tag || state.artist || state.type !== "all");

  const filteredCollections = () => {
    const q = state.q.trim().toLowerCase();
    let list = LIB.collections.slice();
    if (state.type !== "all") list = list.filter((c) => c.kind === state.type);
    if (state.tag) list = list.filter((c) => c.tags.includes(state.tag));
    if (state.artist === "__none") list = list.filter((c) => !c.artists.length);
    else if (state.artist) {
      const artistKey = artistNameKey(state.artist);
      const profile = allArtists().find((a) =>
        artistNameKey(a.name) === artistKey || a.aliases.some((alias) => artistNameKey(alias) === artistKey)
      ) || ensureArtistProfile(state.artist);
      list = list.filter((c) => artistHasCollection(profile, c));
    }
    if (q) {
      list = list.filter((c) => {
        const hay = [c.title, c.artist, c.description, c.path, ...(c.tags || [])].join(" ").toLowerCase();
        return hay.includes(q);
      });
    }
    if (state.sort === "title") list.sort((a, b) => a.title.localeCompare(b.title, "zh"));
    else if (state.sort === "items") list.sort((a, b) => itemTotal(b) - itemTotal(a));
    else if (state.sort === "size") list.sort((a, b) => parseFloat(b.size) - parseFloat(a.size));
    else list.sort((a, b) => new Date(b.addedAt) - new Date(a.addedAt));
    return list;
  };

  const countLabel = (c) => {
    if (c.kind === "video") return c.videos > 1 ? `${c.videos} 集` : "单条";
    if (c.kind === "image") return `${c.images} 张`;
    return `${c.videos} + ${c.images}`;
  };

  const kindChip = (c) => `<span class="kind-chip">${icon(KIND[c.kind].icon, 11)}${KIND[c.kind].label}</span>`;
  const countChip = (c) => `<span class="count-chip">${countLabel(c)}</span>`;

  const tagsHTML = (c, limit = 2) => {
    const tags = displayTags(c);
    if (!tags.length) return `<span class="tag tag-empty">未添加标签</span>`;
    const shown = tags.slice(0, limit).map((t) => `<span class="tag">${esc(t)}</span>`).join("");
    const more = tags.length > limit ? `<span class="tag more">+${tags.length - limit}</span>` : "";
    return shown + more;
  };

  /* ─────────────────────────────────────────────────────────────
     Icons
  ───────────────────────────────────────────────────────────── */
  const ICONS = {
    play: { body: '<path d="M8 5v14l11-7z"/>', fill: true },
    pause: { body: '<rect x="7" y="5" width="3.4" height="14" rx="1"/><rect x="13.6" y="5" width="3.4" height="14" rx="1"/>', fill: true },
    film: { body: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>' },
    image: { body: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 15-5-5L5 21"/>' },
    layers: { body: '<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/>' },
    search: { body: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/>' },
    close: { body: '<path d="M6 6l12 12M18 6 6 18"/>' },
    chevronDown: { body: '<path d="m6 9 6 6 6-6"/>' },
    chevronRight: { body: '<path d="m9 6 6 6-6 6"/>' },
    arrowLeft: { body: '<path d="M19 12H5M11 18l-6-6 6-6"/>' },
    arrowRight: { body: '<path d="M5 12h14M13 6l6 6-6 6"/>' },
    plus: { body: '<path d="M12 5v14M5 12h14"/>' },
    minus: { body: '<path d="M5 12h14"/>' },
    refresh: { body: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>' },
    edit: { body: '<path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="m14.5 6.5 3 3"/>' },
    check: { body: '<path d="m5 12 4 4L19 6"/>' },
    shield: { body: '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6Z"/><path d="m9 12 2 2 4-4"/>' },
    folder: { body: '<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>' },
    folderPlus: { body: '<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M12 11v6M9 14h6"/>' },
    grid: { body: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>' },
    list: { body: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>' },
    more: { body: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>', fill: true },
    volume: { body: '<path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M17 9.5a4 4 0 0 1 0 5M19.5 7a8 8 0 0 1 0 10"/>' },
    fullscreen: { body: '<path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>' },
    settings: { body: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>' },
    trash: { body: '<path d="M4 7h16M9 3h6l1 4H8l1-4ZM6 7l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/>' },
    copy: { body: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>' },
    external: { body: '<path d="M14 3h7v7M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>' },
    info: { body: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>' },
    warning: { body: '<path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5M12 17h.01"/>' },
    clock: { body: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' },
    sliders: { body: '<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/>' },
    sidebar: { body: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>' }
  };

  function icon(name, size = 16) {
    const item = ICONS[name] || ICONS.info;
    const fill = item.fill ? "currentColor" : "none";
    const stroke = item.fill ? "none" : "currentColor";
    return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill}" stroke="${stroke}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${item.body}</svg>`;
  }

  /* ─────────────────────────────────────────────────────────────
     Shell
  ───────────────────────────────────────────────────────────── */
  const spineItems = () => {
    const inboxCount = LIB.collections.filter(hasNeeds).length;
    return [
      { id: "library", label: "资料库", count: LIB.collections.length },
      { id: "series", label: "系列", count: LIB.series.length },
      { id: "inbox", label: "待整理", count: inboxCount, warn: true },
      { id: "tags", label: "标签", count: allTags().length, sep: true },
      { id: "artists", label: "艺人", count: allArtists().length },
      { id: "sources", label: "来源", count: LIB.sources.length }
    ];
  };

  const activeSpine = () => {
    if (state.path === "detail" || state.path === "edit" || state.path === "import") return "library";
    return state.path;
  };

  const renderSpine = () => {
    const active = activeSpine();
    const html = `<div class="spine-label">浏览</div>` + spineItems().map((item) => `
      ${item.sep ? '<div class="spine-sep"></div>' : ""}
      <a class="spine-item ${active === item.id ? "active" : ""}" href="#${item.id}" ${active === item.id ? 'aria-current="page"' : ""}>
        <span>${item.label}</span><b class="${item.warn && item.count ? "warn" : ""}">${item.count}</b>
      </a>`).join("") + `
      <div class="spine-bottom">
        <span class="spine-note">${icon("shield", 12)}只读索引<br>不改动原文件</span>
      </div>`;
    const spine = $("#spine");
    if (spine) spine.innerHTML = html;
  };

  const statusFor = () => {
    if (state.scanning) return { text: "正在扫描…", dot: "busy" };
    if (state.path === "detail" || state.path === "edit") {
      const c = byId(state.id);
      if (c) return { text: `${c.videos} 视频 · ${c.images} 图片 · ${c.size}`, dot: "ok" };
    }
    if (state.path === "tags") return { text: `${allTags().length} 个标签`, dot: "ok" };
    if (state.path === "artists" && state.id) {
      const artist = artistById(state.id);
      if (artist) {
        const count = LIB.collections.filter((c) => artistHasCollection(artist, c)).length;
        return { text: `${artist.name} · ${count} 个合集`, dot: "ok" };
      }
    }
    if (state.path === "artists") return { text: `${allArtists().length} 位艺人`, dot: "ok" };
    if (state.path === "series" && state.id) {
      const series = seriesById(state.id);
      if (series) {
        const stats = seriesStats(series);
        return { text: `${series.name} · ${stats.collections} 个合集`, dot: "ok" };
      }
    }
    if (state.path === "series") return { text: `${LIB.series.length} 个系列`, dot: "ok" };
    if (state.path === "sources") {
      const changed = LIB.sources.some((s) => s.status === "changed");
      return { text: `${LIB.sources.length} 个来源 · ${totalItems().toLocaleString("en-US")} 项`, dot: changed ? "warn" : "ok" };
    }
    const changed = LIB.sources.some((s) => s.status === "changed");
    return { text: `${LIB.collections.length} 个合集 · ${totalItems().toLocaleString("en-US")} 项`, dot: changed ? "warn" : "ok" };
  };

  const renderChrome = () => {
    const status = statusFor();
    const statusEl = $("#topbar-status");
    if (statusEl) statusEl.innerHTML = `<i class="dot ${status.dot}"></i><span>${status.text}</span>`;
    const rescan = $("#rescan-btn");
    if (rescan) {
      rescan.disabled = state.scanning;
      rescan.innerHTML = state.scanning
        ? `${icon("refresh", 15)}<span>扫描中…</span>`
        : `${icon("refresh", 15)}<span>重新扫描</span>`;
    }
    const surface = $("#surface");
    if (surface) surface.classList.toggle("is-scanning", state.scanning);
    document.documentElement.style.colorScheme = state.night ? "dark" : "light";
  };

  /* ─────────────────────────────────────────────────────────────
     Library view
  ───────────────────────────────────────────────────────────── */
  const featuredCollection = () => {
    const sorted = LIB.collections.slice().sort((a, b) => new Date(b.addedAt) - new Date(a.addedAt));
    return sorted.find((c) => !hasNeeds(c) && (c.kind === "video" || c.kind === "mixed")) || sorted[0];
  };

  const continueItems = () => LIB.collections.filter((c) => c.progress > 0).sort((a, b) => b.progress - a.progress).slice(0, 3);

  const billboardHTML = () => {
    const c = featuredCollection();
    if (!c) return "";
    const episode = episodesFor(c).find((e) => e.n === (c.episodeNo || 1)) || episodesFor(c)[0];
    const remaining = c.progress > 0 ? Math.max(1, Math.round((episode.dur * (1 - c.progress)) / 60)) : 0;
    return `<article class="billboard">
      ${heroCoverHTML(c)}
      <div class="billboard-shade"></div>
      <div class="billboard-flags">
        <span class="kind-chip" style="position:static">${icon(KIND[c.kind].icon, 11)}${KIND[c.kind].label}</span>
        <span class="kind-chip" style="position:static">${icon("clock", 11)}最近导入</span>
      </div>
      <div class="billboard-body">
        <h2>${esc(c.title)}</h2>
        <p class="meta">${esc(displayArtist(c))} · ${c.year} · ${c.videos ? `${c.videos} 部视频` : ""}${c.videos && c.images ? " · " : ""}${c.images ? `${c.images} 张图片` : ""} · ${esc(c.size)}</p>
        <p class="desc">${esc(c.description)}</p>
        <div class="tag-row">${c.tags.slice(0, 3).map((t) => `<span class="hero-tag">${esc(t)}</span>`).join("")}</div>
        ${c.progress > 0 ? `<div class="billboard-progress"><i style="width:${Math.round(c.progress * 100)}%"></i></div>
          <p class="billboard-progress-label">${esc(c.episodeTitle || episode.title)} · 剩 ${remaining} 分钟</p>` : ""}
        <div class="billboard-actions">
          <a class="btn primary" href="${detailHash(c, c.videos ? "video" : "images")}">${icon(c.videos ? "play" : "image", 15)}${c.progress > 0 ? "继续播放" : "打开合集"}</a>
          <a class="btn on-dark" href="${detailHash(c, "info")}">查看信息</a>
        </div>
      </div>
    </article>`;
  };

  const continueHTML = () => {
    const items = continueItems();
    return `<aside class="continue-panel">
      <div class="cp-head"><h3>继续观看</h3><span>${items.length} 项</span></div>
      ${items.length ? items.map((c) => {
        const ep = episodesFor(c).find((e) => e.n === (c.episodeNo || 1)) || episodesFor(c)[0];
        const remaining = Math.max(1, Math.round((ep.dur * (1 - c.progress)) / 60));
        return `<a class="continue-row" href="${detailHash(c, "video", { ep: ep.n })}">
          <span class="continue-thumb">${stillHTML(c, 1)}</span>
          <span class="continue-body">
            <b class="continue-title">${esc(c.title)}</b>
            <span class="continue-sub">${esc(ep.title)}</span>
            <span class="continue-bar"><i style="width:${Math.round(c.progress * 100)}%"></i></span>
            <span class="continue-time">剩 ${remaining} 分钟</span>
          </span>
          ${icon("play", 14)}
        </a>`;
      }).join("") : `<div class="continue-empty">还没有观看记录。<br>打开一个视频合集开始。</div>`}
    </aside>`;
  };

  const featureBandHTML = () => `<section class="feature-band">${billboardHTML()}${continueHTML()}</section>`;

  const cardHTML = (c, opts = {}) => {
    const progress = c.progress > 0 ? `<div class="card-progress"><i style="width:${Math.round(c.progress * 100)}%"></i></div>` : "";
    const seriesRemove = opts.seriesId
      ? `<button class="quick-btn" aria-label="从系列移除 ${esc(c.title)}" title="从系列移除" data-action="remove-from-series" data-id="${opts.seriesId}" data-collection-id="${c.id}">${icon("close", 13)}</button>`
      : "";
    return `<article class="media-card" tabindex="0" role="link" aria-label="打开合集 ${esc(c.title)}" data-action="open-collection" data-id="${c.id}">
      <div class="card-cover">
        ${coverHTML(c)}
        ${kindChip(c)}
        ${countChip(c)}
        ${hasNeeds(c) ? `<span class="review-chip">${icon("warning", 11)}待完善</span>` : ""}
        <div class="card-quick">
          <button class="quick-btn" aria-label="播放 ${esc(c.title)}" data-action="quick-play" data-id="${c.id}">${icon("play", 13)}</button>
          <button class="quick-btn" aria-label="编辑 ${esc(c.title)}" data-action="edit" data-id="${c.id}">${icon("edit", 13)}</button>
          ${seriesRemove}
        </div>
        ${progress}
      </div>
      <div class="card-caption">
        <h4>${esc(c.title)}</h4>
        <p>${esc(displayArtist(c))} · ${c.year} · ${esc(c.size)}</p>
        <div class="tag-row">${hasNeeds(c) ? `<span class="tag warn">待完善</span>` : ""}${tagsHTML(c)}</div>
      </div>
    </article>`;
  };

  const listRowHTML = (c) => `<article class="list-row" tabindex="0" role="link" aria-label="打开合集 ${esc(c.title)}" data-action="open-collection" data-id="${c.id}">
    <div class="list-main">
      <div class="list-thumb">${coverHTML(c, { small: true })}</div>
      <div style="min-width:0">
        <h4>${esc(c.title)}</h4>
        <p>${esc(displayArtist(c))} · ${esc(c.path)}</p>
      </div>
    </div>
    <span class="list-cell">${KIND[c.kind].label}</span>
    <span class="list-cell">${countLabel(c)}</span>
    <span class="list-cell">${esc(c.size)}</span>
    <span class="list-cell">${esc(c.lastScan)}</span>
    ${icon("chevronRight", 14)}
  </article>`;

  const gridSectionHTML = (list) => {
    if (!list.length) {
      return `<div class="empty">
        <span class="empty-icon">${icon("search", 20)}</span>
        <h3>没有找到匹配的合集</h3>
        <p>试试更短的关键词，或清除类型、标签与艺人筛选。</p>
        <button class="btn secondary" data-action="clear-filters">清除筛选</button>
      </div>`;
    }
    return `<div class="section-head">
      <h3>${hasFilters() ? "筛选结果" : "全部合集"}<span>${list.length}</span></h3>
      <span class="section-meta">${hasFilters() ? "低于 1 秒完成筛选" : "按最近添加排序"}</span>
    </div>` + (state.view === "list"
      ? `<div class="media-list">
          <div class="list-head"><span>合集</span><span>类型</span><span>条目</span><span>大小</span><span>最近扫描</span><span></span></div>
          ${list.map(listRowHTML).join("")}
        </div>`
      : `<div class="card-grid">${list.map(cardHTML).join("")}</div>`);
  };

  const resultsHTML = () => {
    const list = filteredCollections();
    return (hasFilters() ? "" : featureBandHTML()) + gridSectionHTML(list);
  };

  const toolbarHTML = () => {
    const tags = allTags();
    const artists = allArtists();
    return `<div class="toolbar">
      <label class="search-field">
        ${icon("search", 14)}
        <input id="lib-search" type="search" placeholder="搜索标题、艺人、标签…" value="${esc(state.q)}" autocomplete="off" />
        <kbd>/</kbd>
      </label>
      <div class="seg" role="group" aria-label="类型筛选">
        ${[["all", "全部"], ["video", "视频"], ["image", "图集"], ["mixed", "混合"]].map(([value, label]) =>

        </div>
      </details>
      <details class="menu" data-menu>
        <summary>${state.artist ? `<span class="active-dot"></span>艺人 · ${esc(state.artist === "__none" ? "未指定" : state.artist)}` : "艺人"}${icon("chevronDown", 11)}</summary>
        <div class="menu-panel">
          <div class="menu-head">按艺人筛选</div>
          <button class="menu-item ${!state.artist ? "active" : ""}" data-action="filter-artist" data-value="">全部艺人 <small>${artists.length}</small></button>
          ${artists.map((a) => `<button class="menu-item ${state.artist === a.name ? "active" : ""}" data-action="filter-artist" data-value="${esc(a.name)}">${esc(a.name)} <small>${a.count}</small></button>`).join("")}
          <button class="menu-item ${state.artist === "__none" ? "active" : ""}" data-action="filter-artist" data-value="__none">未指定艺人 <small>${LIB.collections.filter((c) => !c.artists.length).length}</small></button>
        </div>
      </details>
      <div class="tb-spacer"></div>
      <span class="result-count" id="result-count">${filteredCollections().length} 个合集</span>
      <details class="menu" data-menu>
        <summary>${icon("sliders", 12)}${state.sort === "title" ? "名称" : state.sort === "items" ? "条目" : state.sort === "size" ? "大小" : "最近添加"}${icon("chevronDown", 11)}</summary>
        <div class="menu-panel right">
          <div class="menu-head">排序</div>
          <button class="menu-item ${state.sort === "added" ? "active" : ""}" data-action="sort" data-value="added">最近添加</button>
          <button class="menu-item ${state.sort === "title" ? "active" : ""}" data-action="sort" data-value="title">名称</button>
          <button class="menu-item ${state.sort === "items" ? "active" : ""}" data-action="sort" data-value="items">条目数</button>
          <button class="menu-item ${state.sort === "size" ? "active" : ""}" data-action="sort" data-value="size">文件大小</button>
        </div>
      </details>
      <div class="view-toggle" role="group" aria-label="视图">
        <button class="${state.view === "grid" ? "active" : ""}" data-action="view" data-value="grid" aria-label="网格视图">${icon("grid", 14)}</button>
        <button class="${state.view === "list" ? "active" : ""}" data-action="view" data-value="list" aria-label="列表视图">${icon("list", 14)}</button>
      </div>
    </div>
    ${filterChipsHTML()}`;
  };

  const filterChipsHTML = () => {
    const chips = [];
    if (state.type !== "all") chips.push(`<span class="filter-chip">${KIND[state.type].label}<button data-action="clear-type" aria-label="清除类型">${icon("close", 11)}</button></span>`);
    if (state.tag) chips.push(`<span class="filter-chip">标签 · ${esc(state.tag)}<button data-action="clear-tag" aria-label="清除标签">${icon("close", 11)}</button></span>`);
    if (state.artist) chips.push(`<span class="filter-chip">艺人 · ${esc(state.artist === "__none" ? "未指定" : state.artist)}<button data-action="clear-artist" aria-label="清除艺人">${icon("close", 11)}</button></span>`);
    if (state.q) chips.push(`<span class="filter-chip">搜索 · ${esc(state.q)}<button data-action="clear-query" aria-label="清除搜索">${icon("close", 11)}</button></span>`);
    if (!chips.length) return `<div class="filter-chips" hidden></div>`;
    return `<div class="filter-chips">${chips.join("")}<button class="clear-filters" data-action="clear-filters">清除全部</button></div>`;
  };

  const libraryViewHTML = () => `<div id="library-toolbar">${toolbarHTML()}</div><div id="results">${resultsHTML()}</div>`;

  /* ─────────────────────────────────────────────────────────────
     Detail view
  ───────────────────────────────────────────────────────────── */
  const detailTab = (c) => {
    if (state.tab === "video" && c.videos) return "video";
    if (state.tab === "images" && c.images) return "images";
    if (state.tab === "info") return "info";
    return c.videos ? "video" : "images";
  };

  const detailHeaderHTML = (c) => `<div class="toolbar detail-toolbar">
    <button class="back-btn" data-action="back-library">${icon("arrowLeft", 14)}资料库</button>
    <span class="crumb-sep">/</span>
    <span class="crumb-title">${esc(c.title)}</span>
    <div class="tb-spacer"></div>
    <button class="btn ghost" data-action="reveal">${icon("folder", 14)}在文件夹中显示</button>
    <button class="btn ghost" data-action="rescan-one" data-id="${c.id}">${icon("refresh", 14)}重新扫描</button>
    <button class="btn secondary" data-action="edit" data-id="${c.id}">${icon("edit", 14)}编辑信息</button>
  </div>`;

  const detailHeroHTML = (c) => {
    const primary = c.videos
      ? `<a class="btn primary" href="${detailHash(c, "video", c.progress > 0 ? { ep: c.episodeNo || 1 } : {})}">${icon("play", 15)}${c.progress > 0 ? "继续播放" : "播放"}</a>`
      : `<a class="btn primary" href="${detailHash(c, "images")}">${icon("image", 15)}浏览图片</a>`;
    const secondary = c.videos && c.images ? `<a class="btn on-dark" href="${detailHash(c, "images")}">${icon("image", 15)}图片 ${c.images}</a>` : "";
    return `<section class="detail-hero">
      ${heroCoverHTML(c)}
      <div class="detail-shade"></div>
      <div class="detail-flags">
        <span class="kind-chip" style="position:static">${icon(KIND[c.kind].icon, 11)}${KIND[c.kind].label}</span>
        <span class="kind-chip" style="position:static">${esc(c.resolution || "")}</span>
      </div>
      <div class="detail-body">
        <h1>${esc(c.title)}</h1>
        <p class="meta">${esc(displayArtist(c))} · ${c.year} · ${c.videos ? `${c.videos} 部视频` : ""}${c.videos && c.images ? " · " : ""}${c.images ? `${c.images} 张图片` : ""} · ${esc(c.size)}</p>
        <p class="desc">${esc(c.description)}</p>
        <div class="tag-row">${c.tags.length ? c.tags.map((t) => `<span class="hero-tag">${esc(t)}</span>`).join("") : `<span class="hero-tag">未添加标签</span>`}</div>
        <div class="detail-actions">${primary}${secondary}<button class="btn on-dark" data-action="edit" data-id="${c.id}">${icon("edit", 14)}编辑信息</button></div>
      </div>
    </section>`;
  };

  const detailTabsHTML = (c) => `<nav class="detail-tabs" role="tablist" aria-label="合集内容">
    ${c.videos ? `<a class="detail-tab ${detailTab(c) === "video" ? "active" : ""}" role="tab" aria-selected="${detailTab(c) === "video"}" href="${detailHash(c, "video")}">视频 <b>${c.videos}</b></a>` : ""}
    ${c.images ? `<a class="detail-tab ${detailTab(c) === "images" ? "active" : ""}" role="tab" aria-selected="${detailTab(c) === "images"}" href="${detailHash(c, "images")}">图片 <b>${c.images}</b></a>` : ""}
    <a class="detail-tab ${detailTab(c) === "info" ? "active" : ""}" role="tab" aria-selected="${detailTab(c) === "info"}" href="${detailHash(c, "info")}">信息</a>
  </nav>`;

  const playerShellHTML = (c, ep) => `<div class="player ${state.playing ? "is-playing" : ""}" id="player">
    <div class="cover-art">${posterHTML(c, { title: false, foot: false })}</div>
    <div class="player-shade"></div>
    <div class="player-top"><span><b>${esc(ep.title)}</b></span><span>${esc(c.resolution || "1080p")}</span></div>
    <button class="player-big" data-action="toggle-play" aria-label="${state.playing ? "暂停" : "播放"}">${icon(state.playing ? "pause" : "play", 24)}</button>
    <div class="player-controls">
      <button class="icon-btn" data-action="toggle-play" aria-label="${state.playing ? "暂停" : "播放"}">${icon(state.playing ? "pause" : "play", 15)}</button>
      <span class="player-time" id="player-time">${fmtTime(state.playerT)} / ${fmtTime(ep.dur)}</span>
      <div class="player-scrub" data-action="seek" role="slider" aria-label="播放进度" aria-valuemin="0" aria-valuemax="${ep.dur}" aria-valuenow="${Math.floor(state.playerT)}">
        <span class="ps-track"><i id="player-fill" style="width:${Math.min(100, (state.playerT / ep.dur) * 100)}%"></i></span>
      </div>
      <button class="icon-btn" aria-label="音量">${icon("volume", 15)}</button>
      <button class="icon-btn" aria-label="播放设置">${icon("settings", 15)}</button>
      <button class="icon-btn" data-action="external-play" aria-label="用外部播放器打开" title="用外部播放器打开">${icon("external", 15)}</button>
      <button class="icon-btn" aria-label="全屏">${icon("fullscreen", 15)}</button>
    </div>
  </div>`;

  const videoTabHTML = (c) => {
    const eps = episodesFor(c);
    const activeN = state.ep || c.episodeNo || 1;
    const ep = eps.find((e) => e.n === activeN) || eps[0];
    const multi = eps.length > 1;
    return `<div class="video-layout">
      <div>
        ${playerShellHTML(c, ep)}
        <div class="player-caption">
          <div>
            <h3>${esc(ep.title)}</h3>
            <p>${esc(ep.file)} · ${fmtTime(ep.dur)} · ${esc(c.size)}${c.lastScan ? ` · 最近扫描 ${esc(c.lastScan)}` : ""}</p>
          </div>
          <div class="tag-row">${c.tags.slice(0, 2).map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        </div>
      </div>
      ${multi ? `<aside class="episode-panel">
        <div class="episode-head"><h3>剧集</h3><span>${eps.length} 集</span></div>
        <div class="episode-list">
          ${eps.map((e) => `<a class="episode-row ${e.n === ep.n ? "active" : ""}" href="${detailHash(c, "video", { ep: e.n })}">
            <span class="episode-index">${pad(e.n)}</span>
            <span class="episode-thumb">${stillHTML(c, e.n + 2)}</span>
            <span class="episode-copy">
              <span class="episode-title">${esc(e.title)}${e.watched ? `<span class="watched">${icon("check", 11)}</span>` : ""}</span>
              <span class="episode-meta">${fmtTime(e.dur)}${e.watched ? " · 已看" : ""}</span>
            </span>
          </a>`).join("")}
        </div>
      </aside>` : `<aside class="episode-panel single-panel">
        <div class="episode-head"><h3>文件</h3><span>1 个视频</span></div>
        <div class="single-info">
          <div class="kv"><dt>文件名</dt><dd class="mono">${esc(ep.file)}</dd></div>
          <div class="kv"><dt>时长</dt><dd>${fmtTime(ep.dur)}</dd></div>
          <div class="kv"><dt>大小</dt><dd>${esc(c.size)}</dd></div>
          <div class="kv"><dt>分辨率</dt><dd>${esc(c.resolution || "—")}</dd></div>
          <div class="kv"><dt>最近扫描</dt><dd>${esc(c.lastScan)}</dd></div>
          <div class="kv"><dt>来源</dt><dd class="mono">${esc(c.path)}</dd></div>
        </div>
        <div class="single-actions">
          <button class="btn ghost" data-action="reveal">${icon("folder", 13)}定位文件</button>
          <button class="btn ghost" data-action="rescan-one" data-id="${c.id}">${icon("refresh", 13)}重扫</button>
        </div>
      </aside>`}
    </div>`;
  };

  const imagesTabHTML = (c) => {
    const count = c.images;
    const items = Array.from({ length: count }, (_, i) => photoItem(c, i));
    return `<div class="gallery-head">
      <h3>图片<span>${count} 张</span></h3>
      <div class="gh-meta"><span>按文件名排序</span><span>·</span><span>全部已索引</span></div>
    </div>
    <div class="masonry">
      ${items.map((it) => `<button class="thumb" style="aspect-ratio:${it.ar}" data-action="open-photo" data-id="${c.id}" data-index="${it.index}" aria-label="查看 ${esc(it.name)}">
        ${stillHTML({ ...c, p: it.p }, it.index, it.motif)}
        <span class="thumb-label">${esc(it.name)}</span>
      </button>`).join("")}
    </div>`;
  };

  const infoTabHTML = (c) => {
    const episodes = episodesFor(c);
    const logs = [
      { when: c.lastScan, text: "完整扫描 · 无变更" },
      { when: c.addedLabel, text: "首次导入 · 生成 1 个合集" },
      { when: "更早", text: "缩略图缓存清理后重建" }
    ];
    return `<div class="info-layout">
      <div>
        <div class="info-block">
          <h3>简介</h3>
          <p class="info-desc">${esc(c.description)}</p>
        </div>
        <div class="info-block">
          <h3>标签</h3>

  const detailViewHTML = (c) => {
    const tab = detailTab(c);
    return `${detailHeaderHTML(c)}
      ${detailHeroHTML(c)}

      <div class="detail-content">

        ${tab === "images" ? imagesTabHTML(c) : ""}

  };

  /* ─────────────────────────────────────────────────────────────
     Management views
  ───────────────────────────────────────────────────────────── */
  const tagStats = () => {
    const tags = allTags();
    const total = LIB.collections.length;
    return tags.map((t) => {
      const rows = LIB.collections.filter((c) => c.tags.includes(t.name));
      const size = rows.reduce((n, c) => n + parseFloat(c.size || "0"), 0);
      const latest = rows.slice().sort((a, b) => new Date(b.addedAt) - new Date(a.addedAt))[0];
      return { ...t, size: size.toFixed(1), latest: latest ? latest.addedLabel : "—", share: total ? t.count / total : 0 };
    });
  };

  const tagsViewHTML = () => {
    const tags = tagStats();
    const tagged = LIB.collections.filter((c) => c.tags.length).length;
    const untagged = LIB.collections.length - tagged;
    return `<div class="view-head">
      <div>
        <h1>标签</h1>
        <p>标签只写入 edt 的元信息，不修改文件夹名称。点击任意标签回到资料库查看对应合集。</p>
      </div>
      <div class="view-head-actions">
        <button class="btn secondary" data-action="toggle-new-tag">${icon("plus", 14)}新建标签</button>
      </div>
    </div>
    <div class="summary-line">
      <span><b>${tags.length}</b> 个标签</span>
      <span><b>${tagged}</b> / ${LIB.collections.length} 个合集已标记</span>
      <span><b>${untagged}</b> 个合集等待整理</span>
    </div>
    ${state.newTagOpen ? `<div class="tag-new-row">
      <input id="new-tag-input" placeholder="输入标签名，回车添加" autocomplete="off" />
      <button class="btn secondary" data-action="add-tag">添加</button>
      <button class="btn ghost" data-action="toggle-new-tag">取消</button>
    </div>` : ""}
    <div class="list-table">
      <div class="list-head"><span>标签</span><span>合集</span><span>占资料库比例</span><span>最近使用</span><span></span></div>
      ${tags.map((t) => `<div class="tag-index-row" role="link" tabindex="0" data-action="filter-tag" data-value="${esc(t.name)}">
        <span class="tag-name"><span class="hash">#</span><span>${esc(t.name)}</span></span>
        <span class="tag-count">${t.count} 个</span>
        <span class="share"><i style="width:${Math.max(4, Math.round(t.share * 100))}%"></i></span>
        <span class="tag-last">${esc(t.latest)}</span>
        ${icon("chevronRight", 14)}
      </div>`).join("")}
      <div class="tag-index-row" role="link" tabindex="0" data-action="filter-tag" data-value="">
        <span class="tag-name"><span class="hash">#</span><span>未添加标签</span></span>
        <span class="tag-count">${untagged} 个</span>
        <span class="share"><i style="width:${Math.round((untagged / Math.max(1, LIB.collections.length)) * 100)}%;opacity:.4"></i></span>
        <span class="tag-last">—</span>
        ${icon("chevronRight", 14)}
      </div>
    </div>`;
  };

  const artistStats = () => {
    const artists = allArtists();
    return artists.map((a, i) => {
      const rows = LIB.collections.filter((c) => artistHasCollection(a, c));
      return {
        ...a,
        rows,
        videos: rows.reduce((n, c) => n + c.videos, 0),
        images: rows.reduce((n, c) => n + c.images, 0),
        size: rows.reduce((n, c) => n + parseFloat(c.size || "0"), 0).toFixed(1),
        p: Number.isInteger(a.p) ? a.p : i % PALETTES.length
      };
    });
  };

  const artistInitials = (name) => /[A-Za-z]/.test(name)
    ? name.replace(/\s+/g, "").slice(0, 2).toUpperCase()
    : name.slice(0, 1);

  const artistTagStats = (profile) => {
    const map = new Map();
    LIB.collections
      .filter((c) => artistHasCollection(profile, c))
      .forEach((c) => c.tags.forEach((t) => map.set(t, (map.get(t) || 0) + 1)));
    return Array.from(map.entries())
      .map(([name, count]) => ({ name, count }))
      .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, "zh"));
  };

  const artistWorks = (profile) => {
    const q = state.artistQuery.trim().toLowerCase();
    let list = LIB.collections.filter((c) => artistHasCollection(profile, c));
    if (state.artistType !== "all") list = list.filter((c) => c.kind === state.artistType);
    if (state.artistTag) list = list.filter((c) => c.tags.includes(state.artistTag));
    if (q) {
      list = list.filter((c) => {
        const hay = [c.title, c.description, c.path, ...(c.artists || []), ...(c.tags || [])].join(" ").toLowerCase();
        return hay.includes(q);
      });
    }
    if (state.artistSort === "title") list.sort((a, b) => a.title.localeCompare(b.title, "zh"));
    else if (state.artistSort === "items") list.sort((a, b) => itemTotal(b) - itemTotal(a));
    else if (state.artistSort === "size") list.sort((a, b) => parseFloat(b.size) - parseFloat(a.size));
    else list.sort((a, b) => new Date(b.addedAt) - new Date(a.addedAt));
    return list;

    </div>`;

  const artistResultsHTML = (profile) => {

          </div>

      <div class="field">
        <label for="new-series-name">系列名称</label>

    return `<div class="view-head">
      <div>
        <h1>系列</h1>

    <div class="series-grid">

        <b>新建第一个系列</b>

  const seriesEditFormHTML = (series) => `<div class="series-edit-panel">

          <span class="series-cover-shade"></span>

        <div class="series-hero-copy">

      ${rows.length
        ? `<div class="card-grid">${rows.map((c) => cardHTML(c, { seriesId: series.id })).join("")}</div>`
        : `<div class="empty artist-empty">
            <span class="empty-icon">${icon("layers", 20)}</span>
            <h3>系列还是空的</h3>
            <p>从资料库挑选多个合集放进来，它们会按添加顺序显示。</p>
            <button class="btn primary" data-action="open-series-picker">${icon("plus", 14)}添加合集</button>
          </div>`}`;
  };

  const seriesViewHTML = () => state.id ? seriesDetailHTML(state.id) : seriesIndexHTML();

  const seriesPickerRowsHTML = () => {
    const picker = state.seriesPicker;
    const series = picker && seriesById(picker.seriesId);
    if (!picker || !series) return "";
    const current = new Set(series.collectionIds);
    const q = picker.q.trim().toLowerCase();
    const list = LIB.collections.filter((c) => {
      if (!q) return true;
      const hay = [c.title, c.description, c.path, ...(c.artists || []), ...(c.tags || [])].join(" ").toLowerCase();
      return hay.includes(q);
    });
    if (!list.length) {
      return `<div class="picker-empty">没有匹配的合集。试试更短的关键词。</div>`;
    }
    return list.map((c) => {
      const locked = current.has(c.id);
      const selected = locked || picker.selected.has(c.id);
      return `<button class="picker-row ${selected ? "is-selected" : ""} ${locked ? "is-locked" : ""}" data-action="toggle-series-pick" data-id="${c.id}" ${locked ? "disabled" : ""}>
        <span class="picker-check">${selected ? icon("check", 10) : ""}</span>
        <span class="picker-thumb">${coverHTML(c, { small: true })}</span>
        <span class="picker-copy"><b>${esc(c.title)}</b><small>${KIND[c.kind].label} · ${countLabel(c)} · ${esc(displayArtist(c))}</small></span>
        <span class="picker-state">${locked ? "已在系列" : selected ? "将添加" : ""}</span>
      </button>`;
    }).join("");
  };

  const seriesPickerHTML = () => {
    const picker = state.seriesPicker;
    const series = picker && seriesById(picker.seriesId);
    if (!picker || !series) return "";
    const count = picker.selected.size;
    return `<div class="overlay" data-action="picker-backdrop">
      <div class="dialog series-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="series-picker-title" data-stop>
        <div class="dialog-head">
          <div><h2 id="series-picker-title">添加合集到「${esc(series.name)}」</h2><p>从资料库选择，可一次添加多个；只建立引用，不复制文件。</p></div>
          <button class="icon-btn" data-action="close-series-picker" aria-label="关闭添加合集">${icon("close", 16)}</button>
        </div>
        <div class="dialog-body">
          <label class="search-field picker-search">
            ${icon("search", 14)}
            <input id="series-picker-q" value="${esc(picker.q)}" placeholder="搜索片名、艺人、标签或路径…" autocomplete="off" />
          </label>
          <div class="picker-note">系列已有 <b>${series.collectionIds.length}</b> 个合集。勾选要追加的合集，已存在的不可重复添加。</div>
          <div class="picker-list" id="series-picker-list">${seriesPickerRowsHTML()}</div>
        </div>
        <div class="dialog-foot">
          <span class="foot-note">${icon("shield", 13)}原文件与合集归属不变</span>
          <div class="dialog-actions">
            <button class="btn ghost" data-action="close-series-picker">取消</button>
            <button class="btn primary" id="series-picker-save" data-action="save-series-picker" ${count ? "" : "disabled"}>添加 ${count} 个合集</button>
          </div>
        </div>
      </div>
    </div>`;
  };

  const refreshSeriesPicker = (focusId = "") => {
    const list = $("#series-picker-list");
    if (list) list.innerHTML = seriesPickerRowsHTML();
    const picker = state.seriesPicker;
    const save = $("#series-picker-save");
    if (picker && save) {
      save.disabled = !picker.selected.size;
      save.textContent = `添加 ${picker.selected.size} 个合集`;
