<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>媒体库 · 设计预览 · everydaytool</title>
<link rel="stylesheet" href="../../renderer/shared/styles/fonts/roboto.css" />
<style>
  /* ─────────────────────────────────────────────────────────────
     01 · Tokens
     直接取自 renderer/shared/styles/tokens.scss；夜色调自 DESIGN §2.2。
     媒体内容标题使用工具页 18px 上限，不新增 20–22px 令牌。
  ───────────────────────────────────────────────────────────── */
  :root {
    --color-primary: #3390ec;
    --color-primary-strong: #006dc3;
    --color-primary-soft: color-mix(in srgb, var(--color-primary) 10%, transparent);
    --color-primary-light: color-mix(in srgb, var(--color-primary) 20%, transparent);
    --color-on-primary: #ffffff;

    --color-success: #007b54;
    --color-warning: #975f00;
    --color-error: #cf1c28;

    --color-app-bg: #edf3f8;
    --color-raised: #fbfdff;
    --color-fill: #edf3f8;
    --color-well: color-mix(in oklab, var(--color-fill) 34%, transparent);
    --color-input: #ffffff;
    --color-field: #ffffff;
    --color-button: #ffffff;
    --color-pop: #fbfdff;
    --color-on-solid: #ffffff;

    --color-text-primary: #0b1724;
    --color-text-secondary: #526273;
    --color-text-tertiary: #5f6f80;
    --color-border-light: #dfe8ef;
    --color-border: #cbd8e3;

    --radius-xs: 7px;
    --radius-sm: 10px;
    --radius-control: 11px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 22px;

    --shadow-sm: 0 10px 34px rgba(27, 57, 87, 0.10);
    --shadow-md: 0 18px 48px rgba(29, 62, 94, 0.12);
    --shadow-lg: 0 24px 70px rgba(22, 50, 78, 0.18);
    --shadow-focus: 0 0 0 1px var(--color-on-solid), 0 0 0 3px var(--color-primary-strong);

    --font-ui: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    --font-mono: "Cascadia Mono", "Roboto Mono", "SF Mono", Menlo, Consolas, monospace;

    --fs-xs: 11px;
    --fs-sm: 12px;
    --fs-base: 14px;
    --fs-title: 17px;
    --media-title: 18px;
    --media-title-detail: 18px;

    --topbar-height: 48px;
    --rail-width: 48px;
    --spine-width: 98px;
    --toolbar-height: 48px;

    --duration-fast: 140ms;
    --duration-base: 190ms;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    overflow: hidden;
    background: #dce5ee;
    color: #0b1724;
    font-family: var(--font-ui);
    font-size: var(--fs-base);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection {
    background: color-mix(in srgb, var(--color-primary) 26%, transparent);
  }

  button, input, textarea, select {
    font: inherit;
    color: inherit;
  }

  button { border: 0; background: none; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, h4, p { margin: 0; }
  img, svg { display: block; }

  :focus-visible {
    outline: none;
    box-shadow: var(--shadow-focus);
  }

  .ic {
    flex: 0 0 auto;
    display: inline-block;
    vertical-align: -2px;
  }

  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ─────────────────────────────────────────────────────────────
     02 · Preview harness
  ───────────────────────────────────────────────────────────── */
  .preview-bar {
    position: relative;
    z-index: 100;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px;
    background: #0f1b27;
    color: #cddae6;
    font-size: 11px;
    letter-spacing: 0.01em;
    overflow: hidden;
  }

  .pb-brand {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 500;
    color: #f1f6fb;
    white-space: nowrap;
  }

  .pb-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #67a9ff;
  }

  .pb-nav {
    display: flex;
    align-items: center;
    gap: 2px;
    margin-left: 12px;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .pb-nav::-webkit-scrollbar { display: none; }

  .pb-nav a,
  .pb-btn {
    height: 24px;
    display: inline-flex;
    align-items: center;
    padding: 0 8px;
    border-radius: 6px;
    color: #aebdcc;
    white-space: nowrap;
    transition: background var(--transition-fast, 140ms), color 140ms;
  }

  .pb-nav a:hover,
  .pb-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #f1f6fb;
  }

  .pb-nav a.active {
    background: rgba(103, 169, 255, 0.16);
    color: #dcecff;
  }

  .pb-sep {
    width: 1px;
    height: 16px;
    background: rgba(255, 255, 255, 0.12);
    margin: 0 6px;
    flex: 0 0 auto;
  }

  .pb-spacer { flex: 1; }

  .pb-switch {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #aebdcc;
    white-space: nowrap;
  }

  .pb-switch span {
    width: 24px;
    height: 14px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.16);
    position: relative;
    transition: background 160ms;
  }

  .pb-switch span::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #f2f6fa;
    transition: transform 160ms var(--ease-out);
  }

  .pb-switch[aria-pressed="true"] span { background: #2f6fae; }
  .pb-switch[aria-pressed="true"] span::after { transform: translateX(10px); }

  .stage {
    height: calc(100vh - 40px);
    padding: 14px 16px 16px;
    display: flex;
    justify-content: center;
    overflow: auto;
    background:
      radial-gradient(1100px 620px at 50% -12%, rgba(255, 255, 255, 0.72), transparent 64%),
      linear-gradient(165deg, #dbe5ef 0%, #cfdae6 52%, #c7d4e1 100%);
  }

  .stage.night {
    background:
      radial-gradient(1000px 600px at 50% -10%, rgba(94, 130, 168, 0.24), transparent 66%),
      linear-gradient(165deg, #182431 0%, #111a24 56%, #0c141d 100%);
  }

  /* ─────────────────────────────────────────────────────────────
     03 · App window & shell
  ───────────────────────────────────────────────────────────── */
  .window {
    position: relative;
    width: min(1440px, 100%);
    min-width: 1100px;
    height: clamp(700px, calc(100vh - 70px), 900px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 12px;
    color: #0b1724;
    background: var(--color-app-bg);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.42) inset,
      0 24px 70px rgba(20, 40, 60, 0.22);
  }

  .window[data-theme="night"] {
    color-scheme: dark;
    color: #eef4fb;
    --color-primary: #67a9ff;
    --color-primary-strong: #a9ccff;
    --color-primary-soft: color-mix(in srgb, #67a9ff 13%, transparent);
    --color-primary-light: color-mix(in srgb, #67a9ff 24%, transparent);
    --color-on-primary: #0b1724;

    --color-app-bg: #0d1017;
    --color-raised: #111c28;
    --color-fill: #172330;
    --color-well: color-mix(in oklab, #172330 62%, transparent);
    --color-input: #1a2837;
    --color-field: #1a2837;
    --color-button: #1a2837;
    --color-pop: #0e1721;
    --color-on-solid: #0b1724;

    --color-text-primary: #eef4fb;
    --color-text-secondary: #aab9c8;
    --color-text-tertiary: #8496a8;
    --color-border-light: #253647;
    --color-border: #30465b;

    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.06) inset,
      0 28px 80px rgba(0, 0, 0, 0.42);
  }

  .topbar {
    height: var(--topbar-height);
    flex: 0 0 var(--topbar-height);
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 10px;
    background: transparent;
  }

  .topbar > * { -webkit-app-region: no-drag; }

  .rail-toggle {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    color: var(--color-text-secondary);
  }

  .rail-toggle:hover { background: color-mix(in srgb, var(--color-primary) 7%, transparent); }

  .tool-switcher {
    height: 34px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 9px 0 4px;
    border-radius: var(--radius-control);
    color: var(--color-text-primary);
    white-space: nowrap;
    flex: 0 0 auto;
  }

  .tool-switcher:hover { background: color-mix(in srgb, var(--color-primary) 7%, transparent); }

  .tool-mark {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    color: var(--color-primary-strong);
    background: var(--color-primary-soft);
  }

  .tool-switcher b {
    font-size: 14px;
    font-weight: 500;
  }

  .tool-switcher .chev {
    color: var(--color-text-tertiary);
  }

  .topbar-desc {
    min-width: 0;
    max-width: 42%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: var(--fs-sm);
    color: var(--color-text-secondary);
  }

  .topbar-spacer { flex: 1; min-width: 8px; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: var(--fs-xs);
    color: var(--color-text-tertiary);
    white-space: nowrap;
  }

  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--color-success);
  }

  .status .dot.warn { background: var(--color-warning); }
  .status .dot.busy { background: var(--color-primary); animation: pulse 1.1s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.82); }
  }

  .btn {
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 12px;
    border-radius: var(--radius-control);
    border: 1px solid transparent;
    font-size: var(--fs-sm);
    font-weight: 500;
    white-space: nowrap;
    transition: background var(--duration-fast), border-color var(--duration-fast), color var(--duration-fast);
  }

  .btn .ic { width: 15px; height: 15px; }

  .btn.primary {
    background: var(--color-primary-strong);
    color: var(--color-on-primary);
  }

  .btn.primary:hover {
    background: color-mix(in srgb, var(--color-primary-strong) 90%, var(--color-text-primary));
  }

  .btn.secondary {
    background: var(--color-button);
    border-color: var(--color-border);
    color: var(--color-text-primary);
  }

  .btn.secondary:hover {
    background: var(--color-fill);
  }

  .btn.ghost {
    color: var(--color-text-secondary);
  }

  .btn.ghost:hover {
    background: color-mix(in srgb, var(--color-primary) 7%, transparent);
    color: var(--color-text-primary);
  }

  .btn.on-dark {
    background: rgba(255, 255, 255, 0.13);
    border-color: rgba(255, 255, 255, 0.18);
    color: #f4f8fc;
  }

  .btn.on-dark:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    display: inline-grid;
    place-items: center;
    border-radius: 9px;
    color: var(--color-text-secondary);
    transition: background var(--duration-fast), color var(--duration-fast);
  }

  .icon-btn:hover {
    background: color-mix(in srgb, var(--color-primary) 7%, transparent);
    color: var(--color-text-primary);
  }

  .icon-btn.sm { width: 28px; height: 28px; border-radius: 8px; }

  .win-controls {
    width: 138px;
    height: var(--topbar-height);
    display: flex;
    align-items: stretch;
    margin-left: 4px;
    flex: 0 0 auto;
  }

  .win-controls span {
    flex: 1;
    display: grid;
    place-items: center;
    font-size: 11px;
    color: var(--color-text-tertiary);
  }

  .win-controls span:hover { background: color-mix(in srgb, var(--color-primary) 7%, transparent); }
  .win-controls span:last-child:hover { background: var(--color-error); color: #fff; }

  .app-body {
    flex: 1;
    min-height: 0;
    display: flex;
  }

  /* Rail */
  .rail {
    width: var(--rail-width);
    flex: 0 0 var(--rail-width);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 4px 0 6px;
    background: transparent;
  }

  .rail-btn {
    position: relative;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: var(--radius-control);
    color: var(--color-text-secondary);
    transition: background var(--duration-fast), color var(--duration-fast);
  }

  .rail-btn:hover {
    background: color-mix(in srgb, var(--color-primary) 7%, transparent);
    color: var(--color-text-primary);
  }

  .rail-btn.active {
    background: var(--color-primary-soft);
    color: var(--color-primary-strong);
  }

  .rail-btn.active::before {
    content: "";
    position: absolute;
    left: -6px;
    top: 9px;
    width: 3px;
    height: 18px;
    border-radius: 0 3px 3px 0;
    background: var(--color-primary);
  }

  .rail-sep {
    width: 24px;
    height: 1px;
    background: var(--color-border-light);
    margin: 4px 0;
    flex: 0 0 auto;
  }

  .rail-spacer { flex: 1; }

  .rail-dot {
    position: absolute;
    right: 6px;
    bottom: 6px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--color-primary);
  }

  /* Surface */
  .workspace {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
  }

  .surface {
    position: relative;
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    overflow: hidden;
    background: var(--color-raised);
    border: 1px solid var(--color-border-light);
    border-top-color: color-mix(in srgb, #ffffff 55%, var(--color-border-light));
    border-radius: var(--radius-lg) var(--radius-lg) 0 var(--radius-lg);
    box-shadow: inset 0 1px 0 color-mix(in srgb, #ffffff 62%, transparent);
  }

  .window[data-theme="night"] .surface {
    border-top-color: color-mix(in srgb, #ffffff 12%, var(--color-border-light));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .surface.is-scanning::after {
    content: "";
    position: absolute;
    z-index: 40;
    top: 0;
    left: 0;
    width: 34%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--color-primary), transparent);
    animation: scan 1.15s linear infinite;
    pointer-events: none;
  }

  @keyframes scan {
    from { transform: translateX(-100%); }
    to { transform: translateX(320%); }
  }

  .spine {
    width: var(--spine-width);
    flex: 0 0 var(--spine-width);
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 10px 8px 10px;
    border-right: 1px solid var(--color-border-light);
  }

  .spine-label {
    padding: 2px 10px 8px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--color-text-tertiary);
  }

  .spine-item {
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    padding: 0 8px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    font-size: var(--fs-sm);
    color: var(--color-text-secondary);
    transition: background var(--duration-fast), border-color var(--duration-fast), color var(--duration-fast);
  }

  .spine-item:hover {
    background: color-mix(in srgb, var(--color-primary) 7%, transparent);
    color: var(--color-text-primary);
  }

  .spine-item.active {
    background: color-mix(in srgb, var(--color-primary) 9%, transparent);
    border-color: color-mix(in srgb, var(--color-primary) 17%, transparent);
    color: var(--color-text-primary);
    font-weight: 500;
  }

  .spine-item b {
    font-size: 10px;
    font-weight: 400;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  .spine-item b.warn { color: var(--color-warning); }

  .spine-sep {
    height: 1px;
    background: var(--color-border-light);
    margin: 6px 8px;
  }

  .spine-bottom {
    margin-top: auto;
    padding: 8px 9px 2px;
  }

  .spine-note {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    line-height: 1.35;
    color: var(--color-text-tertiary);
  }

  .spine-note .ic { width: 12px; height: 12px; color: var(--color-success); }

  /* Scroll container */
  .pane {
    flex: 1;
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--color-text-tertiary) 42%, transparent) transparent;
  }

  .pane::-webkit-scrollbar { width: 11px; height: 11px; }
  .pane::-webkit-scrollbar-track { background: transparent; }
  .pane::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--color-text-tertiary) 30%, transparent);
    background-clip: padding-box;
    border: 3px solid transparent;
    border-radius: 9px;
  }
  .pane::-webkit-scrollbar-thumb:hover {
    background: color-mix(in srgb, var(--color-text-tertiary) 48%, transparent);
    background-clip: padding-box;
    border: 2px solid transparent;
  }

  /* ─────────────────────────────────────────────────────────────
     04 · Toolbar & filters
  ───────────────────────────────────────────────────────────── */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 22;
    height: var(--toolbar-height);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    background: var(--color-raised);
    border-bottom: 1px solid var(--color-border-light);
  }

  .detail-toolbar .back-btn {
    height: 30px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0 8px 0 5px;
    border-radius: 8px;
    font-size: var(--fs-sm);
    color: var(--color-text-secondary);
    white-space: nowrap;
  }

  .detail-toolbar .back-btn:hover {
    background: color-mix(in srgb, var(--color-primary) 7%, transparent);
    color: var(--color-text-primary);
  }

  .crumb-sep { color: var(--color-text-tertiary); font-size: 11px; }

  .crumb-title {
    font-size: var(--fs-sm);
    font-weight: 500;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .search-field {
    width: 300px;
    min-width: 176px;
    height: 30px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 8px;
    border: 1px solid var(--color-border-light);
    border-radius: 9px;
    background: var(--color-fill);
    color: var(--color-text-tertiary);
    transition: border-color var(--duration-fast), box-shadow var(--duration-fast);
  }

  .search-field:focus-within {
    border-color: color-mix(in srgb, var(--color-primary) 58%, var(--color-border));
    box-shadow: 0 0 0 3px var(--color-primary-soft);
  }

  .search-field input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    outline: none;
    font-size: var(--fs-sm);
    color: var(--color-text-primary);
  }

  .search-field input::placeholder { color: var(--color-text-tertiary); }

  .search-field kbd {
    height: 16px;
    min-width: 16px;
    display: inline-grid;
    place-items: center;
    padding: 0 3px;
    border: 1px solid var(--color-border);
    border-radius: 4px;
    background: var(--color-field);
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--color-text-tertiary);
  }

  .seg {
    height: 30px;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 2px;
    border-radius: 9px;
    background: var(--color-fill);
    flex: 0 0 auto;
  }

  .seg-btn {
    height: 26px;
    padding: 0 9px;
    border-radius: 7px;
    font-size: 11px;
    color: var(--color-text-secondary);
    white-space: nowrap;
    transition: background var(--duration-fast), color var(--duration-fast);
  }

  .seg-btn:hover { color: var(--color-text-primary); }

  .seg-btn.active {
    background: var(--color-field);
    color: var(--color-text-primary);
    font-weight: 500;
    box-shadow: 0 1px 2px rgba(20, 40, 60, 0.08);
  }

  .window[data-theme="night"] .seg-btn.active { box-shadow: none; }

  .menu { position: relative; flex: 0 0 auto; }

  .menu > summary {
    list-style: none;
    height: 30px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0 8px;
    border-radius: 8px;
    font-size: 11px;
    color: var(--color-text-secondary);
    white-space: nowrap;
    cursor: pointer;
    transition: background var(--duration-fast), color var(--duration-fast);
  }

  .menu > summary::-webkit-details-marker { display: none; }
  .menu > summary:hover { background: color-mix(in srgb, var(--color-primary) 7%, transparent); color: var(--color-text-primary); }
  .menu[open] > summary { background: color-mix(in srgb, var(--color-primary) 9%, transparent); color: var(--color-text-primary); }

  .menu > summary .active-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--color-primary);
  }

  .menu-panel {
    position: absolute;
    top: calc(100% + 7px);
    left: 0;
    z-index: 60;
    min-width: 236px;
    max-height: 320px;
    overflow-y: auto;
    padding: 5px;
    border: 1px solid var(--color-border-light);
    border-radius: 10px;
    background: var(--color-pop);
    box-shadow: var(--shadow-md);
  }

  .menu-panel.right { left: auto; right: 0; }

  .menu-item {
    width: 100%;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 8px;
    border-radius: 7px;
    font-size: 11px;
    color: var(--color-text-secondary);
    text-align: left;
  }

  .menu-item:hover { background: color-mix(in srgb, var(--color-primary) 7%, transparent); color: var(--color-text-primary); }
  .menu-item.active { color: var(--color-text-primary); font-weight: 500; }
  .menu-item small { color: var(--color-text-tertiary); font-variant-numeric: tabular-nums; }

  .menu-head {
    padding: 5px 8px 6px;
    font-size: 10px;
    color: var(--color-text-tertiary);
  }

  .tb-spacer { flex: 1; min-width: 6px; }

  .result-count {
    font-size: 11px;
    color: var(--color-text-tertiary);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .view-toggle {
    height: 30px;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 2px;
    border-radius: 8px;
    background: var(--color-fill);
    flex: 0 0 auto;
  }

  .view-toggle button {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border-radius: 6px;
    color: var(--color-text-tertiary);
  }

  .view-toggle button:hover { color: var(--color-text-primary); }
  .view-toggle button.active { background: var(--color-field); color: var(--color-text-primary); }
  .window[data-theme="night"] .view-toggle button.active { background: var(--color-button); }

  .filter-chips {
    position: sticky;
    top: var(--toolbar-height);
    z-index: 21;
    min-height: 38px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 16px 8px;
    background: linear-gradient(var(--color-raised) 70%, color-mix(in srgb, var(--color-raised) 86%, transparent));
    border-bottom: 1px solid var(--color-border-light);
  }

  .filter-chips[hidden] { display: none; }

  .filter-chip {
    height: 24px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0 5px 0 8px;
    border: 1px solid color-mix(in srgb, var(--color-primary) 20%, var(--color-border-light));
    border-radius: 7px;
    background: var(--color-primary-soft);
    font-size: 10px;
    color: var(--color-text-primary);
  }

  .filter-chip button {
    width: 16px;
    height: 16px;
    display: grid;
    place-items: center;
    border-radius: 4px;
    color: var(--color-text-secondary);
  }

  .filter-chip button:hover { background: color-mix(in srgb, var(--color-primary) 16%, transparent); }

  .clear-filters {
    height: 24px;
    padding: 0 7px;
    border-radius: 6px;
    font-size: 10px;
    color: var(--color-text-secondary);
  }

  .clear-filters:hover { background: color-mix(in srgb, var(--color-primary) 7%, transparent); color: var(--color-text-primary); }

  /* ─────────────────────────────────────────────────────────────
     05 · Library
  ───────────────────────────────────────────────────────────── */
  .feature-band {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr);
    gap: 16px;
    padding: 16px 16px 0;
  }

  .billboard {
    position: relative;
    min-height: 236px;
    overflow: hidden;
    border: 1px solid var(--color-border-light);
    border-radius: 14px;
    background: #0d1721;
    color: #f3f7fb;
    display: flex;
    align-items: flex-end;
  }

  .billboard .cover-art { position: absolute; inset: 0; }

  .billboard-shade {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(90deg, rgba(6, 12, 19, 0.95) 0%, rgba(6, 12, 19, 0.83) 40%, rgba(6, 12, 19, 0.18) 78%, rgba(6, 12, 19, 0.44) 100%),
      linear-gradient(0deg, rgba(6, 12, 19, 0.74) 0%, transparent 58%);
  }

  .billboard-body {
    position: relative;
    z-index: 2;
    width: 64%;
    min-width: 0;
    padding: 24px 22px 22px;
  }

  .billboard h2 {
    font-size: var(--media-title);
    font-weight: 500;
    line-height: 1.16;
    letter-spacing: -0.025em;
    text-wrap: balance;
  }

  .billboard .meta {
    margin-top: 7px;
    font-size: 11px;
    color: rgba(243, 247, 251, 0.74);
    font-variant-numeric: tabular-nums;
  }

  .billboard .desc {
    margin-top: 8px;
    max-width: 48ch;
    font-size: var(--fs-sm);
    line-height: 1.55;
    color: rgba(243, 247, 251, 0.68);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .billboard .tag-row { margin-top: 10px; }

  .hero-tag {
    height: 19px;
    display: inline-flex;
    align-items: center;
    padding: 0 6px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 5px;
    background: rgba(6, 12, 19, 0.36);
    color: rgba(243, 247, 251, 0.82);
    font-size: 10px;
    white-space: nowrap;
  }

  .billboard-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
  }

  .billboard-actions .btn { height: 32px; }

  .billboard-flags {
    position: absolute;
    z-index: 3;
    top: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .billboard-progress {
    width: 190px;
    height: 3px;
    margin-top: 13px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.2);
    overflow: hidden;
  }

  .billboard-progress i {
    display: block;
    height: 100%;
    border-radius: 2px;
    background: var(--color-primary);
  }

  .billboard-progress-label {
    margin-top: 5px;
    font-size: 10px;
    color: rgba(243, 247, 251, 0.54);
    font-variant-numeric: tabular-nums;
  }

  .continue-panel {
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 10px;
    border: 1px solid var(--color-border-light);
    border-radius: 14px;
    background: var(--color-well);
  }

  .cp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 6px 7px;
  }

  .cp-head h3 {
    font-size: var(--fs-sm);
    font-weight: 500;
  }

  .cp-head span {
    font-size: 10px;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  .continue-row {
    display: grid;
    grid-template-columns: 84px minmax(0, 1fr) 18px;
    gap: 10px;
    align-items: center;
    padding: 7px 6px;
    border-radius: 10px;
    transition: background var(--duration-fast);
  }

  .continue-row:hover { background: color-mix(in srgb, var(--color-primary) 7%, transparent); }

  .continue-thumb {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border: 1px solid var(--color-border-light);
    border-radius: 7px;
    background: var(--color-fill);
  }

  .continue-thumb .still,
  .continue-thumb .poster { position: absolute; inset: 0; }

  .continue-body { min-width: 0; }

  .continue-title {
    display: block;
    font-size: var(--fs-sm);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .continue-sub {
    display: block;
    margin-top: 1px;
    font-size: 10px;
    color: var(--color-text-tertiary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .continue-bar {
    height: 2px;
    margin-top: 6px;
    border-radius: 2px;
    background: var(--color-border-light);
    overflow: hidden;
  }

  .continue-bar i {
    display: block;
    height: 100%;
    background: var(--color-primary);
  }

  .continue-time {
    display: block;
    margin-top: 3px;
    font-size: 10px;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  .continue-row > .ic { color: var(--color-text-tertiary); }

  .continue-empty {
    flex: 1;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 16px;
    font-size: 11px;
    color: var(--color-text-tertiary);
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 0 16px;
    margin: 24px 0 12px;
  }

  .section-head h3 {
    font-size: var(--fs-base);
    font-weight: 500;
  }

  .section-head h3 span {
    margin-left: 6px;
    font-size: 11px;
    font-weight: 400;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  .section-head .section-meta {
    font-size: 10px;
    color: var(--color-text-tertiary);
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
    gap: 22px 16px;
    padding: 0 16px 28px;
  }

  /* ─────────────────────────────────────────────────────────────
     06 · Media cards
  ───────────────────────────────────────────────────────────── */
  .media-card {
    min-width: 0;
    border-radius: var(--radius-md);
    cursor: pointer;
    outline: none;
  }

  .card-cover {
    position: relative;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    border: 1px solid var(--color-border-light);
    border-radius: var(--radius-md);
    background: var(--color-fill);
    transition: border-color var(--duration-base);
  }

  .media-card:hover .card-cover,
  .media-card:focus-visible .card-cover {
    border-color: color-mix(in srgb, var(--color-primary) 34%, var(--color-border-light));
  }

  .cover-art {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: var(--color-fill);
    transition: transform 520ms var(--ease-out);
  }

  .media-card:hover .cover-art,
  .media-card:focus-visible .cover-art,
  .continue-row:hover .cover-art { transform: scale(1.025); }

  .kind-chip,
  .count-chip,
  .review-chip {
    position: absolute;
    z-index: 5;
    top: 8px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0 6px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 6px;
    background: rgba(6, 12, 19, 0.64);
    color: rgba(251, 253, 255, 0.92);
    font-size: 10px;
    backdrop-filter: blur(6px);
    white-space: nowrap;
  }

  .kind-chip { left: 8px; }
  .count-chip { right: 8px; font-variant-numeric: tabular-nums; }
  .review-chip { left: 8px; top: 32px; color: #ffe1b6; border-color: rgba(255, 200, 120, 0.22); }

  .kind-chip .ic,
  .review-chip .ic { width: 11px; height: 11px; }

  .card-quick {
    position: absolute;
    z-index: 6;
    right: 9px;
    bottom: 9px;
    display: flex;
    gap: 6px;
    opacity: 0;
    transform: translateY(3px);
    transition: opacity var(--duration-fast), transform var(--duration-fast);
  }

  .media-card:hover .card-quick,
  .media-card:focus-within .card-quick { opacity: 1; transform: translateY(0); }

  .quick-btn {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 50%;
    background: rgba(6, 12, 19, 0.72);
    color: #f4f8fc;
    backdrop-filter: blur(6px);
  }

  .quick-btn:hover { background: var(--color-primary-strong); color: var(--color-on-primary); }

  .card-progress {
    position: absolute;
    z-index: 5;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    background: rgba(0, 0, 0, 0.38);
  }

  .card-progress i {
    display: block;
    height: 100%;
    background: var(--color-primary);
  }

  .card-caption { padding: 9px 2px 0; }

  .card-caption h4 {
    font-size: var(--fs-base);
    font-weight: 500;
    line-height: 1.32;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-caption p {
    margin-top: 3px;
    font-size: 11px;
    color: var(--color-text-tertiary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .card-caption .tag-row { margin-top: 6px; }

  .tag-row {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    flex-wrap: wrap;
  }

  .tag {
    height: 18px;
    display: inline-flex;
    align-items: center;
    max-width: 84px;
    padding: 0 6px;
    overflow: hidden;
    border: 1px solid var(--color-border-light);
    border-radius: 5px;
    background: var(--color-fill);
    color: var(--color-text-secondary);
    font-size: 10px;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .tag.more { color: var(--color-text-tertiary); background: transparent; }

  .tag.tag-empty {
    border-style: dashed;
    background: transparent;
    color: var(--color-text-tertiary);
  }

  .tag.warn {
    border-color: color-mix(in srgb, var(--color-warning) 24%, var(--color-border-light));
    background: color-mix(in srgb, var(--color-warning) 7%, transparent);
    color: var(--color-warning);
  }

  /* List view */
  .media-list {
    margin: 0 16px 28px;
    border-top: 1px solid var(--color-border-light);
  }

  .list-head,
  .list-row {
    display: grid;
    grid-template-columns: minmax(280px, 2.1fr) 72px 84px 84px 100px 18px;
    gap: 12px;
    align-items: center;
  }

  .list-head {
    height: 30px;
    font-size: 10px;
    color: var(--color-text-tertiary);
    border-bottom: 1px solid var(--color-border-light);
    padding: 0 6px;
  }

  .list-row {
    min-height: 72px;
    padding: 8px 6px;
    border-bottom: 1px solid var(--color-border-light);
    border-radius: 8px;
    cursor: pointer;
  }

  .list-row:hover { background: color-mix(in srgb, var(--color-primary) 5%, transparent); }

  .list-main {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .list-thumb {
    position: relative;
    width: 96px;
    height: 60px;
    flex: 0 0 96px;
    overflow: hidden;
    border: 1px solid var(--color-border-light);
    border-radius: 7px;
  }

  .list-thumb .cover-art { inset: 0; }

  .list-main h4 {
    font-size: var(--fs-base);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .list-main p {
    margin-top: 3px;
    font-size: 10px;
    color: var(--color-text-tertiary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .list-cell {
    font-size: 11px;
    color: var(--color-text-secondary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .list-row > .ic { color: var(--color-text-tertiary); }

  /* ─────────────────────────────────────────────────────────────
     07 · Poster & still art (generated placeholders)
  ───────────────────────────────────────────────────────────── */
  .poster {
    position: absolute;
    inset: 0;
    overflow: hidden;
    container-type: size;
    background: var(--c1);
    color: var(--fg);
    isolation: isolate;
  }

  .poster .f1,
  .poster .f2,
  .poster .f3 {
    position: absolute;
    z-index: 1;
    display: block;
  }

  .poster-title {
    position: absolute;
    z-index: 3;
    left: 9%;
    bottom: 11%;
    max-width: 78%;
    font-size: clamp(15px, 8.8cqw, 34px);
    font-weight: 500;
    line-height: 1.06;
    letter-spacing: -0.025em;
    text-wrap: balance;
  }

  .poster-foot {
    position: absolute;
    z-index: 3;
    left: 9%;
    top: 8%;
    max-width: 82%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: clamp(7px, 2.1cqw, 10px);
    font-weight: 500;
    letter-spacing: 0.1em;
    opacity: 0.7;
    text-transform: uppercase;
  }

  .poster[data-m="horizon"] .f1 {
    width: 50cqw;
    aspect-ratio: 1;
    right: 7%;
    top: 15%;
    border-radius: 50%;
    background: var(--c2);
  }
  .poster[data-m="horizon"] .f2 {
    left: 0;
    right: 0;
    bottom: 0;
    height: 35%;
    background: var(--c3);
  }
  .poster[data-m="horizon"] .f3 {
    left: 0;
    right: 0;
    bottom: 35%;
    height: 1px;
    background: var(--fg);
    opacity: 0.32;
  }
  .poster[data-m="horizon"] .poster-title { bottom: 39%; }

  .poster[data-m="type"] .f1 {
    left: 7%;
    top: 8%;
    bottom: 8%;
    width: 1px;
    background: var(--fg);
    opacity: 0.28;
  }
  .poster[data-m="type"] .f2 {
    right: 9%;
    top: 9%;
    width: 30%;
    height: 1px;
    background: var(--c3);
  }
  .poster[data-m="type"] .f3 {
    left: 7%;
    right: 7%;
    bottom: 7%;
    height: 7%;
    border-top: 1px solid var(--c2);
    opacity: 0.55;
  }
  .poster[data-m="type"] .poster-title {
    left: auto;
    right: 10%;
    top: 12%;
    bottom: auto;
    max-height: 74%;
    font-size: clamp(21px, 10.6cqw, 40px);
    letter-spacing: 0.06em;
    writing-mode: vertical-rl;
  }
  .poster[data-m="type"] .poster-foot { left: 12%; top: auto; bottom: 12%; }

  .poster[data-m="bands"] .f1 {
    top: 0;
    bottom: 0;
    right: 0;
    width: 34%;
    background: var(--c2);
  }
  .poster[data-m="bands"] .f2 {
    top: 0;
    bottom: 0;
    right: 34%;
    width: 7%;
    background: var(--c3);
  }
  .poster[data-m="bands"] .f3 {
    top: 0;
    bottom: 0;
    right: 41%;
    width: 1px;
    background: var(--fg);
    opacity: 0.3;
  }
  .poster[data-m="bands"] .poster-title { max-width: 52%; }

  .poster[data-m="arc"] .f1,
  .poster[data-m="arc"] .f2,
  .poster[data-m="arc"] .f3 {
    border-radius: 50%;
    border: 1px solid var(--c2);
    opacity: 0.55;
  }
  .poster[data-m="arc"] .f1 {
    width: 72cqw;
    aspect-ratio: 1;
    right: -20%;
    top: -8%;
  }
  .poster[data-m="arc"] .f2 {
    width: 54cqw;
    aspect-ratio: 1;
    right: -11%;
    top: 2%;
    border-color: var(--c3);
  }
  .poster[data-m="arc"] .f3 {
    width: 22cqw;
    aspect-ratio: 1;
    right: 8%;
    top: 24%;
    background: var(--c3);
    border: 0;
    opacity: 1;
  }
  .poster[data-m="arc"] .poster-title { max-width: 56%; }

  .poster[data-m="wave"] .f1,
  .poster[data-m="wave"] .f2,
  .poster[data-m="wave"] .f3 {
    left: -18%;
    right: -18%;
    border-radius: 50% 50% 0 0;
  }
  .poster[data-m="wave"] .f1 {
    bottom: -30%;
    height: 74%;
    background: var(--c3);
  }
  .poster[data-m="wave"] .f2 {
    bottom: -36%;
    height: 72%;
    background: var(--c2);
    opacity: 0.72;
  }
  .poster[data-m="wave"] .f3 {
    bottom: -44%;
    height: 70%;
    background: var(--c1);
    border-top: 1px solid color-mix(in srgb, var(--fg) 22%, transparent);
  }
  .poster[data-m="wave"] .poster-title { top: 24%; bottom: auto; }
  .poster[data-m="wave"] .poster-foot { top: auto; bottom: 8%; }

  .poster[data-m="contact"] .f1 {
    inset: 0;
    background:
      linear-gradient(var(--c2), var(--c2)) 0 0 / 50% 50% no-repeat,
      linear-gradient(var(--c3), var(--c3)) 100% 0 / 50% 50% no-repeat,
      linear-gradient(var(--c1), var(--c1)) 0 100% / 50% 50% no-repeat,
      linear-gradient(var(--c2), var(--c2)) 100% 100% / 50% 50% no-repeat;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 16%, transparent);
  }
  .poster[data-m="contact"] .f2 {
    left: 0;
    right: 0;
    bottom: 0;
    height: 34%;
    background: linear-gradient(0deg, var(--c1) 34%, transparent);
  }
  .poster[data-m="contact"] .f3 { display: none; }
  .poster[data-m="contact"] .poster-title { bottom: 10%; }
  .poster[data-m="contact"] .poster-foot { top: 8%; right: 8%; left: auto; }

  .poster[data-m="grid"] .f1 {
    inset: 12% 10%;
    background:
      linear-gradient(90deg, transparent 32.8%, color-mix(in srgb, var(--fg) 28%, transparent) 33% 33.4%, transparent 33.6% 65.8%, color-mix(in srgb, var(--fg) 28%, transparent) 66% 66.4%, transparent 66.6%),
      linear-gradient(0deg, transparent 32.8%, color-mix(in srgb, var(--fg) 28%, transparent) 33% 33.4%, transparent 33.6% 65.8%, color-mix(in srgb, var(--fg) 28%, transparent) 66% 66.4%, transparent 66.6%);
  }
  .poster[data-m="grid"] .f2 {
    right: 10%;
    top: 12%;
    width: 22.2%;
    height: 21.4%;
    background: var(--c3);
  }
  .poster[data-m="grid"] .f3 {
    left: 10%;
    top: 12%;
    width: 1px;
    height: 76%;
    background: var(--c2);
    opacity: 0.5;
  }
  .poster[data-m="grid"] .poster-title { bottom: 9%; }

  .poster[data-m="aperture"] .f1 {
    width: 56cqw;
    aspect-ratio: 1;
    right: 7%;
    top: 17%;
    background: var(--c3);
    transform: rotate(45deg);
  }
  .poster[data-m="aperture"] .f2 {
    width: 34cqw;
    aspect-ratio: 1;
    right: 18%;
    top: 28%;
    border: 1px solid var(--c1);
    transform: rotate(45deg);
  }
  .poster[data-m="aperture"] .f3 {
    left: 0;
    right: 0;
    top: 22%;
    height: 1px;
    background: var(--c2);
    opacity: 0.5;
  }
  .poster[data-m="aperture"] .poster-title { max-width: 54%; }

  .mosaic {
    display: grid;
    gap: 2px;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.16);
  }

  .mosaic.m4 {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }

  .mosaic .still {
    position: relative;
    inset: auto;
    min-width: 0;
    min-height: 0;
    width: 100%;
    height: 100%;
  }

  .split {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 2px;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.16);
  }

  .split-main { position: relative; min-width: 0; overflow: hidden; }
  .split-quad {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
    min-width: 0;
    min-height: 0;
  }

  .cover-caption-strip {
    position: absolute;
    z-index: 3;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 22px 10px 9px;
    background: linear-gradient(0deg, rgba(6, 12, 19, 0.82), transparent);
    color: #f5f8fb;
  }

  .cover-caption-strip span {
    font-size: 12px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cover-caption-strip small {
    flex: 0 0 auto;
    font-size: 9px;
    color: rgba(245, 248, 251, 0.7);
    font-variant-numeric: tabular-nums;
  }

  .still {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: var(--c1);
  }

  .still i,
  .still b {
    position: absolute;
    z-index: 1;
    display: block;
  }

  .still[data-m="horizon"] {
    background: linear-gradient(180deg, color-mix(in srgb, var(--c1) 78%, #ffffff) 0%, var(--c1) 62%);
  }
  .still[data-m="horizon"] i {
    width: 46%;
    aspect-ratio: 1;
    left: var(--x);
    top: var(--y);
    border-radius: 50%;
    background: var(--c3);
  }
  .still[data-m="horizon"] b {
    left: -8%;
    right: -8%;
    bottom: -12%;
    height: 52%;
    background: var(--c2);
    clip-path: polygon(0 58%, 15% 44%, 29% 53%, 43% 30%, 58% 47%, 72% 26%, 86% 41%, 100% 34%, 100% 100%, 0 100%);
  }

  .still[data-m="wave"] {
    background: linear-gradient(180deg, var(--c1) 0%, color-mix(in srgb, var(--c1) 70%, #ffffff) 100%);
  }
  .still[data-m="wave"] i,
  .still[data-m="wave"] b {
    left: -20%;
    right: -20%;
    border-radius: 50% 50% 0 0;
  }
  .still[data-m="wave"] i {
    bottom: -32%;
    height: 78%;
    background: var(--c2);
    transform: translateX(var(--x));
  }
  .still[data-m="wave"] b {
    bottom: -42%;
    height: 72%;
    background: var(--c3);
    opacity: 0.84;
    transform: translateX(calc(var(--x) * -0.6));
  }

  .still[data-m="arc"] {
    background:
      radial-gradient(circle at 72% 38%, transparent 0 27%, var(--c2) 27.4% 28%, transparent 28.4% 40%, var(--c3) 40.4% 41%, transparent 41.4% 53%, color-mix(in srgb, var(--c2) 55%, transparent) 53.4% 54%, transparent 54.4%),
      var(--c1);
  }
  .still[data-m="arc"] i {
    width: 18%;
    aspect-ratio: 1;
    right: 16%;
    top: 30%;
    border-radius: 50%;
    background: var(--c3);
  }
  .still[data-m="arc"] b {
    left: 0;
    right: 0;
    top: 62%;
    height: 1px;
    background: var(--c2);
    opacity: 0.4;
  }

  .still[data-m="bands"] {
    background:
      linear-gradient(90deg, transparent 0 52%, var(--c2) 52% 68%, var(--c3) 68% 78%, transparent 78%),
      var(--c1);
  }
  .still[data-m="bands"] i {
    left: 0;
    right: 0;
    top: 68%;
    height: 1px;
    background: var(--c2);
    opacity: 0.45;
  }
  .still[data-m="bands"] b {
    width: 8%;
    top: 0;
    bottom: 0;
    right: 18%;
    background: var(--c1);
    opacity: 0.4;
  }

  .still[data-m="grid"] {
    background:
      linear-gradient(90deg, transparent 32.6%, color-mix(in srgb, var(--c2) 48%, transparent) 33% 33.5%, transparent 33.9% 65.6%, color-mix(in srgb, var(--c2) 48%, transparent) 66% 66.5%, transparent 66.9%),
      linear-gradient(0deg, transparent 32.6%, color-mix(in srgb, var(--c2) 48%, transparent) 33% 33.5%, transparent 33.9% 65.6%, color-mix(in srgb, var(--c2) 48%, transparent) 66% 66.5%, transparent 66.9%),
      var(--c1);
  }
  .still[data-m="grid"] i {
    left: 33.5%;
    top: 33.5%;
    width: 32%;
    height: 32%;
    background: var(--c3);
    opacity: 0.9;
  }
  .still[data-m="grid"] b {
    left: 10%;
    top: 10%;
    width: 1px;
    height: 80%;
    background: var(--c3);
    opacity: 0.55;
  }

  .still[data-m="aperture"] {
    background: var(--c1);
  }
  .still[data-m="aperture"] i {
    width: 48%;
    aspect-ratio: 1;
    right: 10%;
    top: 22%;
    background: var(--c3);
    transform: rotate(45deg);
  }
  .still[data-m="aperture"] b {
    width: 28%;
    aspect-ratio: 1;
    right: 20%;
    top: 32%;
    border: 1px solid var(--c2);
    transform: rotate(45deg);
  }

  .still[data-m="bloom"] {
    background:
      radial-gradient(circle at 30% 34%, var(--c2) 0 18%, transparent 19%),
      radial-gradient(circle at 68% 58%, var(--c3) 0 22%, transparent 23%),
      radial-gradient(circle at 48% 78%, color-mix(in srgb, var(--c2) 70%, transparent) 0 14%, transparent 15%),
      var(--c1);
  }
  .still[data-m="bloom"] i {
    width: 18%;
    aspect-ratio: 1;
    left: 52%;
    top: 22%;
    border-radius: 50%;
    border: 1px solid var(--c3);
  }
  .still[data-m="bloom"] b {
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
    background: var(--c2);
    opacity: 0.25;
  }

  /* ─────────────────────────────────────────────────────────────
     08 · Detail
  ───────────────────────────────────────────────────────────── */
  .detail-hero {
    position: relative;
    min-height: 282px;
    margin: 16px;
    overflow: hidden;
    border: 1px solid var(--color-border-light);
    border-radius: 14px;
    background: #0d1721;
    color: #f3f7fb;
    display: flex;
    align-items: flex-end;
  }

  .detail-hero .cover-art { position: absolute; inset: 0; }

  .detail-shade {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(90deg, rgba(6, 12, 19, 0.95) 0%, rgba(6, 12, 19, 0.82) 42%, rgba(6, 12, 19, 0.16) 78%, rgba(6, 12, 19, 0.38) 100%),
      linear-gradient(0deg, rgba(6, 12, 19, 0.76), transparent 56%);
  }

  .detail-body {
    position: relative;
    z-index: 2;
    max-width: 700px;
    min-width: 0;
    padding: 26px 24px 22px;
  }

  .detail-body h1 {
    font-size: var(--media-title-detail);
    font-weight: 500;
    line-height: 1.18;
    letter-spacing: -0.025em;
    text-wrap: balance;
  }

  .detail-body .meta {
    margin-top: 7px;
    font-size: 11px;
    color: rgba(243, 247, 251, 0.74);
    font-variant-numeric: tabular-nums;
  }

  .detail-body .desc {
    margin-top: 9px;
    max-width: 54ch;
    font-size: var(--fs-sm);
    line-height: 1.58;
    color: rgba(243, 247, 251, 0.68);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .detail-body .tag-row { margin-top: 10px; }

  .detail-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }

  .detail-flags {
    position: absolute;
    z-index: 3;
    top: 13px;
    right: 13px;
    display: flex;
    gap: 6px;
  }

  .detail-tabs {
    position: sticky;
    top: var(--toolbar-height);
    z-index: 20;
    height: 44px;
    display: flex;
    align-items: stretch;
    gap: 22px;
    padding: 0 16px;
    background: var(--color-raised);
    border-bottom: 1px solid var(--color-border-light);
  }

  .detail-tab {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: var(--fs-sm);
    color: var(--color-text-secondary);
    white-space: nowrap;
  }

  .detail-tab b {
    font-size: 10px;
    font-weight: 400;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  .detail-tab:hover { color: var(--color-text-primary); }

  .detail-tab.active {
    color: var(--color-text-primary);
    font-weight: 500;
  }

  .detail-tab.active::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 2px;
    background: var(--color-primary);
    border-radius: 2px 2px 0 0;
  }

  .detail-tab.active b { color: var(--color-text-secondary); }

  .detail-content { padding: 18px 16px 28px; }

  .video-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.62fr) minmax(300px, 1fr);
    gap: 20px;
    align-items: start;
  }

  .player {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border: 1px solid var(--color-border-light);
    border-radius: var(--radius-md);
    background: #070d13;
    color: #f4f8fc;
  }

  .player .cover-art { position: absolute; inset: 0; }

  .player-shade {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(0deg, rgba(4, 9, 14, 0.86) 0%, transparent 34%),
      linear-gradient(180deg, rgba(4, 9, 14, 0.52) 0%, transparent 24%);
    transition: opacity var(--duration-base);
  }

  .player.is-playing .player-shade { opacity: 0.62; }

  .player-big {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 62px;
    height: 62px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(251, 253, 255, 0.94);
    color: #0b1724;
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.3);
    transition: opacity var(--duration-base), transform var(--duration-fast);
  }

  .player-big:hover { transform: translate(-50%, -50%) scale(1.04); }

  .player.is-playing .player-big { opacity: 0.24; }
  .player.is-playing .player-big:hover { opacity: 0.92; }

  .player-top {
    position: absolute;
    top: 12px;
    left: 14px;
    right: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 10px;
    color: rgba(244, 248, 252, 0.74);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  }

  .player-top b {
    font-weight: 500;
    color: rgba(244, 248, 252, 0.94);
  }

  .player-controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 12px;
  }

  .player-controls .icon-btn {
    width: 28px;
    height: 28px;
    color: rgba(244, 248, 252, 0.84);
  }

  .player-controls .icon-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
  }

  .player-time {
    font-size: 10px;
    color: rgba(244, 248, 252, 0.78);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .player-scrub {
    flex: 1;
    height: 18px;
    display: flex;
    align-items: center;
    cursor: pointer;
  }

  .ps-track {
    width: 100%;
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.24);
    overflow: hidden;
  }

  .player-scrub:hover .ps-track { height: 4px; }

  .ps-track i {
    display: block;
    height: 100%;
    background: var(--color-primary);
  }

  .player-caption {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 2px 0;
  }

  .player-caption h3 {
    font-size: var(--fs-base);
    font-weight: 500;
  }

  .player-caption p {
    margin-top: 3px;
    font-size: 11px;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  .episode-panel {
    min-width: 0;
    display: flex;
    flex-direction: column;
    max-height: 476px;
    overflow: hidden;
    border: 1px solid var(--color-border-light);
    border-radius: var(--radius-md);
    background: var(--color-well);
  }

  .episode-panel.single-panel { max-height: none; min-height: 0; }

  .single-info { padding: 6px 12px 0; }

  .single-info .kv { grid-template-columns: 76px minmax(0, 1fr); padding: 8px 0; }

  .single-actions {
    display: flex;
    gap: 6px;
    margin-top: auto;
    padding: 10px 12px 12px;
  }

  .single-actions .btn { height: 28px; padding: 0 8px; font-size: 10px; }

  .episode-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--color-border-light);
  }

  .episode-head h3 { font-size: var(--fs-sm); font-weight: 500; }
  .episode-head span { font-size: 10px; color: var(--color-text-tertiary); }

  .episode-list {
    min-height: 0;
    overflow-y: auto;
    padding: 5px;
  }

  .episode-row {
    display: grid;
    grid-template-columns: 22px 76px minmax(0, 1fr);
    gap: 8px;
    align-items: center;
    padding: 6px;
    border-radius: 8px;
    transition: background var(--duration-fast);
  }

  .episode-row:hover { background: color-mix(in srgb, var(--color-primary) 7%, transparent); }

  .episode-row.active {
    background: color-mix(in srgb, var(--color-primary) 9%, transparent);
  }

  .episode-index {
    font-size: 10px;
    color: var(--color-text-tertiary);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .episode-row.active .episode-index { color: var(--color-text-secondary); }

  .episode-thumb {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border: 1px solid var(--color-border-light);
    border-radius: 5px;
  }

  .episode-thumb .still,
  .episode-thumb .poster { position: absolute; inset: 0; }

  .episode-copy { min-width: 0; }

  .episode-title {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .episode-meta {
    margin-top: 2px;
    font-size: 10px;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  .watched { color: var(--color-success); }

  .single-file {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--color-border-light);
  }

  .single-file div { min-width: 120px; }
  .single-file small { display: block; font-size: 10px; color: var(--color-text-tertiary); }
  .single-file b { display: block; margin-top: 2px; font-size: 11px; font-weight: 400; color: var(--color-text-secondary); font-variant-numeric: tabular-nums; }

  .gallery-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 2px 14px;
  }

  .gallery-head h3 { font-size: var(--fs-base); font-weight: 500; }
  .gallery-head h3 span { margin-left: 6px; font-size: 11px; font-weight: 400; color: var(--color-text-tertiary); }

  .gallery-head .gh-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 10px;
    color: var(--color-text-tertiary);
  }

  .masonry {
    columns: 5;
    column-gap: 12px;
  }

  .thumb {
    position: relative;
    display: block;
    width: 100%;
    padding: 0;
    break-inside: avoid;
    margin: 0 0 12px;
    overflow: hidden;
    border: 1px solid var(--color-border-light);
    border-radius: 9px;
    background: var(--color-fill);
    cursor: zoom-in;
    content-visibility: auto;
    contain-intrinsic-size: auto 220px;
  }

  .thumb .still { transition: transform 480ms var(--ease-out); }
  .thumb:hover .still { transform: scale(1.035); }

  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    pointer-events: none;
  }

  .thumb-label {
    position: absolute;
    z-index: 3;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 20px 8px 6px;
    background: linear-gradient(0deg, rgba(6, 12, 19, 0.8), transparent);
    color: rgba(245, 248, 251, 0.9);
    font-size: 9px;
    opacity: 0;
    transition: opacity var(--duration-fast);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .thumb:hover .thumb-label { opacity: 1; }

  .info-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr);
    gap: 28px;
  }

  .info-block h3 {
    margin-bottom: 9px;
    font-size: var(--fs-sm);
    font-weight: 500;
  }

  .info-desc {
    max-width: 62em;
    font-size: var(--fs-sm);
    line-height: 1.72;
    color: var(--color-text-secondary);
  }

  .info-block + .info-block { margin-top: 24px; }

  .kv {
    display: grid;
    grid-template-columns: 104px minmax(0, 1fr);
    gap: 12px;
    align-items: start;
    padding: 9px 0;
    border-bottom: 1px solid var(--color-border-light);
    font-size: 11px;
  }

  .kv:last-child { border-bottom: 0; }
  .kv dt { color: var(--color-text-tertiary); }
  .kv dd { margin: 0; min-width: 0; color: var(--color-text-secondary); overflow-wrap: anywhere; }
  .kv dd.mono { font-family: var(--font-mono); font-size: 10px; }

  .trust-note {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin-top: 20px;
    padding: 11px 12px;
    border: 1px solid color-mix(in srgb, var(--color-success) 20%, var(--color-border-light));
    border-radius: 10px;
    background: color-mix(in srgb, var(--color-success) 6%, transparent);
    font-size: 11px;
    line-height: 1.55;
    color: var(--color-text-secondary);
  }

  .trust-note .ic { margin-top: 1px; color: var(--color-success); }

  .scan-log { margin-top: 4px; }

  .scan-log-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--color-border-light);
    font-size: 10px;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  .scan-log-row:last-child { border-bottom: 0; }
  .scan-log-row .ic { color: var(--color-success); }

  /* ─────────────────────────────────────────────────────────────
