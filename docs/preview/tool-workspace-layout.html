<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工具工作区 · 布局优化预览</title>
<style>
  :root {
    /* 颜色：直接取自 renderer/shared/styles/tokens.scss */
    --color-primary: #3390ec;
    --color-primary-strong: #006dc3;
    --color-primary-soft: color-mix(in srgb, var(--color-primary) 10%, transparent);

    --color-app-bg: #edf3f8;
    --color-rail: #f7fbff;
    --color-raised: #fbfdff;
    --color-header: #f9fcff;
    --color-input: #ffffff;
    --color-pop: #fbfdff;

    --color-text-primary: #0b1724;
    --color-text-secondary: #526273;
    --color-text-tertiary: #5f6f80;
    --color-border: #cbd8e3;
    --color-border-light: #dfe8ef;
    --color-on-solid: #ffffff;

    --color-success: #007b54;
    --color-warning: #975f00;
    --color-error: #cf1c28;

    /* 形状 */
    --radius-xs: 7px;
    --radius-sm: 10px;
    --radius-control: 11px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 22px;

    /* 深度 */
    --shadow-sm: 0 10px 34px rgba(27, 57, 87, 0.10);
    --shadow-md: 0 18px 48px rgba(29, 62, 94, 0.10);
    --shadow-focus: 0 0 0 1px var(--color-on-solid), 0 0 0 3px var(--color-primary-strong);

    /* 尺寸 */
    --topbar-height: 48px;
    --rail-width: 56px;
    --toolbar-height: 48px;
    --statusline-height: 31px;
    --header-height: 70px;
    --subnav-height: 34px;
    --spine-width: 98px;

    /* 字 */
    --font-ui: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --fs-xs: 11px;
    --fs-sm: 12px;
    --fs-base: 14px;
    --fs-title: 17px;

    --duration-fast: 140ms;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    color: var(--color-text-primary);
    font-family: var(--font-ui);
    font-size: var(--fs-base);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 桌面与窗口（macOS，titleBarStyle: hiddenInset） ── */

  .desktop {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(1200px 700px at 50% -10%, #eef3f9 0%, rgba(238, 243, 249, 0) 62%),
      linear-gradient(168deg, #d9e2ec 0%, #c9d5e2 52%, #c2cfdd 100%);
  }

  .desktop[data-bg="aurora"] {
    background:
      radial-gradient(760px 520px at 18% 22%, #9db9ff 0%, rgba(157, 185, 255, 0) 66%),
      radial-gradient(680px 520px at 82% 12%, #a8e6d3 0%, rgba(168, 230, 211, 0) 62%),
      radial-gradient(720px 560px at 62% 88%, #ffd9a3 0%, rgba(255, 217, 163, 0) 64%),
      linear-gradient(160deg, #e7eef8 0%, #dfe8f4 100%);
  }

  .desktop[data-bg="slate"] {
    background:
      radial-gradient(880px 600px at 24% 10%, #7b8ea6 0%, rgba(123, 142, 166, 0) 70%),
      radial-gradient(720px 500px at 82% 88%, #4f6470 0%, rgba(79, 100, 112, 0) 68%),
      linear-gradient(166deg, #66788e 0%, #4d5c70 56%, #43505f 100%);
  }

  .desktop[data-bg="grid"] {
    background-color: #e9eff7;
    background-image:
      linear-gradient(rgba(148, 168, 190, 0.42) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 168, 190, 0.42) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  .desktop[data-bg="checker"] {
    background-color: #e6ebf2;
    background-image:
      linear-gradient(45deg, #ccd6e2 25%, transparent 25%, transparent 75%, #ccd6e2 75%),
      linear-gradient(45deg, #ccd6e2 25%, transparent 25%, transparent 75%, #ccd6e2 75%);
    background-size: 24px 24px;
    background-position: 0 0, 12px 12px;
  }

  .stage-area {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  .window {
    position: absolute;
    left: 50%;
    top: 50%;
    margin-left: -720px;
    margin-top: -450px;
    width: 1440px;
    height: 900px;
    border-radius: 11px;
    overflow: hidden;

    /* 平台：macOS hiddenInset / Windows titleBarOverlay */
    --tb-pl: 84px;
    --tb-pr: 14px;
    --win-radius: 11px;

    /* 外观：实底 / 半透明 / 玻璃 */
    --bg-canvas: var(--color-app-bg);
    --bg-header: var(--color-header);
    --bg-raised: var(--color-raised);
    --bg-sub: #f3f8fc;
    --blur: 0px;
    --sat: 100%;

    background: var(--bg-canvas);
    backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    box-shadow:
      0 34px 96px -24px rgba(10, 24, 40, 0.52),
      0 2px 8px rgba(10, 24, 40, 0.14),
      0 0 0 1px rgba(9, 20, 33, 0.14);
    transform: scale(var(--fit, 1));
    transform-origin: center center;
    border-radius: var(--win-radius);
  }

  .window[data-platform="mac"] { --tb-pl: 84px; --tb-pr: 14px; --win-radius: 11px; }
  .window[data-platform="win"] { --tb-pl: 16px; --tb-pr: 148px; --win-radius: 8px; }

  .window[data-surface="tint"] {
    --bg-canvas: rgba(237, 243, 248, 0.80);
    --bg-header: rgba(249, 252, 255, 0.92);
    --bg-raised: rgba(251, 253, 255, 0.95);
    --bg-sub: rgba(243, 248, 252, 0.92);
    --blur: 0px;
    --sat: 100%;
    --color-success: #00603f;
    --color-text-secondary: #4a5968;
    --color-text-tertiary: #56646f;
    --color-primary-strong: #005ba6;
  }

  .window[data-surface="glass"] {
    --bg-canvas: rgba(237, 243, 248, 0.78);
    --bg-header: rgba(249, 252, 255, 0.90);
    --bg-raised: rgba(251, 253, 255, 0.93);
    --bg-sub: rgba(243, 248, 252, 0.86);
    --blur: 30px;
    --sat: 160%;
    --color-success: #00553a;
    --color-text-secondary: #3a4650;
    --color-text-tertiary: #404c57;
    --color-primary-strong: #005ba6;
  }

  /* Windows 原生窗口按钮区 */
  .win-ctl {
    position: absolute;
    top: 0;
    right: 0;
    height: var(--topbar-height);
    display: none;
    z-index: 45;
  }
  .window[data-platform="win"] .win-ctl { display: flex; }
  .window[data-platform="win"] .lights { display: none; }

  .win-ctl button {
    display: grid;
    place-items: center;
    width: 46px;
    height: 100%;
    border: 0;
    background: transparent;
    color: #44515f;
    transition: background 120ms var(--ease-out), color 120ms var(--ease-out);
  }
  .win-ctl button:hover { background: rgba(9, 20, 33, 0.07); }
  .win-ctl button.is-close:hover { background: #e81123; color: #ffffff; }
  .win-ctl svg { width: 10px; height: 10px; }

  /* trafficLightPosition { x: 20, y: 18 }，灯组 12px + 8px 间距 → 右缘 72px */
  .lights {
    position: absolute;
    left: 20px;
    top: 18px;
    display: flex;
    gap: 8px;
    z-index: 50;
  }
  .lights i {
    display: block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.16);
  }
  .lights .l-close { background: #ff5f57; }
  .lights .l-min { background: #febc2e; }
  .lights .l-zoom { background: #28c840; }

  .window-caption {
    position: absolute;
    left: 50%;
    bottom: 6px;
    transform: translateX(-50%);
    max-width: calc(100% - 40px);
    padding: 3px 11px;
    border-radius: 999px;
    background: rgba(22, 30, 41, 0.82);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #cfd9e4;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
    z-index: 5;
  }

  ::selection {
    background: color-mix(in srgb, var(--color-primary) 24%, transparent);
  }

  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }

  :focus-visible {
    outline: none;
    box-shadow: var(--shadow-focus);
  }

  /* ── 外壳 ─────────────────────────────────────────── */

  .shell {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }

  /* ── 标题栏 48px：原版外观，接管原来 70px header 的职责 ── */

  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 var(--topbar-height);
    height: var(--topbar-height);
    padding: 0 var(--tb-pr) 0 var(--tb-pl);
    background: var(--bg-header);
    border-bottom: 1px solid var(--color-border-light);
    user-select: none;
    position: relative;
    z-index: 40;
  }

  .tool-chip {
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: 268px;
    height: 34px;
    padding: 0 9px 0 5px;
    border: 1px solid transparent;
    border-radius: var(--radius-md);
    background: transparent;
    transition: background var(--duration-fast) var(--ease-out),
                border-color var(--duration-fast) var(--ease-out);
  }
  .tool-chip:hover {
    background: var(--color-input);
    border-color: var(--color-border-light);
  }
  .tool-chip[aria-expanded="true"] {
    background: var(--color-input);
    border-color: var(--color-border);
  }

  .tile {
    display: grid;
    place-items: center;
    width: 26px;
    height: 26px;
    border-radius: var(--radius-xs);
    background: var(--color-primary-soft);
    color: var(--color-primary-strong);
    flex: none;
  }
  .tile svg { width: 15px; height: 15px; }

  .chip-name {
    font-size: var(--fs-base);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chev { width: 12px; height: 12px; color: var(--color-text-tertiary); flex: none; }

  .topbar-state {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    font-size: var(--fs-xs);
    color: var(--color-text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar-state .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--color-success);
    flex: none;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-success) 14%, transparent);
  }
  .topbar-state.is-idle .dot { background: #9fb0c0; box-shadow: none; }

  .topbar-desc {
    min-width: 0;
    max-width: 46%;
    font-size: var(--fs-sm);
    color: var(--color-text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
  }
  .topbar-actions .btn { height: 30px; }

  .tb-home { display: none; align-items: center; gap: 10px; min-width: 0; }
  .topbar.is-home .tb-home { display: flex; }
  .topbar.is-home .tool-chip,
  .topbar.is-home .topbar-desc,
  .topbar.is-home .topbar-state,
  .topbar.is-home .topbar-actions { display: none; }

  .tb-old { display: none; align-items: center; gap: 10px; min-width: 0; }
  .topbar.is-old .tb-old { display: flex; }
  .topbar.is-old .tool-chip,
  .topbar.is-old .topbar-desc,
  .topbar.is-old .topbar-state,
  .topbar.is-old .topbar-actions { display: none; }
  .lg-name { font-size: var(--fs-base); font-weight: 500; white-space: nowrap; }
  .lg-desc {
    font-size: var(--fs-xs);
    color: var(--color-text-tertiary);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .grow { flex: 1 1 auto; min-width: 8px; }

  /* ── 评审条：窗口之外的控件，不属于 app ───────────── */

  .review {
    display: flex;
    align-items: center;
    gap: 18px;
    flex: 0 0 48px;
    height: 48px;
    padding: 0 16px;
    background: rgba(22, 30, 41, 0.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    color: #d5dee8;
    font-size: 12px;
    user-select: none;
    position: relative;
    z-index: 80;
  }

  .review-group { display: flex; align-items: center; gap: 8px; }
  .review-label {
    font-size: 11px;
    color: #8b9aab;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .review-spacer { flex: 1 1 auto; }

  .review .seg {
    display: flex;
    padding: 2px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.04);
  }
  .review .seg button {
    height: 24px;
    padding: 0 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #a7b4c3;
    font-size: 11.5px;
    transition: color 120ms var(--ease-out), background 120ms var(--ease-out);
  }
  .review .seg button:hover { color: #ffffff; }
  .review .seg button.is-on {
    background: #2c3848;
    color: #ffffff;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14), 0 1px 2px rgba(0, 0, 0, 0.32);
  }

  .sw { display: flex; gap: 6px; }
  .sw button {
    width: 24px;
    height: 24px;
    padding: 0;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    cursor: pointer;
    transition: box-shadow 120ms var(--ease-out), border-color 120ms var(--ease-out);
  }
  .sw button:hover { border-color: rgba(255, 255, 255, 0.44); }
  .sw button[data-bg="mist"] { background: linear-gradient(168deg, #d9e2ec, #c2cfdd); }
  .sw button[data-bg="aurora"] {
    background:
      radial-gradient(10px 10px at 30% 28%, #9db9ff 0%, rgba(157, 185, 255, 0) 70%),
      radial-gradient(10px 10px at 72% 34%, #a8e6d3 0%, rgba(168, 230, 211, 0) 70%),
      radial-gradient(12px 12px at 52% 80%, #ffd9a3 0%, rgba(255, 217, 163, 0) 72%),
      #e4ecf7;
  }
  .sw button[data-bg="slate"] { background: linear-gradient(166deg, #66788e, #43505f); }
  .sw button[data-bg="grid"] {
    background-color: #e9eff7;
    background-image:
      linear-gradient(rgba(148, 168, 190, 0.7) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 168, 190, 0.7) 1px, transparent 1px);
    background-size: 6px 6px;
  }
  .sw button[data-bg="checker"] {
    background-color: #e6ebf2;
    background-image:
      linear-gradient(45deg, #ccd6e2 25%, transparent 25%, transparent 75%, #ccd6e2 75%),
      linear-gradient(45deg, #ccd6e2 25%, transparent 25%, transparent 75%, #ccd6e2 75%);
    background-size: 8px 8px;
    background-position: 0 0, 4px 4px;
  }
  .sw button.is-on {
    border-color: #8cbcff;
    box-shadow: 0 0 0 2px rgba(140, 188, 255, 0.34);
  }

  .review-meter {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: #93a2b3;
    white-space: nowrap;
    cursor: default;
  }
  .review-meter b {
    color: #eaf1f8;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .review-meter .vs {
    width: 1px;
    height: 11px;
    background: rgba(255, 255, 255, 0.18);
    margin: 0 3px;
  }

  .seg {
    display: flex;
    flex: none;
    padding: 2px;
    border-radius: var(--radius-sm);
    background: var(--color-app-bg);
    border: 1px solid var(--color-border-light);
  }
  .seg button {
    height: 24px;
    padding: 0 11px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--color-text-tertiary);
    font-size: var(--fs-xs);
    transition: background var(--duration-fast) var(--ease-out),
                color var(--duration-fast) var(--ease-out);
  }
  .seg button:hover { color: var(--color-text-primary); }
  .seg button.is-on {
    background: var(--color-input);
    color: var(--color-text-primary);
    font-weight: 500;
    box-shadow: 0 1px 3px rgba(27, 57, 87, 0.12);
  }

  /* ── 主体 ─────────────────────────────────────────── */

  .body {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* ── 左轨 68px：原版语义保留 ──────────────────────── */

  .rail {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex: 0 0 var(--rail-width);
    width: var(--rail-width);
    padding: 10px 0 12px;
    min-height: 0;
    overflow: hidden;
  }

  .rail-btn {
    position: relative;
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border: 1px solid transparent;
    border-radius: var(--radius-control);
    background: transparent;
    color: var(--color-text-secondary);
    transition: background var(--duration-fast) var(--ease-out),
                color var(--duration-fast) var(--ease-out),
                border-color var(--duration-fast) var(--ease-out);
  }
  .rail-btn svg { width: 18px; height: 18px; }
  .rail-btn:hover {
    background: var(--color-input);
    border-color: var(--color-border-light);
    color: var(--color-text-primary);
  }
  .rail-btn.is-on {
    background: var(--color-primary-soft);
    color: var(--color-primary-strong);
  }
  .rail-btn.is-on::before {
    content: "";
    position: absolute;
    left: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 18px;
    border-radius: 0 2px 2px 0;
    background: var(--color-primary);
  }

  .rail-divider {
    width: 24px;
    height: 1px;
    background: var(--color-border-light);
    margin: 4px 0;
  }

  .rail-grow { flex: 1 1 auto; }

  /* ── 舞台 ─────────────────────────────────────────── */

  .stage {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* ── 改版：一个表面 + 竖脊 ────────────────────────── */

  .surface {
    display: flex;
    flex: 1;
    min-height: 0;
    min-width: 0;
    margin: 0 12px 12px;
    border: 1px solid color-mix(in srgb, var(--color-on-solid) 58%, var(--color-border-light));
    border-radius: var(--radius-lg);
    background: var(--bg-raised);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  .spine {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 0 0 var(--spine-width);
    width: var(--spine-width);
    padding: 10px 8px;
    border-right: 1px solid var(--color-border-light);
    background: var(--bg-sub);
    min-height: 0;
    overflow: hidden;
  }

  .spine-label {
    padding: 2px 9px 6px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--color-text-tertiary);
  }

  .spine-tab {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    height: 32px;
    padding: 0 9px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--color-text-secondary);
    font-size: var(--fs-sm);
    text-align: left;
    transition: background var(--duration-fast) var(--ease-out),
                color var(--duration-fast) var(--ease-out),
                border-color var(--duration-fast) var(--ease-out);
  }
  .spine-tab .cap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spine-tab .badge {
    flex: none;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }
  .spine-tab:hover {
    background: var(--color-input);
    border-color: var(--color-border-light);
    color: var(--color-text-primary);
  }
  .spine-tab.is-on {
    background: color-mix(in srgb, var(--color-primary) 9%, transparent);
    border-color: color-mix(in srgb, var(--color-primary) 17%, transparent);
    color: var(--color-text-primary);
    font-weight: 500;
  }
  .spine-tab.is-on .badge { color: var(--color-primary-strong); }

  .spine-grow { flex: 1 1 auto; }

  .pane {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    min-height: 0;
  }

  .pane-bar {
    display: flex;
    align-items: center;
    gap: 7px;
    flex: 0 0 var(--toolbar-height);
    height: var(--toolbar-height);
    padding: 0 12px;
    border-bottom: 1px solid var(--color-border-light);
    min-width: 0;
  }

  .pane-body {
    display: flex;
    flex: 1;
    min-height: 0;
    min-width: 0;
    overflow: hidden;

  .tool-cell { position: relative; display: flex; min-width: 0; }

  .cell-open {
    display: flex;

  .pop {

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }

</style>

  function bodyTabTraffic() {
    var rows = FLOWS.map(function (r) {
      return "<tr>" +
        '<td class="mono" style="color:var(--color-text-tertiary)">' + r[0] + "</td>" +
        "<td>" + methodCell(r[1]) + "</td>" +
        '<td class="url"><b>' + esc(r[2]) + "</b></td>" +
        "<td>" + tagFor(r[3]) + "</td>" +
        '<td class="mono">' + r[4] + "</td>" +
        '<td style="color:var(--color-text-secondary)">' + esc(r[5]) + "</td>" +
      "</tr>";
    }).join("");

    return '<div class="pane">' +
      '<div class="scroll"><table class="grid"><thead><tr>' +
        '<th style="width:78px">时间</th><th style="width:64px">方法</th><th>URL</th>' +
        '<th style="width:66px">状态</th><th style="width:78px">耗时</th><th style="width:118px">标记</th>' +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
      '<div class="pane-foot">只记录命中处理名单的请求；内存保留最近 1000 条，body 超 64KB 截断。</div>' +
    "</div>";
  }

  var INTERCEPTOR_BODIES = [bodyTabStatus, bodyTabTargets, bodyTabRules, bodyTabTraffic];

  function barTabStatus() {
    return '<span class="bar-meta"><i class="st-dot"></i>代理未运行</span>' +
      '<span class="bar-meta" style="margin-left:10px">0 origins · 0 rules</span>' +
      '<div class="grow"></div>' +
      '<button type="button" class="btn is-quiet" style="height:28px">' + I.refresh + "刷新</button>";
  }
  function barTabTargets() {
    return '<span class="bar-meta">启用 4 / 5</span>' +
      '<div class="grow"></div>' +
      '<button type="button" class="btn is-primary" style="height:28px">加入名单</button>';
  }
  function barTabRules() {
    return '<button type="button" class="chip is-on">全部 12</button>' +
      '<button type="button" class="chip">已固定 3</button>' +
      '<button type="button" class="chip">已启用 9</button>' +
      '<div class="grow"></div>' +
      '<button type="button" class="btn is-primary" style="height:28px">新建规则</button>';
  }
  function barTabTraffic() {
    return '<div class="field" style="width:246px">' + I.search +
      '<input name="filter" aria-label="筛选 URL 或标记" placeholder="筛选 URL 或标记" /></div>' +
      '<div class="grow"></div>' +
      '<span class="bar-meta">128 / 1000 条</span>' +
      '<button type="button" class="btn is-quiet" style="height:28px">' + I.trash + "清空</button>";
  }
  var INTERCEPTOR_BARS = [barTabStatus, barTabTargets, barTabRules, barTabTraffic];

  function renderHomeLegacy() {
    var cells = TOOLS.map(function (t) {
      return '<div class="tool-cell">' +
        '<button type="button" class="cell-open" data-tool="' + t.id + '">' +
          '<span class="cell-tile">' + t.icon + "</span>" +
          '<span class="cell-copy">' +
            '<span class="cell-name">' + esc(t.name) + "</span>" +
            '<span class="cell-desc">' + esc(t.desc) + "</span>" +
          "</span>" +
        "</button>" +
        '<button type="button" class="cell-pin" aria-label="置顶 ' + esc(t.name) + '">' + I.star + "</button>" +
      "</div>";
    }).join("");

    return '<div class="home-page" data-body>' +
      '<div class="home-inner">' +
        '<div class="home-head"><div>' +
          "<h1>工具台</h1>" +
          "<p>" + TOOLS.length + " 个本地工具；打开时运行，关闭即释放。</p>" +
        "</div></div>" +
        '<button type="button" class="search-dock" id="dock">' + I.search +
          '<span class="search-ph">搜索工具、能力或关键词</span>' +
          '<span class="search-hint"><span>快速打开</span><kbd>⌘ K</kbd></span>' +
        "</button>" +
        '<section class="launcher">' +
          '<header class="launcher-head"><span class="ttl">所有工具</span>' +
            '<span class="hint">拖动调整顺序</span></header>' +
          '<div class="launcher-grid">' + cells + "</div>" +
        "</section>" +
      "</div>" +
    "</div>";
  }

  var RUNNING = [
    ["interceptor", "运行 3 分钟"],
    ["tweb-cache", "刚刚活跃"]
  ];

  var RECENT = [
    ["skill-manager", "12 分钟前"],
    ["id-card-generator", "昨天"],
    ["offline-pack", "昨天"]
  ];

  function byId(id) {
    for (var i = 0; i < TOOLS.length; i++) if (TOOLS[i].id === id) return TOOLS[i];
    return null;
  }

  function renderHomeNew() {
    var rows = TOOLS.map(function (t, i) {
      var live = RUNNING.some(function (r) { return r[0] === t.id; });
      return '<div class="idx-row">' +
        '<button type="button" class="idx-open" data-tool="' + t.id + '">' +
          '<span class="idx-num">' + (i + 1) + "</span>" +
          '<span class="idx-tile">' + t.icon + "</span>" +
          '<span class="idx-main">' +
            '<span class="idx-name">' + esc(t.name) + "</span>" +
            '<span class="idx-desc">' + esc(t.desc) + "</span>" +
          "</span>" +
          '<span class="idx-state' + (live ? " is-live" : "") + '"><i class="dot"></i>' +
            (live ? "运行中" : "未运行") + "</span>" +
        "</button>" +
        '<button type="button" class="idx-pin" aria-label="置顶 ' + esc(t.name) + '" title="置顶 ' + esc(t.name) + '">' +
          I.star + "</button>" +
      "</div>";
    }).join("");

    var running = RUNNING.map(function (r) {
      var t = byId(r[0]);
      if (!t) return "";
      return '<div class="run-item">' +
        '<span class="run-tile">' + t.icon + "</span>" +
        '<span class="run-name">' + esc(t.name) + "</span>" +
        '<span class="run-when">' + esc(r[1]) + "</span>" +
      "</div>";
    }).join("") || '<p class="side-note">没有正在运行的工具</p>';

    var recent = RECENT.map(function (r) {
      var t = byId(r[0]);
      if (!t) return "";
      return '<div class="run-item">' +
        '<span class="run-tile">' + t.icon + "</span>" +
        '<span class="run-name">' + esc(t.name) + "</span>" +
        '<span class="run-when">' + esc(r[1]) + "</span>" +
      "</div>";
    }).join("");

    return '<div class="home2" data-body>' +
      '<div class="home2-inner">' +
        '<div class="home2-main">' +
          '<div class="masthead">' +
            "<h1>工具台</h1>" +
            "<p>" + TOOLS.length + " 个本地工具；打开时运行，关闭即释放。</p>" +
            '<div class="grow"></div>' +
            '<button type="button" class="search-btn" id="dock">' + I.search +
              "<span>搜索</span><kbd>⌘ K</kbd></button>" +
          "</div>" +
          '<div class="idx">' + rows + "</div>" +
        "</div>" +
        '<div class="home2-side">' +
          '<div class="side-sec"><div class="side-lbl">正在运行</div>' +
            '<div class="side-card">' + running + "</div></div>" +
          '<div class="side-sec"><div class="side-lbl">最近打开</div>' +
            '<div class="side-card">' + recent + "</div></div>" +
          '<div class="side-sec"><div class="side-lbl">键盘</div>' +
            '<div class="side-card">' +
              '<div class="key-row"><span>直接启动</span><kbd>1 – 8</kbd></div>' +
              '<div class="key-row"><span>搜索工具</span><kbd>⌘ K</kbd></div>' +
            "</div></div>" +
          '<p class="side-note">运行与最近记录为示例数据，用于版式预览。</p>' +
        "</div>" +
      "</div>" +
    "</div>";
  }

  function barFor(t) {
    return t.bar ? '<div class="pane-bar">' + barInner(t) + "</div>" : "";
  }

  function legacyHeader(t) {
    return '<header class="lg-header">' +
      '<span class="lg-tile">' + t.icon + "</span>" +
      '<div class="lg-copy"><h1>' + esc(t.name) + "</h1><p>" + esc(t.desc) + "</p></div>" +
      '<div class="lg-actions">' +
        (t.secondary ? '<button type="button" class="btn">' + esc(t.secondary[0]) + "</button>" : "") +
        (t.primary ? '<button type="button" class="btn is-primary">' + (t.primary[1] || "") + esc(t.primary[0]) + "</button>" : "") +
      "</div>" +
    "</header>";
  }

  function legacySubnav(t) {
    if (!t.sub.length) return "";
    return '<nav class="lg-subnav">' + t.sub.map(function (s, i) {
      return '<button type="button" data-subtab="' + i + '"' + (i === state.sub ? ' class="is-on"' : "") + ">" + esc(s[0]) + "</button>";
    }).join("") + "</nav>";
  }

  function legacyBar(t) {
    return t.old.bar ? '<div class="lg-bar">' + barInner(t) + "</div>" : "";
  }

  function bodyFor(t) {
    if (t.id === "interceptor") return INTERCEPTOR_BODIES[state.sub]();
    if (t.body === "flow") return bodyFlow();
    if (t.body === "pack") return bodyPack();
    if (t.body === "viewer") return state.mode === "old" ? bodyViewerLegacy() : bodyViewer();
    if (t.body === "skills") return bodySkills();
    if (t.body === "wxp") return bodyWxp();
    if (t.body === "wb") return bodyWb();
    if (t.body === "treease") return bodyTreease();
    return bodyStudio();
  }

  function renderNew(t) {
    var spine = t.sub.length && !t.noSpine
      ? '<nav class="spine" role="tablist" aria-label="子视图">' +
          '<div class="spine-label">子视图</div>' +
          t.sub.map(function (s, i) {
            return '<button type="button" role="tab" class="spine-tab' + (i === state.sub ? " is-on" : "") + '"' +
              ' data-subtab="' + i + '" aria-selected="' + (i === state.sub) + '">' +
              '<span class="cap">' + esc(s[0]) + "</span>" +
              (s[1] ? '<span class="badge">' + esc(s[1]) + "</span>" : "") +
              "</button>";
          }).join("") +
          '<div class="spine-grow"></div>' +
        "</nav>"
      : "";

    return '<section class="surface">' + spine +
      '<div class="pane">' + barFor(t) +
        '<div class="pane-body" data-body>' + bodyFor(t) + "</div>" +
      "</div>" +
    "</section>";
  }

  function renderOld(t) {
    var o = t.old;
    return '<div class="legacy">' +
      (o.header ? legacyHeader(t) : "") +
      (o.subnav ? legacySubnav(t) : "") +
      '<div class="lg-surface">' +
        (o.bar ? legacyBar(t) : "") +
        '<div class="lg-surface-body" data-body>' + bodyFor(t) + "</div>" +
        (o.status ? '<div class="lg-statusline"><span>' + esc(t.state) + "</span></div>" : "") +
      "</div>" +
    "</div>";
  }

  var stage = document.getElementById("stage");
  var pop = document.getElementById("pop");
  var chip = document.getElementById("chip");

  function renderRail() {
    document.getElementById("railTools").innerHTML = TOOLS.map(function (t) {
      return '<button type="button" class="rail-btn' + (t.id === state.tool ? " is-on" : "") + '"' +
        ' aria-label="切换到' + esc(t.name) + '" title="' + esc(t.name) + '"' +
        ' data-tool="' + t.id + '">' + t.icon + "</button>";
    }).join("");
  }

  function renderPop() {
    pop.innerHTML = TOOLS.map(function (t) {
      return '<button type="button" role="option" aria-selected="' + (t.id === state.tool) + '"' +
        ' class="pop-item' + (t.id === state.tool ? " is-cur" : "") + '" data-tool="' + t.id + '">' +
        '<span class="pop-tile">' + t.icon + "</span>" +
        '<span class="txt"><span>' + esc(t.name) + "</span><small>" + esc(t.desc) + "</small></span>" +
        (t.id === state.tool ? '<span class="kbd">当前</span>' : "") +
      "</button>";
    }).join("");
  }

  function render() {
    var t = tool();
    var tb = document.querySelector(".topbar");
    var home = !t;

    tb.classList.toggle("is-home", home);
    tb.classList.toggle("is-old", !home && state.mode === "old");
    document.getElementById("railHome").classList.toggle("is-on", home);

    if (home) {
      stage.innerHTML = state.mode === "old" ? renderHomeLegacy() : renderHomeNew();
      renderRail();
      renderPop();
      requestAnimationFrame(measure);
      return;
    }

    document.getElementById("chipTile").innerHTML = t.icon;
    document.getElementById("chipName").textContent = t.name;

    var st = document.getElementById("topbarState");
    st.classList.toggle("is-idle", !t.live);
    document.getElementById("topbarStateText").textContent = t.state;
    document.getElementById("topbarDesc").textContent = t.desc;
    document.getElementById("tbActions").innerHTML =
      (t.secondary ? '<button type="button" class="btn">' + esc(t.secondary[0]) + "</button>" : "") +
      (t.primary ? '<button type="button" class="btn is-primary">' + (t.primary[1] || "") + esc(t.primary[0]) + "</button>" : "") +
      '<button type="button" class="icon-btn" aria-label="更多" title="更多">' + I.dots + "</button>";

    document.getElementById("tbOldTile").innerHTML = t.icon;
    document.getElementById("tbOldName").textContent = t.name;
    document.getElementById("tbOldDesc").textContent = t.desc;
    document.querySelector(".topbar").classList.toggle("is-old", state.mode === "old");

    stage.innerHTML = state.mode === "new" ? renderNew(t) : renderOld(t);

    renderRail();
    renderPop();
    requestAnimationFrame(measure);
  }

  function measure() {
    var body = stage.querySelector("[data-body]");
    if (!body) return;

    var sel = !tool()
      ? [".topbar"]
      : (state.mode === "new"
        ? [".topbar", ".pane-bar"]
        : [".topbar", ".lg-header", ".lg-subnav", ".lg-bar", ".lg-statusline"]);

    var chrome = sel.reduce(function (sum, s) {
      var el = document.querySelector(s);
      return sum + (el ? el.offsetHeight : 0);
    }, 0);

    document.getElementById("mBand").textContent = Math.round(chrome);
    document.getElementById("mBody").textContent = Math.round(body.offsetHeight);
  }

  document.addEventListener("click", function (e) {
    var tgt = e.target.closest("[data-tool]");
    if (tgt) {
      state.tool = tgt.getAttribute("data-tool");
      state.sub = 0;
      closePop();
      render();
      return;
    }

    if (e.target.closest("[data-home]")) {
      state.tool = null;
      closePop();
      render();
      return;
    }

    if (e.target.closest("#dock")) {
      togglePop();
      return;
    }

    var plat = e.target.closest(".review .seg [data-platform]");
    if (plat) {
      state.platform = plat.getAttribute("data-platform");
      document.getElementById("win").setAttribute("data-platform", state.platform);
      pickOnly(plat);
      syncCaption();
      return;
    }

    var surf = e.target.closest(".review .seg [data-surface]");
    if (surf) {
      state.surface = surf.getAttribute("data-surface");
      document.getElementById("win").setAttribute("data-surface", state.surface);
      pickOnly(surf);
      syncCaption();
      return;
    }

    var bg = e.target.closest(".review .sw [data-bg]");
    if (bg) {
      state.bg = bg.getAttribute("data-bg");
      document.getElementById("desktop").setAttribute("data-bg", state.bg);
      pickOnly(bg);
      return;
    }

    var mode = e.target.closest(".review .seg [data-mode]");
    if (mode) {
      state.mode = mode.getAttribute("data-mode");
      pickOnly(mode);
      document.querySelector(".topbar").classList.toggle("is-old", !(!tool()) && state.mode === "old");
      render();
      return;
    }

    var tab = e.target.closest("[data-subtab]");
    if (tab) {
      state.sub = Number(tab.getAttribute("data-subtab"));
      render();
      return;
    }

    if (!e.target.closest("#chip") && !e.target.closest("#pop")) closePop();
  });

  function pickOnly(el) {
    var group = el.parentNode;
    Array.prototype.forEach.call(group.children, function (b) {
      b.classList.toggle("is-on", b === el);
    });
  }

  function syncCaption() {
    var c = document.getElementById("caption");
    var mac = state.platform === "mac";
    var surf = { solid: "实底", tint: "半透明", glass: "玻璃" }[state.surface];
    var pre = state.tool ? "" : "首页 · ";
    c.textContent = pre + (mac
      ? "1440 × 900 · macOS · hiddenInset · trafficLightPosition (20, 18) · 顶栏左内边距 84px · " + surf
      : "1440 × 900 · Windows · titleBarOverlay · 右侧原生按钮预留 148px · " + surf);
  }

  function openPop() {
    pop.classList.remove("hidden");
    chip.setAttribute("aria-expanded", "true");
    var cur = pop.querySelector(".pop-item.is-cur");
    if (cur) cur.focus();
  }
  function closePop() {
    pop.classList.add("hidden");
    chip.setAttribute("aria-expanded", "false");
  }
  function togglePop() {
    if (pop.classList.contains("hidden")) openPop(); else closePop();
  }

  chip.addEventListener("click", function (e) {
    e.stopPropagation();
    togglePop();
  });

  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      togglePop();
      return;
    }
    if (e.key === "Escape") {
      if (!pop.classList.contains("hidden")) { closePop(); chip.focus(); }
      return;
    }

    if (!pop.classList.contains("hidden")) return;

    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (/^[1-8]$/.test(e.key) && TOOLS[+e.key - 1]) {
      e.preventDefault();
      state.tool = TOOLS[+e.key - 1].id;
      state.sub = 0;
      render();
      return;
    }
    if (pop.classList.contains("hidden")) return;

    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      var items = Array.prototype.slice.call(pop.querySelectorAll(".pop-item"));
      var i = items.indexOf(document.activeElement);
      var next = e.key === "ArrowDown" ? i + 1 : i - 1;
      if (next < 0) next = items.length - 1;
      if (next >= items.length) next = 0;
      items[next].focus();
      return;
    }
    if (e.key === "Enter" && document.activeElement.classList.contains("pop-item")) {
      e.preventDefault();
      document.activeElement.click();
    }
  });

  function libResize(split, lib, w) {
    var clamped = Math.max(360, Math.min(760, Math.round(w)));
    lib.style.flexBasis = clamped + "px";
    lib.style.width = clamped + "px";
  }

  document.addEventListener("mousedown", function (e) {
    var grip = e.target.closest("#tgGrip");
    if (!grip) return;
    e.preventDefault();
    var split = grip.parentNode;
    var lib = split.querySelector(".tg-lib");
    if (!lib) return;
    var win = document.getElementById("win");
    var scale = win.getBoundingClientRect().width / 1440 || 1;
    var startX = e.clientX;
    var startW = lib.offsetWidth;
    grip.classList.add("is-dragging");

    function move(ev) {
      libResize(split, lib, startW + (startX - ev.clientX) / scale);
    }
    function up() {
      grip.classList.remove("is-dragging");
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      measure();
    }
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  });

  document.addEventListener("keydown", function (e) {
    if (!e.target || e.target.id !== "tgGrip") return;
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    var split = e.target.parentNode;
    var lib = split.querySelector(".tg-lib");
    if (!lib) return;
    var delta = e.key === "ArrowLeft" ? 24 : -24;
    libResize(split, lib, lib.offsetWidth + delta);
    measure();
  });

  function fitWindow() {
    var w = document.getElementById("win");
    var area = document.querySelector(".stage-area");
    if (!w || !area) return;
    var s = Math.min(1, (area.clientWidth - 48) / 1440, (area.clientHeight - 40) / 900);
    w.style.setProperty("--fit", s);
  }

  window.addEventListener("resize", function () { fitWindow(); measure(); });
  fitWindow();
  syncCaption();

  render();
})();
</script>
</body>
</html>
