services:
  pikpak-get-engine:
    build: .
    image: pikpak-get-engine:latest
    restart: unless-stopped
    ports:
      - "8787:8787"                 # 绑 NAS 局域网；token 鉴权；外网走 Tailscale，不做公网端口转发
    env_file: .env
    environment:
      - PIKPAK_DEST=/downloads
      - PIKPAK_ENGINE_CONFIG_DIR=/config
    volumes:
      - ./config:/config      # 账号库/链接库（edt-kdf 密文，可整体备份还原）
      - ./pikpak:/downloads              # NAS 本地卷，直写不走 SMB
