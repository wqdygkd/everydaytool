[package]
name = "everydaytool"
version = "1.1.0"
description = "everydaytool (edt) 多功能工具平台 - Tauri 2 桌面壳"
authors = ["wqdygkd"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "everydaytool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["unstable", "devtools"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-log = "2"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
tungstenite = "0.28"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "charset", "json"] }
flate2 = "1"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
regex = "1"
rcgen = { version = "0.13", features = ["x509-parser"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
native-tls = "0.2"
# MITM 服务端：schannel 只接受 RSA 私钥，ECDSA 叶证书用 rustls（ring provider）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
httparse = "1"
brotli = "7"

# telegram-cache（M3-B）MTProto 客户端：用 grammers 这套成熟的 MTProto 2.0 实现，
# 自己只写业务胶水（t.me 链接解析 / 断点续传 / 归档清单 / 取消）。
# 关掉默认的 fs 特性：会话由我们自己加密落盘（grammers-session 的 serde 表示 + 本项目
# 的 key_guard 加密），不需要 sqlite 存储，也不需要 tokio/fs。
[dependencies.grammers-client]
version = "0.11"
default-features = false

[dependencies.grammers-session]
version = "0.11"
default-features = false
features = ["serde"]

[dependencies.grammers-mtsender]
version = "0.11"

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "sync", "time", "macros"]

[target.'cfg(unix)'.dependencies]
# 进程管理（workbuddy2api-panel 的 START/STOP）：SIGTERM / SIGKILL 与存活探测走 libc，
# 平台差异统一在桌面壳里，不靠外部 kill(1) 命令。
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }
windows-version = "0.1"
winreg = "0.55"

[features]
# 生产构建启用：把前端资源内嵌进可执行文件（等价于 tauri CLI 的 --release 行为）
custom-protocol = ["tauri/custom-protocol"]

# ring 的 C 源码在 /Z7 + /Brepro 下会把命令行写进调试记录，路径过长会触发 MSVC D8050。
# 只对 ring 这一个 C 依赖关闭 C 侧调试信息（Rust 代码调试信息保持不变），
# 构建目录因此可以留在仓库内，不需要把 target 放到磁盘根目录。
[profile.dev.package.ring]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
