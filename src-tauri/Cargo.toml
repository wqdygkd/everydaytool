[package]
name = "everydaytool"
version = "1.1.0"
description = "everydaytool (edt) 多功能工具平台 - Tauri 2 桌面壳"
authors = ["everydaytool"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "everydaytool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["unstable", "devtools"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

[features]
# 生产构建启用：把前端资源内嵌进可执行文件（等价于 tauri CLI 的 --release 行为）
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
